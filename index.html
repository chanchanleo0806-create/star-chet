<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - VOIP</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --call: #4cd964; --red: #ff3b30; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; font-family: sans-serif; }

        /* [상단 헤더] */
        header { 
            height: 60px; background: #fff; border-bottom: 1px solid #eee; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; 
        }
        #target-title { font-size: 18px; font-weight: bold; }
        
        /* [전화기 버튼 디자인] */
        .call-btn { 
            width: 44px; height: 44px; background: var(--call); color: white; 
            border: none; border-radius: 50%; font-size: 20px; 
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* [전체화면 통화 레이어] */
        #call-screen { 
            position: fixed; inset: 0; background: linear-gradient(to bottom, #2c3e50, #000); 
            z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; 
        }
        .user-circle { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; border: 2px solid var(--call); }
        .hangup-btn { width: 70px; height: 70px; background: var(--red); border: none; border-radius: 50%; color: white; font-size: 30px; margin-top: 60px; box-shadow: 0 0 20px rgba(255,0,0,0.4); }

        /* 채팅 UI */
        #chat-view { flex: 1; overflow-y: auto; background: var(--bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--main); border-top-right-radius: 2px; }
        .o { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }

        /* 하단 입력바 */
        footer { height: 70px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; gap: 8px; padding: 0 10px; padding-bottom: env(safe-area-inset-bottom); }
        #m-in { flex: 1; height: 45px; background: #f0f0f0; border-radius: 22px; padding: 0 15px; border: none; font-size: 16px; outline: none; }
        .send-btn { width: 60px; height: 45px; background: var(--main); border: none; border-radius: 10px; font-weight: bold; }

        /* 로그인/메뉴 */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 4000; transition: 0.3s; }
        #side-menu.open { left: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3500; display: none; }
    </style>
</head>
<body>

    <div id="call-screen">
        <div class="user-circle">👤</div>
        <h2 id="call-target-name">상대방</h2>
        <p id="call-status">연결 시도 중...</p>
        <button class="hangup-btn" onclick="window.endCall()">✕</button>
    </div>

    <div id="login-ui">
        <h2 style="margin-bottom:30px;">STAR TALK</h2>
        <input type="text" id="myId" style="width:100%; max-width:300px; height:50px; margin-bottom:10px; padding:15px; border:1px solid #ddd; border-radius:10px;" placeholder="아이디">
        <input type="password" id="myPw" style="width:100%; max-width:300px; height:50px; margin-bottom:10px; padding:15px; border:1px solid #ddd; border-radius:10px;" placeholder="비밀번호">
        <button onclick="window.handleLogin()" style="width:100%; max-width:300px; height:50px; background:#000; color:#fff; border:none; border-radius:10px; font-weight:bold;">시작하기</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div style="padding:20px; border-bottom:1px solid #eee; font-weight:bold; display:flex; justify-content:space-between;">
            친구 목록 <button onclick="window.handleAddFriend()">+</button>
        </div>
        <div id="friend-list" style="padding:10px;"></div>
        <button onclick="window.handleLogout()" style="width:100%; padding:15px; border:none; background:#f5f5f5; color:red; margin-top:auto;">로그아웃</button>
    </nav>

    <main id="main-app" style="display:none; flex-direction:column; height:100%;">
        <header>
            <button onclick="window.toggleMenu()" style="background:none; border:none; font-size:24px;">≡</button>
            <b id="target-title">채팅</b>
            <button id="btn-call" class="call-btn" onclick="window.makeCall()">📞</button>
        </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button class="send-btn" onclick="window.handleSend()">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId, peer, currentCall, myStream;

    // 통화 초기화
    function initCallSystem() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님에게 전화가 왔습니다!")) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    call.answer(myStream);
                    setupCall(call);
                } catch(e) { alert("마이크 권한 허용이 필요합니다."); }
            }
        });
    }

    window.makeCall = async () => {
        if(!targetId) return;
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const call = peer.call(targetId, myStream);
            setupCall(call);
        } catch(e) { alert("마이크 권한을 확인해주세요."); }
    };

    function setupCall(call) {
        currentCall = call;
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('call-target-name').innerText = call.peer;
        
        call.on('stream', (remoteStream) => {
            document.getElementById('call-status').innerText = "통화 중...";
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
        });

        call.on('close', () => window.endCall());
        call.on('error', () => window.endCall());
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('call-status').innerText = "연결 시도 중...";
    };

    // 로그인 & 자동로그인
    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            initCallSystem(); loadFriends();
        } else alert("비번 오류");
    };

    window.addEventListener('load', () => {
        const sid = localStorage.getItem('st_id'), spw = localStorage.getItem('st_pw');
        if(sid && spw) {
            document.getElementById('myId').value = sid; document.getElementById('myPw').value = spw;
            window.handleLogin();
        }
    });

    // 공통 기능
    window.toggleMenu = () => {
        document.getElementById('side-menu').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('side-menu').classList.contains('open') ? 'block' : 'none';
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(fid => {
                const item = document.createElement('div');
                item.style = "padding:15px; border-bottom:1px solid #eee; font-weight:bold; cursor:pointer;";
                item.innerHTML = `👤 ${fid}`;
                item.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                list.appendChild(item);
            });
        });
    }

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        document.getElementById('btn-call').style.display = 'flex';
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.s === myId ? 'me' : 'o'}`;
                div.innerText = m.t; v.appendChild(div);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), { t: i.value, s: myId, ts: serverTimestamp() });
        i.value = "";
    };

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:").toLowerCase().trim();
        if(fid && fid !== myId) await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
    };

    window.handleLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
