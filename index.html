<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ... (Firebase 설정 동일) ...
    const db = getDatabase(app);
    let myId, activeRid;

    // [1] 실시간 접속 상태 관리 (접속 중이면 online, 아니면 타임스탬프)
    function managePresence() {
        const myStatusRef = ref(db, `status/${myId}`);
        onValue(ref(db, ".info/connected"), (snap) => {
            if (snap.val() === false) return;
            onDisconnect(myStatusRef).set(serverTimestamp()); // 연결 끊기면 마지막 접속 시간 기록
            set(myStatusRef, "online"); // 연결 시 online 표시
        });
    }

    // [2] 친구 목록에 접속 상태 표시 보정
    window.loadFriends = () => {
        onValue(ref(db, `friends/${myId}`), snap => {
            const l = document.getElementById('friend-list'); l.innerHTML = "";
            if(snap.exists()) Object.keys(snap.val()).forEach(fid => {
                const item = document.createElement('div');
                item.style = "padding:15px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5; cursor:pointer;";
                
                // 상태 표시 점 추가
                const statusDot = document.createElement('span');
                statusDot.id = `status-${fid}`;
                statusDot.style = "width:10px; height:10px; border-radius:50%; background:#ccc;"; // 기본 오프라인(회색)

                onValue(ref(db, `status/${fid}`), sSnap => {
                    const status = sSnap.val();
                    statusDot.style.background = (status === "online") ? "#2ecc71" : "#ccc"; // 온라인이면 초록색
                });

                item.innerHTML = `<img src="https://via.placeholder.com/45" style="border-radius:15px; width:45px;">`;
                const nameInfo = document.createElement('b'); nameInfo.innerText = fid;
                
                item.appendChild(statusDot);
                item.appendChild(nameInfo);
                item.onclick = () => { /* 프로필 팝업 로직 */ };
                l.appendChild(item);
            });
        });
    };

    // [3] 읽음 확인 (안 읽은 사람 수 표시) 보정
    window.openChat = (fid) => {
        activeRid = [myId, fid].sort().join('_');
        // 방에 들어가는 순간, 상대방이 보낸 메시지들을 '읽음' 처리
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) {
                const msgs = snap.val();
                Object.keys(msgs).forEach(key => {
                    const m = msgs[key];
                    // 상대방이 보낸 메시지인데 아직 안 읽었다면(read: false) 업데이트
                    if(m.s !== myId && !m.read) {
                        update(ref(db, `msgs/${activeRid}/${key}`), { read: true });
                    }

                    const d = document.createElement('div');
                    d.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                    
                    // 읽음 표시 숫자 (1이 떠있으면 안 읽음, 없어지면 읽음)
                    const readStatus = (m.s === myId && !m.read) ? `<small style="color:var(--yellow); margin-right:5px;">1</small>` : "";
                    
                    d.innerHTML = `${readStatus} <span>${m.t}</span>`;
                    v.appendChild(d);
                });
            }
            v.scrollTop = v.scrollHeight;
        });
    };

    // [4] 메시지 전송 시 기본 read 상태는 false
    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), {
            s: myId,
            t: i.value.trim(),
            read: false, // 전송 시엔 읽지 않은 상태
            ts: serverTimestamp()
        });
        i.value = "";
    };

    function startApp() {
        // ... (기존 로그인 로직) ...
        managePresence();
        loadFriends();
    }
</script>
