<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카카오톡</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --k-yellow: #fee500; --k-bg: #abc1d1; --k-white: #ffffff; --k-text: #3c1e1e; --k-header: #abc1d1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--k-bg); }

        /* [상단 헤더] */
        header { height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: var(--k-header); position: sticky; top: 0; z-index: 100; }
        .back-icon { font-size: 20px; cursor: pointer; display: flex; align-items: center; }
        #chat-title { font-size: 18px; font-weight: 600; flex: 1; margin-left: 10px; }
        .header-icons span { margin-left: 15px; font-size: 20px; cursor: pointer; }

        /* [채팅 영역] */
        #chat-view { height: calc(100vh - 115px); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg-row { display: flex; margin-bottom: 15px; position: relative; }
        .msg-row.me { flex-direction: row-reverse; }
        
        .profile-img { width: 40px; height: 40px; background: #eee; border-radius: 15px; margin-right: 8px; }
        .me .profile-img { display: none; }

        .msg-content { display: flex; flex-direction: column; max-width: 70%; }
        .me .msg-content { align-items: flex-end; }

        .user-name { font-size: 12px; color: #444; margin-bottom: 3px; }
        .bubble-group { display: flex; align-items: flex-end; gap: 5px; }
        .me .bubble-group { flex-direction: row-reverse; }

        .bubble { padding: 8px 12px; border-radius: 13px; font-size: 14.5px; line-height: 1.4; position: relative; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .o .bubble { background: var(--k-white); border-top-left-radius: 2px; }
        .me .bubble { background: var(--k-yellow); border-top-right-radius: 2px; }

        /* 읽음 숫자 (노란색) */
        .unread { color: var(--k-yellow); font-size: 10px; font-weight: bold; margin-bottom: 2px; }

        /* [하단 입력창] */
        footer { height: 60px; background: #fff; display: flex; align-items: center; padding: 0 10px; gap: 8px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #ddd; }
        #m-in { flex: 1; height: 36px; border: 1px solid #ddd; border-radius: 18px; padding: 0 15px; font-size: 15px; outline: none; background: #fcfcfc; }
        .send-btn { width: 50px; height: 36px; background: var(--k-yellow); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* [로그인 화면] */
        #login-screen { position: fixed; inset: 0; background: var(--k-yellow); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .l-input { width: 100%; height: 45px; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); background: transparent; margin-bottom: 10px; font-size: 16px; outline: none; }
        .l-btn { width: 100%; height: 45px; background: #3c1e1e; color: white; border: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }

        /* [통화 레이어] */
        #voip-ui { position: fixed; inset: 0; background: #2c3e50; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .call-end-btn { width: 65px; height: 65px; background: #ff3b30; border-radius: 50%; border: none; color: white; font-size: 28px; margin-top: 50px; cursor: pointer; }

        /* [사이드바] */
        #side-bar { position: fixed; top: 0; left: -100%; width: 85%; height: 100%; background: #fff; z-index: 500; transition: 0.3s; padding-top: 50px; }
        #side-bar.open { left: 0; }
        .room-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color:#3c1e1e; margin-bottom:50px;">카카오톡</h2>
        <input type="text" id="myId" class="l-input" placeholder="카카오계정 아이디">
        <input type="password" id="myPw" class="l-input" placeholder="비밀번호">
        <button class="l-btn" onclick="window.handleLogin()">로그인</button>
    </div>

    <div id="voip-ui">
        <div style="font-size: 22px; margin-bottom: 10px;" id="voip-name">보이스톡</div>
        <div id="voip-status">연결 시도 중...</div>
        <button class="call-end-btn" onclick="window.endCall()">✕</button>
    </div>

    <div id="side-bar">
        <div style="padding:15px; display:flex; justify-content:space-between;">
            <b>채팅 목록</b> <button onclick="window.createGroup()">+</button>
        </div>
        <div id="room-list"></div>
        <button onclick="window.handleLogout()" style="position:absolute; bottom:20px; left:20px; border:none; color:red;">로그아웃</button>
    </div>

    <main id="main-ui" style="display:none;">
        <header>
            <div class="back-icon" onclick="window.toggleSidebar()">☰</div>
            <div id="chat-title">채팅방</div>
            <div class="header-icons">
                <span onclick="window.makeCall()">📞</span>
                <span>🔍</span>
            </div>
        </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" onkeypress="if(event.keyCode==13) window.handleSend()">
            <button class="send-btn" onclick="window.handleSend()">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, currentChatId, currentMembers = [], peer, currentCall, myStream;

    // [전화 기능]
    async function initVoIP() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm("보이스톡 요청이 왔습니다. 받으시겠습니까?")) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    call.answer(myStream);
                    startCallUI(call);
                } catch(e) { alert("마이크 권한 오류"); }
            }
        });
    }

    window.makeCall = async () => {
        const tid = prompt("전화할 친구 아이디:");
        if(!tid) return;
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const call = peer.call(tid, myStream);
            startCallUI(call);
        } catch(e) { alert("마이크 권한을 허용해주세요."); }
    };

    function startCallUI(call) {
        currentCall = call;
        document.getElementById('voip-ui').style.display = 'flex';
        document.getElementById('voip-name').innerText = call.peer;
        call.on('stream', stream => {
            const audio = new Audio(); audio.srcObject = stream; audio.play();
            document.getElementById('voip-status').innerText = "통화 중";
        });
        call.on('close', () => window.endCall());
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('voip-ui').style.display = 'none';
    };

    // [채팅 및 로그인]
    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id; localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            initVoIP(); loadRooms();
        } else alert("정보가 일치하지 않습니다.");
    };

    window.createGroup = async () => {
        const res = prompt("초대할 아이디 (쉼표 구분):");
        if(!res) return;
        let members = res.split(',').map(s => s.trim().toLowerCase());
        members.push(myId);
        const rid = "room_" + Date.now();
        for(const m of members) await set(ref(db, `userRooms/${m}/${rid}`), { name: members.join(', '), members });
        window.toggleSidebar();
    };

    function loadRooms() {
        onValue(ref(db, `userRooms/${myId}`), snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([rid, info]) => {
                const div = document.createElement('div');
                div.className = "room-item";
                div.innerHTML = `👤 ${info.name}`;
                div.onclick = () => { window.enterChat(rid, info); window.toggleSidebar(); };
                list.appendChild(div);
            });
        });
    }

    window.enterChat = (rid, info) => {
        currentChatId = rid; currentMembers = info.members;
        document.getElementById('chat-title').innerText = info.name;
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([mid, m]) => {
                if(!m.readers || !m.readers[myId]) update(ref(db, `msgs/${rid}/${mid}/readers`), {[myId]: true});
                const unread = currentMembers.length - (m.readers ? Object.keys(m.readers).length : 0);
                const isMe = m.s === myId;
                const row = document.createElement('div');
                row.className = `msg-row ${isMe ? 'me' : 'o'}`;
                row.innerHTML = `
                    <div class="profile-img"></div>
                    <div class="msg-content">
                        ${!isMe ? `<div class="user-name">${m.s}</div>` : ''}
                        <div class="bubble-group">
                            <div class="bubble">${m.t}</div>
                            ${unread > 0 ? `<span class="unread">${unread}</span>` : ''}
                        </div>
                    </div>
                `;
                v.appendChild(row);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !currentChatId) return;
        push(ref(db, `msgs/${currentChatId}`), { t: i.value, s: myId, readers: {[myId]: true} });
        i.value = "";
    };

    window.toggleSidebar = () => document.getElementById('side-bar').classList.toggle('open');
    window.handleLogout = () => { localStorage.clear(); location.reload(); };
    window.addEventListener('load', () => {
        const sid = localStorage.getItem('st_id'), spw = localStorage.getItem('st_pw');
        if(sid && spw) { document.getElementById('myId').value = sid; document.getElementById('myPw').value = spw; window.handleLogin(); }
    });
</script>
</body>
</html>
