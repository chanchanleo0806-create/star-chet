<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --yellow: #fee500; --chat-bg: #abc1d1; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

        /* [로그인 UI] */
        #auth-ui { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; text-align: center; background: rgba(255,255,255,0.1); padding: 40px 20px; border-radius: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: none; outline: none; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: var(--yellow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }

        /* [메인 & 채팅] */
        #main-app { display: none; height: 100%; }
        nav { width: 70px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .content { flex: 1; background: #fff; color: #000; border-radius: 25px 0 0 0; }
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); display: none; flex-direction: column; z-index: 900; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px; border-radius: 12px; font-size: 14px; max-width: 80%; word-break: break-all; }
        .me { align-self: flex-end; background: var(--yellow); }
        .you { align-self: flex-start; background: #fff; }
        .input-bar { padding: 10px; background: #fff; display: flex; gap: 8px; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }

        /* [통화 UI] */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; border: 2px solid #fff; border-radius: 10px; }
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <h2>STAR TALK</h2>
        <input type="text" id="loginId" placeholder="아이디">
        <input type="password" id="loginPw" placeholder="비밀번호">
        <button class="btn-main" onclick="window.doLogin()">로그인</button>
        <button class="btn-main" style="background: #444; color:#fff;" onclick="window.doSignup()">회원가입</button>
    </div>
</div>

<div id="main-app" style="display: flex;">
    <nav><div onclick="window.doLogout()" style="font-size:24px; color:var(--yellow); cursor:pointer;">🚪</div></nav>
    <div class="content">
        <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">+ 추가</span></div>
        <div id="friend-list"></div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; display:flex; align-items:center; background:rgba(255,255,255,0.3);">
        <button onclick="window.closeChat()">◀</button>
        <b id="chat-target" style="margin-left:10px;">채팅</b>
        <button onclick="window.initCall(true)" style="margin-left:auto;">🎥 통화</button>
    </div>
    <div id="chat-view"></div>
    <div class="input-bar">
        <label style="font-size:20px; cursor:pointer;">🖼️<input type="file" hidden onchange="window.handleFile(this)"></label>
        <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:10px;">전송</button>
    </div>
</div>

<div id="call-ui">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); background:red; padding:15px; border-radius:50%; cursor:pointer;" onclick="window.endCall()">✕</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push, off, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", 
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "starchet-e9630" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, selFid, peer, myStream, currentCall;

    // [로그인/회원가입]
    window.doSignup = async () => {
        const id = document.getElementById('loginId').value.trim().toLowerCase();
        const pw = document.getElementById('loginPw').value.trim();
        if(!id || !pw) return alert("아이디/비번 입력!");
        const userRef = ref(db, `users/${id}`);
        const snap = await get(userRef);
        if(snap.exists()) return alert("중복 아이디");
        await set(userRef, { id, pw, name: id }); alert("가입성공! 로그인을 눌러주세요.");
    };

    window.doLogin = async () => {
        const id = document.getElementById('loginId').value.trim().toLowerCase();
        const pw = document.getElementById('loginPw').value.trim();
        const snap = await get(ref(db, `users/${id}`));
        if(snap.exists() && snap.val().pw === pw) {
            myId = id; localStorage.setItem('st_id', id); startApp();
        } else alert("정보 불일치");
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        set(ref(db, `status/${myId}`), "online");
        onDisconnect(ref(db, `status/${myId}`)).set(serverTimestamp());

        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm("전화가 왔습니다!")) {
                myStream = await navigator.mediaDevices.getUserMedia({audio:true, video:call.metadata.video});
                call.answer(myStream);
                handleCall(call);
            }
        });
        loadFriends();
    }

    // [중요: 채팅방 아이디 정렬 로직]
    window.openChat = (fid) => {
        if(activeRid) off(ref(db, `msgs/${activeRid}`));
        selFid = fid;
        // 두 사용자 아이디를 사전순으로 정렬하여 방 이름을 만듭니다 (A_B와 B_A는 같은 방이 됨)
        activeRid = [myId, fid].sort().join('_');
        
        document.getElementById('chat-target').innerText = fid;
        document.getElementById('chat-window').style.display = 'flex';

        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()){
                Object.values(snap.val()).forEach(m => {
                    const div = document.createElement('div');
                    div.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                    if(m.type === 'file') div.innerHTML = `<img src="${m.file}" style="max-width:200px; border-radius:10px;" onclick="window.open(this.src)">`;
                    else div.innerText = m.t;
                    v.appendChild(div);
                });
            }
            v.scrollTop = v.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), { s: myId, t: i.value.trim(), time: serverTimestamp() });
        i.value = ""; i.focus();
    };

    window.handleFile = (el) => {
        const file = el.files[0];
        const reader = new FileReader();
        reader.onload = () => push(ref(db, `msgs/${activeRid}`), { s: myId, type: 'file', file: reader.result });
        reader.readAsDataURL(file);
    };

    window.addFriend = () => {
        const f = prompt("친구 아이디:");
        if(f && f !== myId) {
            // 양방향 친구 추가 (내가 추가하면 상대방 목록에도 내가 뜨게 함)
            update(ref(db), {[`friends/${myId}/${f}`]:true, [`friends/${f}/${myId}`]:true});
        }
    };

    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(fid => {
                    const d = document.createElement('div');
                    d.style.padding = "15px"; d.style.borderBottom = "1px solid #eee"; d.innerText = fid;
                    d.onclick = () => window.openChat(fid);
                    list.appendChild(d);
                });
            }
        });
    }

    // 통화/로그아웃 생략 (위와 동일)
    window.initCall = async(v)=>{ myStream=await navigator.mediaDevices.getUserMedia({audio:true,video:v}); document.getElementById('local-video').srcObject=myStream; handleCall(peer.call(selFid,myStream,{metadata:{video:v}})); };
    function handleCall(c){ currentCall=c; document.getElementById('call-ui').style.display='block'; c.on('stream',s=>{ document.getElementById('remote-video').srcObject=s; }); }
    window.endCall=()=>{ if(currentCall)currentCall.close(); if(myStream)myStream.getTracks().forEach(t=>t.stop()); document.getElementById('call-ui').style.display='none'; };
    window.closeChat = () => document.getElementById('chat-window').style.display = 'none';
    window.doLogout = () => { localStorage.clear(); location.reload(); };
    if(localStorage.getItem('st_id')) { myId = localStorage.getItem('st_id'); startApp(); }
</script>
</body>
</html>
