<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK NEO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --card: rgba(255, 255, 255, 0.03); --yellow: #fee500; --accent: #ff3b30; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

        /* [1] 하이엔드 다크 로그인 스타일 */
        #auth-ui { position: fixed; inset: 0; background: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #0a0a0c 100%); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 340px; background: var(--card); backdrop-filter: blur(20px); padding: 50px 30px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center; }
        .auth-header h2 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-header p { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 40px; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 18px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--yellow); background: rgba(255,255,255,0.1); }
        
        .btn-login { width: 100%; padding: 18px; background: var(--yellow); color: #000; border: none; border-radius: 20px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 20px rgba(254, 229, 0, 0.2); }
        .btn-login:active { transform: scale(0.97); }
        .auth-footer { margin-top: 25px; font-size: 14px; color: rgba(255,255,255,0.4); }
        .auth-footer span { color: #fff; cursor: pointer; text-decoration: underline; margin-left: 8px; font-weight: 600; }

        /* [2] 메인 앱 레이아웃 (이전 기능 통합) */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 75px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 30px; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { color: #444; cursor: pointer; font-size: 26px; transition: 0.3s; }
        .nav-item.active { color: var(--yellow); }

        .content-panel { flex: 1; position: relative; background: #fff; color: #000; border-radius: 30px 0 0 0; overflow: hidden; }
        /* ... 기타 스타일 (채팅, 프로필 등)은 이전과 동일하게 유지하되 디자인 톤 매칭 ... */
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">STAR TALK</h2>
            <p id="auth-sub">소중한 인연을 잇는 공간</p>
        </div>
        <div class="input-group">
            <input type="text" id="authId" placeholder="아이디" spellcheck="false">
        </div>
        <div class="input-group">
            <input type="password" id="authPw" placeholder="비밀번호">
        </div>
        <div id="signup-fields" style="display:none;">
            <div class="input-group">
                <input type="text" id="authName" placeholder="닉네임">
            </div>
        </div>
        <button class="btn-login" id="auth-btn" onclick="window.handleAuth('login')">로그인</button>
        <div class="auth-footer" id="auth-toggle-area">
            계정이 없으신가요? <span onclick="window.toggleAuth('signup')">회원가입</span>
        </div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="nav-item" onclick="window.showPanel('set', this)">⚙️</div>
    </nav>
    <div class="content-panel">
        <div id="panel-friend" style="height:100%; display:flex; flex-direction:column;">
            <div style="padding:25px; font-size:20px; font-weight:800;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer; color:var(--yellow); background:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;">+</span></div>
            <div id="friend-list" style="flex:1; overflow-y:auto; padding:0 10px;"></div>
        </div>
        <div id="panel-set" style="display:none; padding:40px; text-align:center;">
             <div style="margin-bottom:20px;"><img id="my-pic" src="https://via.placeholder.com/100" style="width:110px; height:110px; border-radius:40px; object-fit:cover;"></div>
             <h3 id="my-name-ui" style="font-size:22px; margin-bottom:10px;">이름</h3>
             <button onclick="window.doLogout()" style="color:#ff3b30; font-weight:600; background:none; border:none; margin-top:30px;">로그아웃</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId;

    // [1] 로그인/회원가입 전환 로직 보정
    window.toggleAuth = (mode) => {
        const isLogin = mode === 'login';
        document.getElementById('auth-title').innerText = isLogin ? "STAR TALK" : "JOIN US";
        document.getElementById('signup-fields').style.display = isLogin ? "none" : "block";
        document.getElementById('auth-btn').innerText = isLogin ? "로그인" : "회원가입 완료";
        document.getElementById('auth-btn').onclick = () => window.handleAuth(mode);
        document.getElementById('auth-toggle-area').innerHTML = isLogin ? 
            `계정이 없으신가요? <span onclick="window.toggleAuth('signup')">회원가입</span>` :
            `이미 회원이신가요? <span onclick="window.toggleAuth('login')">로그인으로 돌아가기</span>`;
    };

    // [2] 로그인 불일치 해결 및 중복가입 방지 로직
    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        const name = document.getElementById('authName').value.trim();

        if(!id || !pw) return alert("아이디와 비밀번호를 입력해주세요.");

        const userRef = ref(db, `users/${id}`);
        const snap = await get(userRef);

        if(type === 'signup') {
            if(snap.exists()) return alert("이미 사용 중인 아이디입니다.");
            if(!name) return alert("닉네임을 입력해주세요.");
            await set(userRef, { id, pw, name, pic: "" });
            alert("회원가입 성공! 이제 로그인하세요.");
            window.toggleAuth('login');
        } else {
            // 로그인 데이터 검증 (공백 제거 및 존재 여부 확인 필수)
            if(snap.exists()) {
                const userData = snap.val();
                if(String(userData.pw) === String(pw)) { // 문자열 강제 변환 후 비교 (불일치 방지)
                    myId = id;
                    localStorage.setItem('st_id', id);
                    startApp();
                } else {
                    alert("비밀번호가 일치하지 않습니다.");
                }
            } else {
                alert("존재하지 않는 아이디입니다.");
            }
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        onValue(ref(db, `users/${myId}`), snap => {
            if(snap.exists()){
                const d = snap.val();
                document.getElementById('my-name-ui').innerText = d.name;
                if(d.pic) document.getElementById('my-pic').src = d.pic;
            }
        });
        loadFriends();
    }

    // 친구 목록 로드 (디자인 보정)
    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(fid => {
                    const item = document.createElement('div');
                    item.style = "padding:15px; display:flex; align-items:center; gap:15px; border-bottom:1px solid #f9f9f9; cursor:pointer;";
                    item.innerHTML = `<div style="width:45px; height:45px; border-radius:18px; background:#eee;"></div><b>${fid}</b>`;
                    list.appendChild(item);
                });
            }
        });
    }

    window.showPanel = (p, el) => {
        document.getElementById('panel-friend').style.display = p === 'friend' ? 'flex' : 'none';
        document.getElementById('panel-set').style.display = p === 'set' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    };

    window.doLogout = () => { localStorage.clear(); location.reload(); };

    // 자동 로그인
    if(localStorage.getItem('st_id')) {
        myId = localStorage.getItem('st_id');
        startApp();
    }
</script>
</body>
</html>
