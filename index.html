<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - SYNC</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --yellow: #fee500; --chat-bg: #abc1d1; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
        #auth-ui { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; text-align: center; background: rgba(255,255,255,0.1); padding: 40px 20px; border-radius: 30px; backdrop-filter: blur(10px); }
        .auth-card input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: none; outline: none; font-size: 16px; color: #000; }
        .btn-main { width: 100%; padding: 15px; background: var(--yellow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: #000; }
        #main-app { display: none; height: 100%; }
        nav { width: 70px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-right: 1px solid #222; }
        .content { flex: 1; background: #fff; color: #000; border-radius: 25px 0 0 0; position: relative; }
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); display: none; flex-direction: column; z-index: 900; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px; border-radius: 12px; font-size: 14px; max-width: 80%; word-break: break-all; }
        .me { align-self: flex-end; background: var(--yellow); }
        .you { align-self: flex-start; background: #fff; }
        .input-bar { padding: 10px; background: #fff; display: flex; gap: 8px; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <h2 style="margin-bottom:20px;">STAR TALK</h2>
        <input type="text" id="loginId" placeholder="아이디">
        <input type="password" id="loginPw" placeholder="비밀번호">
        <button class="btn-main" onclick="window.doLogin()">로그인</button>
        <button class="btn-main" style="background:#444; color:#fff;" onclick="window.doSignup()">통합 회원가입</button>
        <p style="font-size:11px; color:#888; margin-top:10px;">가입 시 기존 스타톡과 새 서버에 동시 등록됩니다.</p>
    </div>
</div>

<div id="main-app">
    <nav><div onclick="window.doLogout()" style="cursor:pointer; font-size:24px;">🚪</div></nav>
    <div class="content">
        <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">
            친구 목록 <span onclick="window.addFriend()" style="float:right; cursor:pointer; background:#000; color:#fff; padding:2px 8px; border-radius:10px; font-size:12px;">+</span>
        </div>
        <div id="friend-list"></div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; background:rgba(255,255,255,0.2); border-bottom:1px solid rgba(0,0,0,0.1);">
        <button onclick="window.closeChat()" style="border:none; background:none; cursor:pointer;">◀</button> <b id="chat-target" style="margin-left:10px;"></b>
    </div>
    <div id="chat-view"></div>
    <div class="input-bar">
        <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:15px; font-weight:bold;">전송</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, push, off, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // [1] 기존 스타톡 서버
    const configOld = { 
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", 
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "starchet-e9630" 
    };

    // [2] 보내주신 새로운 ID 서버
    const configNew = { 
        apiKey: "AIzaSyDtvTt2O90SlBgONaIs2ahWJX_3N_-xjso",
        authDomain: "id-d5c4d.firebaseapp.com",
        databaseURL: "https://id-d5c4d-default-rtdb.firebaseio.com", // 주소 형식 자동 보정
        projectId: "id-d5c4d",
        storageBucket: "id-d5c4d.firebasestorage.app",
        messagingSenderId: "593841028206",
        appId: "1:593841028206:web:fc16e5941b549ac7cbba7f"
    };

    const appOld = initializeApp(configOld, "old");
    const appNew = initializeApp(configNew, "new");
    const dbOld = getDatabase(appOld);
    const dbNew = getDatabase(appNew);

    let myId, activeRid;

    // 통합 회원가입 (양쪽 DB에 저장)
    window.doSignup = async () => {
        const id = document.getElementById('loginId').value.trim().toLowerCase();
        const pw = document.getElementById('loginPw').value.trim();
        if(!id || !pw) return alert("아이디와 비밀번호를 입력하세요!");

        try {
            await Promise.all([
                set(ref(dbOld, `users/${id}`), { id, pw }),
                set(ref(dbNew, `users/${id}`), { id, pw })
            ]);
            alert("통합 회원가입 완료! 이제 로그인 하세요.");
        } catch(e) { 
            alert("가입 실패: 파이어베이스 'Rules' 설정을 확인하세요."); 
        }
    };

    // 로그인 (기존 서버 데이터 기준)
    window.doLogin = async () => {
        const id = document.getElementById('loginId').value.trim().toLowerCase();
        const pw = document.getElementById('loginPw').value.trim();
        const snap = await get(ref(dbOld, `users/${id}`));
        
        if(snap.exists() && snap.val().pw === pw) {
            myId = id; localStorage.setItem('st_id', id); startApp();
        } else alert("아이디 또는 비밀번호가 틀립니다.");
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        loadFriends();
    }

    window.openChat = (fid) => {
        if(activeRid) off(ref(dbOld, `msgs/${activeRid}`));
        activeRid = [myId, fid].sort().join('_');
        document.getElementById('chat-target').innerText = fid;
        document.getElementById('chat-window').style.display = 'flex';

        onValue(ref(dbOld, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) {
                Object.values(snap.val()).forEach(m => {
                    const d = document.createElement('div');
                    d.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                    d.innerText = m.t;
                    v.appendChild(d);
                });
            }
            v.scrollTop = v.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(dbOld, `msgs/${activeRid}`), { s: myId, t: i.value.trim(), time: serverTimestamp() });
        i.value = ""; i.focus();
    };

    window.addFriend = () => {
        const f = prompt("추가할 친구 ID:");
        if(f && f !== myId) set(ref(dbOld, `friends/${myId}/${f}`), true);
    };

    function loadFriends() {
        onValue(ref(dbOld, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(fid => {
                    const d = document.createElement('div');
                    d.style.padding = "15px 20px"; d.style.borderBottom = "1px solid #eee"; d.style.cursor = "pointer";
                    d.innerHTML = `<b>${fid}</b>`;
                    d.onclick = () => window.openChat(fid);
                    list.appendChild(d);
                });
            }
        });
    }

    window.closeChat = () => document.getElementById('chat-window').style.display = 'none';
    window.doLogout = () => { localStorage.clear(); location.reload(); };
    if(localStorage.getItem('st_id')) { myId = localStorage.getItem('st_id'); startApp(); }
</script>
</body>
</html>
