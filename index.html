
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK</title>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --text: #000000; --gray: #f4f4f4; --line: #eeeeee; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [Main Layout] */
        #app { display: flex; height: 100%; width: 100%; }
        
        /* [Side Bar] */
        nav { width: 65px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 30px; flex-shrink: 0; }
        .s-icon { color: #555; font-size: 22px; cursor: pointer; }
        .s-icon.active { color: #fff; }

        /* [Friend List Area] */
        #list-container { flex: 1; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
        .header-title { padding: 20px; font-size: 22px; font-weight: 800; }
        
        /* 내 프로필 영역 */
        #my-profile-section { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .p-img { width: 55px; height: 55px; background: var(--gray); border-radius: 20px; flex-shrink: 0; }
        .p-info { display: flex; flex-direction: column; gap: 4px; }
        .p-name { font-weight: bold; font-size: 16px; }
        .p-msg { font-size: 13px; color: #888; }
        
        .hr-line { margin: 10px 20px; border: 0; border-top: 1px solid var(--line); }

        /* 친구 목록 */
        #room-list { flex: 1; overflow-y: auto; padding-top: 10px; }
        .friend-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .friend-item:hover { background: var(--gray); }
        .f-img { width: 45px; height: 45px; background: var(--gray); border-radius: 17px; }

        /* [Chat Window - 초기 숨김] */
        #chat-window { position: absolute; inset: 0 0 0 65px; background: #fff; z-index: 100; display: none; flex-direction: column; }
        #chat-window.open { display: flex; }
        
        .c-header { height: 60px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
        .c-input-area { padding: 15px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
        
        /* [Profile Overlay] */
        #profile-overlay { position: fixed; inset: 0; background: #1a1a1a; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .close-p { position: absolute; top: 30px; left: 30px; font-size: 24px; cursor: pointer; }
        .p-footer { width: 100%; max-width: 300px; display: flex; justify-content: space-around; margin-top: 100px; border-top: 1px solid #333; padding-top: 30px; }
        .p-btn { text-align: center; cursor: pointer; color: #aaa; }
        .p-btn:hover { color: #fff; }

        /* [Bubbles] */
        .bubble { padding: 8px 14px; border-radius: 15px; font-size: 14px; max-width: 70%; line-height: 1.5; }
        .me { align-self: flex-end; background: #000; color: #fff; }
        .o { align-self: flex-start; background: var(--gray); color: #000; }

        /* [Login] */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .l-box { width: 320px; background: #fff; padding: 40px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; }
        .l-input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="l-box">
        <h2 style="text-align:center; margin-bottom:20px;">STAR TALK</h2>
        <input type="text" id="myId" class="l-input" placeholder="ID">
        <input type="password" id="myPw" class="l-input" placeholder="Password">
        <button onclick="window.handleLogin()" style="padding:12px; background:#000; color:#fff; border:none; border-radius:8px; font-weight:bold;">로그인</button>
    </div>
</div>

<div id="profile-overlay">
    <span class="close-p" onclick="window.closeProfile()">✕</span>
    <div style="width:100px; height:100px; background:#444; border-radius:40px; margin-bottom:20px;"></div>
    <h2 id="p-detail-name">이름</h2>
    <p style="color:#888; margin-top:10px;">상태 메시지 없음</p>
    <div class="p-footer">
        <div class="p-btn" id="go-chat-btn"><div>💬</div><div style="font-size:12px; margin-top:5px;">채팅</div></div>
        <div class="p-btn"><div>📞</div><div style="font-size:12px; margin-top:5px;">전화</div></div>
        <div class="p-btn"><div>🎥</div><div style="font-size:12px; margin-top:5px;">영상통화</div></div>
    </div>
</div>

<div id="app">
    <nav>
        <div class="s-icon active">👤</div>
        <div class="s-icon">💬</div>
        <div class="s-icon" style="margin-top:auto; margin-bottom:30px;" onclick="location.reload()">🚪</div>
    </nav>

    <div id="list-container">
        <div class="header-title">친구</div>
        
        <div id="my-profile-section">
            <div class="p-img"></div>
            <div class="p-info">
                <span class="p-name" id="my-name-display">나</span>
                <span class="p-msg">상태 메시지를 입력하세요</span>
            </div>
        </div>

        <hr class="hr-line">

        <div id="room-list"></div>
    </div>

    <div id="chat-window">
        <div class="c-header">
            <span style="cursor:pointer; font-weight:bold;" onclick="window.closeChat()">◀</span>
            <b id="chat-target-name">이름</b>
            <span style="color:#999;">🔍 ⋮</span>
        </div>
        <div id="chat-view"></div>
        <div class="c-input-area">
            <input type="text" id="m-in" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; outline:none;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="padding:10px 20px; background:#000; color:#fff; border:none; border-radius:20px;">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, currentChatId;

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        if(!id) return;
        myId = id;
        document.getElementById('my-name-display').innerText = id;
        document.getElementById('login-screen').style.display = 'none';
        loadFriends();
    };

    function loadFriends() {
        onValue(ref(db, `userRooms/${myId}`), snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([rid, info]) => {
                const div = document.createElement('div');
                div.className = "friend-item";
                div.innerHTML = `<div class="f-img"></div><div class="p-name">${info.name}</div>`;
                div.onclick = () => window.openProfile(rid, info);
                list.appendChild(div);
            });
        });
        // 임시 친구 추가 기능 (테스트용)
        if(confirm("테스트 친구를 추가할까요?")) {
            const tid = prompt("친구 ID:");
            if(tid) set(ref(db, `userRooms/${myId}/room_1`), { name: tid, members: [myId, tid] });
        }
    }

    window.openProfile = (rid, info) => {
        document.getElementById('p-detail-name').innerText = info.name;
        document.getElementById('profile-overlay').style.display = 'flex';
        document.getElementById('go-chat-btn').onclick = () => {
            window.enterChat(rid, info);
            window.closeProfile();
        };
    };

    window.closeProfile = () => document.getElementById('profile-overlay').style.display = 'none';

    window.enterChat = (rid, info) => {
        currentChatId = rid;
        document.getElementById('chat-target-name').innerText = info.name;
        document.getElementById('chat-window').classList.add('open');
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([mid, m]) => {
                const d = document.createElement('div');
                d.className = `bubble ${m.s === myId ? 'me' : 'o'}`;
                d.innerText = m.t;
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.closeChat = () => document.getElementById('chat-window').classList.remove('open');

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !currentChatId) return;
        push(ref(db, `msgs/${currentChatId}`), { t: i.value, s: myId });
        i.value = "";
    };
</script>
</body>
</html>
