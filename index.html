<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - Auto Login</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --line: #eeeeee; --gray: #f8f8f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        #main-app { display: none; height: 100%; width: 100%; }
        
        /* [Side Bar] */
        nav { width: 65px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 30px; flex-shrink: 0; }
        .s-icon { color: #555; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .s-icon.active { color: #fff; }

        /* [Content Area] */
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
        .content-panel.active { display: flex; }
        .panel-header { padding: 25px 20px; font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }

        /* [List Item] */
        .list-item { padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: background 0.2s; }
        .list-item:hover { background: var(--gray); }
        .p-img { width: 52px; height: 52px; background: #eee; border-radius: 20px; flex-shrink: 0; border: 1px solid #f0f0f0; }
        .p-text { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .p-text b { font-size: 15px; color: #000; }
        .p-text span { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hr { height: 1px; background: #f2f2f2; margin: 10px 20px; }

        /* [Chat Window] */
        #chat-window { position: fixed; inset: 0 0 0 65px; background: #fff; z-index: 100; display: none; flex-direction: column; }
        .c-header { height: 60px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #fff; }
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; background: #f9f9f9; display: flex; flex-direction: column; gap: 12px; }
        .input-box { padding: 15px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: #fff; }
        .input-box input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }

        /* [Overlays] */
        .overlay { position: fixed; inset: 0; background: rgba(17, 17, 17, 0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .edit-input { background: none; border: none; border-bottom: 1px solid #444; color: #fff; text-align: center; font-size: 18px; padding: 10px; margin: 5px; width: 220px; outline: none; }
        
        .bubble { padding: 10px 15px; border-radius: 18px; font-size: 14px; max-width: 75%; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .me { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .o { align-self: flex-start; background: #fff; color: #000; border: 1px solid #eee; border-bottom-left-radius: 4px; }

        /* [Login UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 320px; padding: 40px; border-radius: 20px; display: flex; flex-direction: column; gap: 15px; }
        .login-card h1 { text-align: center; margin-bottom: 20px; font-weight: 900; letter-spacing: -1px; }
        .login-btn { padding: 15px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-card">
        <h1>STAR TALK</h1>
        <input type="text" id="myId" placeholder="아이디" style="padding:15px; border:1px solid #eee; border-radius:12px; outline:none;">
        <button onclick="window.doLogin()" class="login-btn">로그인</button>
    </div>
</div>

<div id="my-edit-popup" class="overlay">
    <span onclick="this.parentElement.style.display='none'" style="position:absolute; top:40px; right:40px; cursor:pointer; font-size:24px;">✕</span>
    <div style="width:100px; height:100px; background:#333; border-radius:40px; margin-bottom:25px;"></div>
    <input type="text" id="edit-name" class="edit-input" placeholder="이름">
    <input type="text" id="edit-status" class="edit-input" placeholder="상태 메시지" style="font-size:14px; color:#888;">
    <button onclick="window.saveProfile()" style="margin-top:40px; padding:12px 50px; background:#fff; color:#000; border:none; border-radius:25px; font-weight:bold; cursor:pointer;">저장하기</button>
</div>

<div id="profile-popup" class="overlay">
    <span onclick="this.parentElement.style.display='none'" style="position:absolute; top:40px; left:40px; cursor:pointer; font-size:24px;">✕</span>
    <div style="width:110px; height:110px; background:#333; border-radius:42px; margin-bottom:25px;"></div>
    <h2 id="p-name">사용자</h2>
    <div style="display:flex; gap:50px; margin-top:120px; border-top:1px solid #333; padding-top:40px; width:280px; justify-content:center;">
        <div class="p-btn" id="btn-go-chat" style="cursor:pointer; text-align:center;">💬<br><span style="font-size:12px; margin-top:8px; display:inline-block;">채팅</span></div>
        <div class="p-btn" style="cursor:pointer; text-align:center; color:#555;">📞<br><span style="font-size:12px; margin-top:8px; display:inline-block;">전화</span></div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="s-icon active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="s-icon" onclick="window.showPanel('chat', this)">💬</div>
        <div class="s-icon" style="margin-top:auto;" onclick="window.doLogout()">🚪</div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div class="panel-header">친구</div>
        <div class="list-item" onclick="window.openMyEdit()">
            <div class="p-img"></div>
            <div class="p-text">
                <b id="display-my-name">로딩 중...</b>
                <span id="display-my-status">상태 메시지를 설정하세요</span>
            </div>
        </div>
        <div class="hr"></div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-chat" class="content-panel">
        <div class="panel-header">채팅</div>
        <div id="chat-list"></div>
    </div>

    <div id="chat-window">
        <div class="c-header">
            <span onclick="document.getElementById('chat-window').style.display='none'" style="cursor:pointer; font-weight:bold;">◀</span>
            <b id="chat-target-name">대상</b>
            <span style="color:#ccc;">🔍 ⋮</span>
        </div>
        <div id="chat-view"></div>
        <div class="input-box">
            <input type="text" id="m-in" placeholder="메시지를 입력하세요..." onkeypress="if(event.keyCode==13) window.sendMsg()">
            <button onclick="window.sendMsg()" style="padding:0 20px; background:#000; color:#fff; border:none; border-radius:20px; font-weight:bold;">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid;

    // [핵심] 페이지 로드 시 자동 로그인 확인
    window.addEventListener('load', () => {
        const savedId = localStorage.getItem('star_talk_user');
        if (savedId) {
            myId = savedId;
            initApp();
        }
    });

    window.doLogin = () => {
        const idInput = document.getElementById('myId').value.trim().toLowerCase();
        if (!idInput) return alert("아이디를 입력해주세요.");
        myId = idInput;
        localStorage.setItem('star_talk_user', myId); // 로컬 저장소에 아이디 저장
        initApp();
    };

    window.doLogout = () => {
        if(confirm("로그아웃 하시겠습니까?")) {
            localStorage.removeItem('star_talk_user');
            location.reload();
        }
    };

    function initApp() {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        
        // 내 정보 실시간 바인딩
        onValue(ref(db, `users/${myId}`), snap => {
            const data = snap.val() || { name: myId, status: "상태 메시지를 설정하세요" };
            document.getElementById('display-my-name').innerText = data.name;
            document.getElementById('display-my-status').innerText = data.status;
            document.getElementById('edit-name').value = data.name;
            document.getElementById('edit-status').value = data.status;
        });
        loadData();
    }

    window.showPanel = (type, el) => {
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.s-icon').forEach(i => i.classList.remove('active'));
        document.getElementById(`panel-${type}`).classList.add('active');
        el.classList.add('active');
    };

    window.openMyEdit = () => document.getElementById('my-edit-popup').style.display = 'flex';
    
    window.saveProfile = () => {
        const name = document.getElementById('edit-name').value || myId;
        const status = document.getElementById('edit-status').value || "";
        update(ref(db, `users/${myId}`), { name, status }).then(() => {
            document.getElementById('my-edit-popup').style.display = 'none';
        });
    };

    function loadData() {
        // 친구 목록 불러오기
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([fid, info]) => {
                const d = document.createElement('div');
                d.className = "list-item";
                d.innerHTML = `<div class="p-img" style="width:42px; height:42px; border-radius:16px;"></div><b>${info.name}</b>`;
                d.onclick = () => window.openFriendProfile(fid, info.name);
                list.appendChild(d);
            });
        });

        // 채팅방 목록 불러오기
        onValue(ref(db, `chatRooms/${myId}`), snap => {
            const list = document.getElementById('chat-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([rid, info]) => {
                const d = document.createElement('div');
                d.className = "list-item";
                d.innerHTML = `<div class="p-img" style="width:48px; height:48px; border-radius:50%"></div>
                               <div class="p-text"><b>${info.targetName}</b><span>채팅 내용을 확인하세요</span></div>`;
                d.onclick = () => window.openChat(rid, info.targetName);
                list.appendChild(d);
            });
        });

        // (최초 1회 실행용) 테스트 친구 추가 버튼이 필요할 수 있어 자동 생성 로직 유지
        get(ref(db, `friends/${myId}`)).then(s => {
            if(!s.exists()) set(ref(db, `friends/${myId}/user_test`), { name: "테스트 친구" });
        });
    }

    window.openFriendProfile = (fid, name) => {
        document.getElementById('p-name').innerText = name;
        document.getElementById('profile-popup').style.display = 'flex';
        document.getElementById('btn-go-chat').onclick = () => {
            const rid = myId < fid ? `${myId}_${fid}` : `${fid}_${myId}`;
            set(ref(db, `chatRooms/${myId}/${rid}`), { targetId: fid, targetName: name });
            set(ref(db, `chatRooms/${fid}/${rid}`), { targetId: myId, targetName: myId });
            document.getElementById('profile-popup').style.display = 'none';
            window.openChat(rid, name);
        };
    };

    window.openChat = (rid, name) => {
        activeRid = rid;
        document.getElementById('chat-target-name').innerText = name;
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([mid, m]) => {
                const d = document.createElement('div');
                d.className = `bubble ${m.s === myId ? 'me' : 'o'}`;
                d.innerText = m.t;
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), { t: i.value, s: myId });
        i.value = "";
    };
</script>
</body>
</html>
