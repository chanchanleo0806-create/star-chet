<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK MOBILE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); height: 100vh; overflow: hidden; }

        /* [로그인 화면] - 가이드 없이 바로 노출 */
        #login-ui { 
            position: fixed; inset: 0; background: #fff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; z-index: 2000;
        }
        .logo { font-size: 36px; font-weight: 900; color: #000; margin-bottom: 50px; }
        .input-group { width: 100%; max-width: 300px; }
        input { 
            width: 100%; height: 55px; padding: 0 15px; margin-bottom: 12px; 
            border: 1px solid #ddd; border-radius: 14px; font-size: 16px; outline: none; background: #f5f5f7;
        }
        input:focus { border-color: #000; background: #fff; }
        .btn-login { 
            width: 100%; height: 55px; background: #000; color: #fff; 
            border: none; border-radius: 14px; font-weight: bold; font-size: 17px; cursor: pointer;
        }

        /* [메인 채팅 화면] - 로그인 후 표시 */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        header { 
            height: 60px; padding: 0 20px; border-bottom: 1px solid #eee; 
            display: flex; align-items: center; justify-content: space-between; 
        }
        #chat-view { flex: 1; overflow-y: auto; background: #f2f2f7; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        /* 말풍선 */
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .me { align-self: flex-end; background: #fee500; color: #000; }
        .o { align-self: flex-start; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* 입력바 */
        footer { 
            padding: 10px 15px; border-top: 1px solid #eee; background: #fff;
            display: flex; align-items: center; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        #m-in { flex: 1; height: 42px; background: #efeff4; border: none; border-radius: 21px; padding: 0 15px; font-size: 16px; outline: none; }
    </style>
</head>
<body>

    <div id="login-ui">
        <div class="logo">STAR TALK</div>
        <div class="input-group">
            <input type="text" id="myId" placeholder="아이디" inputmode="email">
            <input type="password" id="myPw" placeholder="비밀번호">
            <button class="btn-login" onclick="window.handleLogin()">로그인 후 입장</button>
        </div>
    </div>

    <main id="main-app">
        <header>
            <div style="font-weight:bold; font-size:18px;" id="chat-title">채팅 목록</div>
            <button onclick="window.handleAddFriend()" style="background:none; border:none; font-size:20px;">➕</button>
        </header>
        <div id="chat-view">
            <p style="text-align:center; color:#999; font-size:13px; margin-top:100px;">친구를 추가하고 대화를 시작하세요.</p>
        </div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="border:none; background:none; color:var(--blue); font-weight:bold;">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId;

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            console.log("로그인 완료: 가이드 없이 바로 시작");
        } else alert("비밀번호 오류");
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        i.value = "";
    };

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:").toLowerCase().trim();
        if(fid && fid !== myId) {
            const check = await get(ref(db, `auth/${fid}`));
            if(check.exists()) {
                await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
                window.openChat(fid);
            } else alert("없는 유저입니다.");
        }
    };

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('chat-title').innerText = fid;
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const cls = m.s === myId ? 'me' : 'o';
                v.innerHTML += `<div class="msg ${cls}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };
</script>
</body>
</html>
