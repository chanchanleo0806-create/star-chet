<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - SERVICE GUIDE</title>
    <style>
        :root { --blue: #2189ff; --gray: #757575; --line: #eeeeee; }
        body { margin: 0; font-family: 'SamsungOne', 'Malgun Gothic', sans-serif; background: #fff; color: #333; }

        /* 가이드 컨테이너 */
        .guide-container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .guide-header { border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 25px; }
        .guide-header h1 { font-size: 22px; margin: 0; letter-spacing: -1px; }

        /* 단계별 리스트 (삼성 서비스 스타일) */
        .step-item { display: flex; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid var(--line); }
        .step-icon { width: 60px; height: 60px; flex-shrink: 0; background: #f8f9fb; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-right: 15px; }
        .step-content { flex: 1; }
        .step-num { font-size: 13px; font-weight: bold; color: var(--blue); margin-bottom: 4px; display: block; }
        .step-text { font-size: 15px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; }
        .step-desc { font-size: 13px; color: var(--gray); line-height: 1.5; }

        /* 입력창 및 버튼 */
        .input-group { margin-top: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; font-size: 14px; box-sizing: border-box; }
        .btn-confirm { width: 100%; padding: 15px; background: #000; color: #fff; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        
        /* 채팅 화면 전환 */
        #main-app { display: none; }
    </style>
</head>
<body>

<div id="login-ui" class="guide-container">
    <div class="guide-header">
        <h1>서비스 이용 안내</h1>
    </div>

    <div class="step-item">
        <div class="step-icon">👤</div>
        <div class="step-content">
            <span class="step-num">Step 1</span>
            <div class="step-text">계정 정보를 입력해 주세요.</div>
            <div class="step-desc">본인 확인을 위한 아이디와 비밀번호가 필요합니다.</div>
            <div class="input-group">
                <input type="text" id="myId" placeholder="아이디 입력" inputmode="email">
                <input type="password" id="myPw" placeholder="비밀번호 입력">
            </div>
        </div>
    </div>

    <div class="step-item">
        <div class="step-icon">🔔</div>
        <div class="step-content">
            <span class="step-num">Step 2</span>
            <div class="step-text">알림 및 권한을 허용해 주세요.</div>
            <div class="step-desc">메시지 수신 시 상단 알림창에 내용이 표시됩니다.</div>
        </div>
    </div>

    <div class="step-item">
        <div class="step-icon">💬</div>
        <div class="step-content">
            <span class="step-num">Step 3</span>
            <div class="step-text">친구 추가 후 대화를 시작하세요.</div>
            <div class="step-desc">상대방의 아이디를 등록하면 실시간 채팅과 통화가 가능합니다.</div>
        </div>
    </div>

    <button class="btn-confirm" onclick="window.handleLogin()">로그인 및 시작하기</button>
</div>

<div id="main-app">
    <p style="padding:20px;">로그인 성공! 채팅 화면으로 전환되었습니다.</p>
</div>

<script>
    window.handleLogin = () => {
        const id = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        
        if(!id || !pw) {
            alert("정보를 모두 입력해주세요.");
            return;
        }
        
        // 화면 전환 연출
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
    }
</script>

</body>
</html>
