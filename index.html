<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --yellow: #fee500; --chat-bg: #abc1d1; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

        /* 로그인 UI */
        #auth-ui { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; text-align: center; background: rgba(255,255,255,0.1); padding: 40px 20px; border-radius: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: none; outline: none; }
        .btn-main { width: 100%; padding: 15px; background: var(--yellow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* 메인 앱 레이아웃 */
        #main-app { display: none; height: 100%; }
        nav { width: 70px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .content { flex: 1; background: #fff; color: #000; border-radius: 25px 0 0 0; overflow-y: auto; }

        /* 채팅 UI */
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); display: none; flex-direction: column; z-index: 900; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px; border-radius: 12px; font-size: 14px; max-width: 80%; }
        .me { align-self: flex-end; background: var(--yellow); }
        .you { align-self: flex-start; background: #fff; }
        .bubble img { max-width: 100%; border-radius: 8px; cursor: pointer; }
        .input-bar { padding: 10px; background: #fff; display: flex; gap: 8px; }

        /* 통화 UI */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; border: 2px solid #fff; border-radius: 10px; }
        .end-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: red; color: #fff; padding: 15px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <h2 style="color:#fff; margin-bottom:20px;">STAR TALK</h2>
        <input type="text" id="authId" placeholder="아이디">
        <input type="password" id="authPw" placeholder="비밀번호">
        <button class="btn-main" onclick="window.handleAuth('login')">로그인</button>
        <button class="btn-main" style="background:#444; color:#fff; margin-top:10px;" onclick="window.handleAuth('signup')">회원가입</button>
    </div>
</div>

<div id="main-app" style="display: flex;">
    <nav><div style="font-size:24px; color:var(--yellow);">👤</div></nav>
    <div class="content">
        <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">+</span></div>
        <div id="friend-list"></div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; display:flex; align-items:center; background:rgba(255,255,255,0.2);">
        <button onclick="window.closeChat()">◀</button>
        <b id="chat-name" style="margin-left:10px;">채팅</b>
        <button onclick="window.initCall(true)" style="margin-left:auto;">🎥</button>
    </div>
    <div id="chat-view"></div>
    <div class="input-bar">
        <label style="font-size:20px; cursor:pointer;">🖼️<input type="file" hidden onchange="window.handleFile(this)"></label>
        <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px; border-radius:10px;">전송</button>
    </div>
</div>

<div id="call-ui">
    <video id="remote-video" autoplay playsinline disablepictureinpicture></video>
    <video id="local-video" autoplay playsinline muted disablepictureinpicture></video>
    <div class="end-btn" onclick="window.endCall()">✕</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push, off, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", 
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "starchet-e9630" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, selFid, peer, myStream, currentCall;

    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        if(!id || !pw) return alert("입력하세요");
        const userRef = ref(db, `users/${id}`);
        const snap = await get(userRef);
        if(type === 'signup') {
            if(snap.exists()) return alert("중복 아이디");
            await set(userRef, { id, pw, name: id }); alert("가입 완료");
        } else {
            if(snap.exists() && snap.val().pw === pw) {
                myId = id; localStorage.setItem('st_id', id); startApp();
            } else alert("정보 불일치");
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        set(ref(db, `status/${myId}`), "online");
        onDisconnect(ref(db, `status/${myId}`)).set(serverTimestamp());

        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm("전화 수신! 받으시겠습니까?")) {
                myStream = await navigator.mediaDevices.getUserMedia({audio:true, video:call.metadata.video});
                call.answer(myStream);
                handleCall(call);
            }
        });
        loadFriends();
    }

    // [중요: 튕김 방지 채팅창 오픈 로직]
    window.openChat = (fid) => {
        try {
            if(!myId || !fid) return;
            // 이전 리스너 제거 (튕김 방지 핵심)
            if(activeRid) off(ref(db, `msgs/${activeRid}`));

            selFid = fid;
            activeRid = [myId, fid].sort().join('_');
            document.getElementById('chat-name').innerText = fid;
            document.getElementById('chat-window').style.display = 'flex';

            onValue(ref(db, `msgs/${activeRid}`), snap => {
                const v = document.getElementById('chat-view');
                v.innerHTML = "";
                if(snap.exists()){
                    Object.values(snap.val()).forEach(m => {
                        const div = document.createElement('div');
                        div.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                        if(m.type === 'file') div.innerHTML = `<img src="${m.file}" onclick="window.open(this.src)">`;
                        else div.innerText = m.t;
                        v.appendChild(div);
                    });
                }
                v.scrollTop = v.scrollHeight;
            });
        } catch(e) { console.error("채팅방 오류:", e); }
    };

    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), { s: myId, t: i.value.trim(), time: serverTimestamp() });
        i.value = ""; i.focus();
    };

    window.handleFile = (el) => {
        const file = el.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = () => push(ref(db, `msgs/${activeRid}`), { s: myId, type: 'file', file: reader.result, name: file.name });
        reader.readAsDataURL(file);
        el.value = "";
    };

    window.initCall = async (video) => {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({audio:true, video:video});
            document.getElementById('local-video').srcObject = myStream;
            const call = peer.call(selFid, myStream, {metadata:{video}});
            handleCall(call);
        } catch(e) { alert("권한 오류"); }
    };

    function handleCall(call) {
        currentCall = call;
        document.getElementById('call-ui').style.display = 'block';
        call.on('stream', s => { 
            const rv = document.getElementById('remote-video');
            rv.srcObject = s; rv.disablePictureInPicture = true;
        });
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t=>t.stop());
        document.getElementById('call-ui').style.display = 'none';
    };

    window.addFriend = () => {
        const f = prompt("친구 ID:");
        if(f && f !== myId) update(ref(db), {[`friends/${myId}/${f}`]:true, [`friends/${f}/${myId}`]:true});
    };

    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(fid => {
                    const d = document.createElement('div');
                    d.style.padding = "15px"; d.style.borderBottom = "1px solid #eee";
                    d.innerHTML = `<b>${fid}</b>`;
                    d.onclick = () => window.openChat(fid);
                    list.appendChild(d);
                });
            }
        });
    }

    window.closeChat = () => {
        if(activeRid) off(ref(db, `msgs/${activeRid}`));
        document.getElementById('chat-window').style.display = 'none';
    };

    if(localStorage.getItem('st_id')) { myId = localStorage.getItem('st_id'); startApp(); }
</script>
</body>
</html>
