<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - Simple Black</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --side: #1a1a1a; --list: #ffffff; --chat: #f4f4f4; --accent: #000000; --text: #333333; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; color: var(--text); }

        #app-container { display: flex; height: 100%; width: 100%; }

        /* [Side Bar] */
        #side-bar { width: 60px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 35px; }
        .side-icon { color: #666; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .side-icon:hover, .side-icon.active { color: #fff; }

        /* [Room List] */
        #room-section { width: 280px; background: var(--list); border-right: 1px solid #eee; display: flex; flex-direction: column; }
        .list-header { padding: 25px 20px; font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; border-bottom: 1px solid #f9f9f9; }
        .room-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #fcfcfc; }
        .room-item:hover { background: #f5f5f5; }
        .room-img { width: 42px; height: 42px; background: #eee; border-radius: 50%; border: 1px solid #eee; }

        /* [Chat Area] */
        #chat-section { flex: 1; background: var(--chat); display: flex; flex-direction: column; }
        header { height: 65px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid #eee; }
        #chat-title { font-size: 16px; font-weight: 700; }
        
        #chat-view { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        
        /* [Bubbles] */
        .msg { display: flex; flex-direction: column; max-width: 75%; }
        .msg.me { align-self: flex-end; align-items: flex-end; }
        .msg.o { align-self: flex-start; }
        .bubble-row { display: flex; align-items: flex-end; gap: 6px; }
        .me .bubble-row { flex-direction: row-reverse; }
        
        .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-break: break-all; }
        .o .bubble { background: #fff; color: #000; border: 1px solid #eee; }
        .me .bubble { background: var(--accent); color: #fff; }
        
        .unread { color: #ff3b30; font-size: 11px; font-weight: bold; margin-bottom: 2px; }

        /* [Input Area] */
        footer { height: 130px; background: #fff; padding: 15px; display: flex; flex-direction: column; border-top: 1px solid #eee; }
        #m-in { flex: 1; border: none; outline: none; resize: none; font-size: 14px; color: #333; }
        .btn-row { display: flex; justify-content: flex-end; }
        .send-btn { background: #000; color: #fff; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* [Login UI] */
        #login-ui { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .l-box { background: white; padding: 45px; border-radius: 12px; display: flex; flex-direction: column; width: 340px; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .l-input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .l-btn { padding: 12px; background: #000; color: #white; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-ui">
        <div class="l-box">
            <h1 style="text-align: center; letter-spacing: -1px; margin-bottom: 20px;">STAR TALK</h1>
            <input type="text" id="myId" class="l-input" placeholder="ID">
            <input type="password" id="myPw" class="l-input" placeholder="Password">
            <button class="l-btn" onclick="window.handleLogin()">SIGN IN</button>
        </div>
    </div>

    <div id="app-container">
        <div id="side-bar">
            <div class="side-icon active">●</div>
            <div class="side-icon">○</div>
            <div class="side-icon" onclick="window.makeCall()">☏</div>
            <div class="side-icon" style="margin-top: auto; margin-bottom: 30px;" onclick="window.handleLogout()">⇥</div>
        </div>

        <div id="room-section">
            <div class="list-header">
                Chats <span style="cursor:pointer; font-size: 24px;" onclick="window.createGroup()">+</span>
            </div>
            <div id="room-list"></div>
        </div>

        <div id="chat-section">
            <header>
                <b id="chat-title">Select a room</b>
                <div style="font-size: 20px; color: #999;">🔍 ⋮</div>
            </header>
            <div id="chat-view"></div>
            <footer>
                <textarea id="m-in" placeholder="Type a message..." onkeypress="if(event.keyCode==13 && !event.shiftKey) { event.preventDefault(); window.handleSend(); }"></textarea>
                <div class="btn-row">
                    <button class="send-btn" onclick="window.handleSend()">SEND</button>
                </div>
            </footer>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, currentChatId, currentMembers = [];

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id; localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
            document.getElementById('login-ui').style.display = 'none';
            loadRooms();
        } else alert("Invalid Password");
    };

    window.createGroup = async () => {
        const res = prompt("Enter User IDs (comma separated):");
        if(!res) return;
        let members = res.split(',').map(s => s.trim().toLowerCase());
        members.push(myId);
        const rid = "room_" + Date.now();
        for(const m of members) await set(ref(db, `userRooms/${m}/${rid}`), { name: members.join(', '), members });
    };

    function loadRooms() {
        onValue(ref(db, `userRooms/${myId}`), snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([rid, info]) => {
                const div = document.createElement('div');
                div.className = "room-item";
                div.innerHTML = `<div class="room-img"></div><div><div style="font-weight:700;">${info.name}</div><div style="font-size:12px; color:#999;">Recent message...</div></div>`;
                div.onclick = () => window.enterChat(rid, info);
                list.appendChild(div);
            });
        });
    }

    window.enterChat = (rid, info) => {
        currentChatId = rid; currentMembers = info.members;
        document.getElementById('chat-title').innerText = info.name;
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([mid, m]) => {
                if(!m.readers || !m.readers[myId]) update(ref(db, `msgs/${rid}/${mid}/readers`), {[myId]: true});
                const unread = currentMembers.length - (m.readers ? Object.keys(m.readers).length : 0);
                const isMe = m.s === myId;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'me' : 'o'}`;
                div.innerHTML = `
                    <div style="font-size:11px; margin-bottom:4px; font-weight:bold;">${!isMe ? m.s : ''}</div>
                    <div class="bubble-row">
                        <div class="bubble">${m.t}</div>
                        ${unread > 0 ? `<span class="unread">${unread}</span>` : ''}
                    </div>
                `;
                v.appendChild(div);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !currentChatId) return;
        push(ref(db, `msgs/${currentChatId}`), { t: i.value, s: myId, readers: {[myId]: true} });
        i.value = "";
    };

    window.handleLogout = () => { localStorage.clear(); location.reload(); };
    window.addEventListener('load', () => {
        const sid = localStorage.getItem('st_id'), spw = localStorage.getItem('st_pw');
        if(sid && spw) { document.getElementById('myId').value = sid; document.getElementById('myPw').value = spw; window.handleLogin(); }
    });
</script>
</body>
</html>
