<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK</title>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --menu-w: 260px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: #fff; height: 100vh; overflow: hidden; }

        /* [사이드 메뉴 - 친구목록] */
        #side-menu {
            position: fixed; top: 0; left: calc(var(--menu-w) * -1); 
            width: var(--menu-w); height: 100%; background: #fff; z-index: 3000;
            transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        #side-menu.open { left: 0; }
        .menu-header { padding: 20px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 12px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; background: #f9f9f9; }

        /* [배경 어둡게] */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }

        /* [채팅 화면] */
        #main-app { display: flex; flex-direction: column; height: 100vh; }
        header { 
            height: 60px; padding: 0 15px; border-bottom: 1px solid #eee; background: #fff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .menu-btn { font-size: 24px; background: none; border: none; cursor: pointer; }

        #chat-view { flex: 1; overflow-y: auto; background: var(--bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 15px; }
        .me { align-self: flex-end; background: var(--main); }
        .o { align-self: flex-start; background: #fff; }

        footer { padding: 10px; background: #fff; display: flex; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #m-in { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 20px; padding: 0 15px; }
        
        /* 로그인창 */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        input { width: 100%; max-width: 300px; height: 50px; margin-bottom: 10px; padding: 0 15px; border: 1px solid #ddd; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="login-ui">
        <h1 style="margin-bottom:40px;">STAR TALK</h1>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.handleLogin()" style="width:100%; max-width:300px; height:50px; background:#333; color:#fff; border:none; border-radius:10px; font-weight:bold;">로그인</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div class="menu-header">
            <span>친구 목록</span>
            <button onclick="window.handleAddFriend()">+ 추가</button>
        </div>
        <div id="friend-list" class="friend-list">
            <div style="text-align:center; color:#999; margin-top:20px; font-size:13px;">친구를 추가해 보세요.</div>
        </div>
    </nav>

    <main id="main-app">
        <header>
            <button class="menu-btn" onclick="window.toggleMenu()">≡</button>
            <b id="target-title">채팅방을 선택하세요</b>
            <div style="width:24px;"></div> </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="border:none; background:none; font-weight:bold;">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId;

    // 메뉴 열고 닫기
    window.toggleMenu = () => {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const isOpen = menu.classList.toggle('open');
        overlay.style.display = isOpen ? 'block' : 'none';
    };

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            loadFriends();
        } else alert("로그인 정보가 틀립니다.");
    };

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID 입력:").toLowerCase().trim();
        if(fid && fid !== myId) {
            const check = await get(ref(db, `auth/${fid}`));
            if(check.exists()) {
                await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
            } else alert("없는 사용자입니다.");
        }
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.val()) {
                Object.keys(snap.val()).forEach(fid => {
                    const div = document.createElement('div');
                    div.className = 'friend-item';
                    div.innerText = fid;
                    div.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                    list.appendChild(div);
                });
            }
        });
    }

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const cls = m.s === myId ? 'me' : 'o';
                v.innerHTML += `<div class="msg ${cls}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        i.value = "";
    };
</script>
</body>
</html>
