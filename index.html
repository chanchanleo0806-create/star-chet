<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - SIMPLE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --point: #fee500; --bg: #f4f4f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 로그인 UI */
        #login-ui { position: fixed; inset: 0; background: var(--point); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        .login-box button { width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 헤더 */
        header { padding: 15px; background: white; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 8px; }
        .call-btn { background: #4cd964; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 16px; cursor: pointer; display: none; align-items: center; justify-content: center; }

        /* 친구 목록 */
        .story-container { background: white; padding: 10px; display: flex; gap: 12px; overflow-x: auto; border-bottom: 1px solid #eee; min-height: 80px; }
        .story-item { flex: 0 0 auto; width: 55px; text-align: center; cursor: pointer; }
        .story-img { width: 45px; height: 45px; border-radius: 18px; background: #eee; border: 2px solid var(--point); margin-bottom: 4px; }
        .story-name { font-size: 11px; color: #333; }

        /* 채팅 구역 */
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 75%; font-size: 15px; word-break: break-all; }
        .me { align-self: flex-end; background: var(--point); border-top-right-radius: 2px; }
        .o { align-self: flex-start; background: white; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .file-img { max-width: 100%; border-radius: 10px; margin-top: 5px; }

        /* 하단 입력바 */
        footer { padding: 10px; background: white; display: none; gap: 8px; border-top: 1px solid #eee; align-items: center; }
        #m-in { flex: 1; border: none; background: #f0f0f2; padding: 12px; border-radius: 20px; outline: none; font-size: 16px; }
        .icon-btn { font-size: 20px; cursor: pointer; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-box">
        <h2>STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디" inputmode="email">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.handleLogin()">로그인</button>
    </div>
</div>

<div class="story-container" id="story-area"></div>

<main id="main-app" style="display:none; flex-direction:column; height:100%;">
    <header>
        <b id="target-name">대상 선택</b>
        <div class="btn-group">
            <button class="call-btn" id="call-ui-btn" onclick="window.makeCall()">📞</button>
            <button onclick="window.handleAddFriend()">+ 친구</button>
        </div>
    </header>
    <div id="chat-view"></div>
    <footer id="chat-footer">
        <label class="icon-btn" for="file-input">📎</label>
        <input type="file" id="file-input" onchange="window.handleFile(this)">
        <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
        <button onclick="window.handleSend()" style="border:none; background:none; font-weight:bold;">전송</button>
    </footer>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId, peer;

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw, nick: id});
            myId = id; startApp();
        } else alert("비밀번호 오류");
    };

    function startApp() {
        peer = new Peer(myId, { config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} });
        peer.on('open', () => {
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadFriends();
        });

        peer.on('call', async (call) => {
            if (confirm(call.peer + "님의 전화를 받으시겠습니까?")) {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                call.answer(s);
                call.on('stream', rs => { const a = new Audio(); a.srcObject = rs; a.play(); });
            }
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') alert("이미 접속 중인 아이디입니다.");
        });
    }

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:").toLowerCase().trim();
        if(!fid || fid === myId) return;
        const check = await get(ref(db, `auth/${fid}`));
        if(check.exists()) set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
        else alert("존재하지 않는 아이디입니다.");
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const area = document.getElementById('story-area'); area.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(fid => {
                area.innerHTML += `<div class="story-item" onclick="window.openChat('${fid}')">
                    <div class="story-img"></div><div class="story-name">${fid}</div></div>`;
            });
        });
    }

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-name').innerText = fid;
        document.getElementById('chat-footer').style.display = 'flex';
        document.getElementById('call-ui-btn').style.display = 'flex';
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const cls = m.s === myId ? 'me' : 'o';
                let content = m.t;
                if(m.file) {
                    content = m.type.includes('image') ? `<img src="${m.file}" class="file-img">` : `<a href="${m.file}" download="${m.t}">📁 ${m.t}</a>`;
                }
                v.innerHTML += `<div class="msg ${cls}">${content}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in'); if(!i.value) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        i.value = "";
    };

    window.handleFile = (input) => {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const rid = [myId, targetId].sort().join("_");
            push(ref(db, `msgs/${rid}`), {t: file.name, s: myId, file: e.target.result, type: file.type});
        };
        reader.readAsDataURL(file);
    };

    window.makeCall = async () => {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        const call = peer.call(targetId, s);
        call.on('stream', rs => { const a = new Audio(); a.srcObject = rs; a.play(); });
    };
</script>
</body>
</html>
