<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --line: #eeeeee; --gray: #f8f8f8; --accent: #ff3b30; --online: #4cd964; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }
        
        /* [메인 레이아웃] */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 75px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 22px; }
        .nav-text { font-size: 10px; font-weight: bold; }

        /* [패널] */
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
        .content-panel.active { display: flex; }
        .panel-header { padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }

        /* [리스트] */
        .list-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 0.5px solid #f0f0f0; }
        .p-img { width: 45px; height: 45px; background: #eee; border-radius: 15px; flex-shrink: 0; }

        /* [채팅창] */
        #chat-window { position: fixed; inset: 0 0 0 75px; background: #fff; z-index: 100; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #f2f2f2; }
        .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; max-width: 75%; position: relative; }
        .me { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 2px; }
        .o { align-self: flex-start; background: #fff; border: 1px solid #ddd; border-bottom-left-radius: 2px; }

        /* [영상통화 UI - PIP 개선] */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video-container { position: absolute; top: 30px; right: 20px; width: 110px; height: 150px; z-index: 2010; border-radius: 12px; overflow: hidden; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #local-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .call-controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 2020; align-items: center; }
        .ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; cursor: pointer; }
        .c-icon { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.2s; }
        .c-icon.off { background: var(--accent); }
        .c-icon.hangup { background: var(--accent); font-size: 24px; width: 65px; height: 65px; }

        /* [로그인] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-ui">
    <div style="width:280px; display:flex; flex-direction:column; gap:12px;">
        <h2 style="text-align:center; margin-bottom:10px;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디" style="padding:15px; border:1px solid #eee; border-radius:12px; outline:none;">
        <input type="password" id="myPw" placeholder="비밀번호" style="padding:15px; border:1px solid #eee; border-radius:12px; outline:none;">
        <button onclick="window.doLogin()" style="padding:15px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:bold;">로그인</button>
    </div>
</div>

<div id="call-ui">
    <video id="remote-video" autoplay playsinline></video>
    <div id="local-video-container">
        <video id="local-video" autoplay playsinline muted></video>
    </div>
    
    <div class="call-controls">
        <div class="ctrl-btn" onclick="window.toggleMic()">
            <div id="mic-icon" class="c-icon">🎤</div>
            <span class="nav-text">음소거</span>
        </div>
        <div class="ctrl-btn" onclick="window.endCall()">
            <div class="c-icon hangup">✕</div>
            <span class="nav-text">종료</span>
        </div>
        <div class="ctrl-btn" onclick="window.toggleCam()">
            <div id="cam-icon" class="c-icon">🎥</div>
            <span class="nav-text">카메라</span>
        </div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">
            <span class="nav-icon">👤</span><span class="nav-text">친구</span>
        </div>
        <div class="nav-item" onclick="window.showPanel('chat', this)">
            <span class="nav-icon">💬</span><span class="nav-text">채팅</span>
        </div>
        <div class="nav-item" style="margin-top:auto;" onclick="window.doLogout()">
            <span class="nav-icon">🚪</span><span class="nav-text">로그아웃</span>
        </div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div class="panel-header"><span>친구</span><span onclick="window.addFriend()" style="cursor:pointer;">+</span></div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-chat" class="content-panel">
        <div class="panel-header">채팅</div>
        <div id="chat-list"></div>
    </div>

    <div id="chat-window">
        <div style="height:60px; border-bottom:1px solid #eee; display:flex; align-items:center; padding:0 20px;">
            <span onclick="window.closeChat()" style="cursor:pointer; font-size:18px;">◀</span>
            <b id="chat-target-name" style="margin-left:15px;">상대방</b>
        </div>
        <div id="chat-view"></div>
        <div style="padding:15px; display:flex; gap:10px; border-top:1px solid #eee;">
            <input type="text" id="m-in" style="flex:1; padding:12px; border-radius:20px; border:1px solid #ddd; outline:none;" onkeypress="if(event.keyCode==13) window.sendMsg()">
            <button onclick="window.sendMsg()" style="padding:10px 20px; background:#000; color:#fff; border:none; border-radius:20px; font-weight:bold;">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, peer, currentCall, myStream, isMicOn = true, isCamOn = true;

    window.doLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase(), pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        myId = id; localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
        document.getElementById('login-ui').style.display='none';
        document.getElementById('main-app').style.display='flex';
        initApp();
    };

    function initApp() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님의 영상통화 요청!")) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
                document.getElementById('local-video').srcObject = myStream;
                call.answer(myStream);
                handleCallStream(call);
            }
        });
        loadData();
    }

    // [통화 제어 버튼 기능]
    window.toggleMic = () => {
        isMicOn = !isMicOn;
        myStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('mic-icon').classList.toggle('off', !isMicOn);
        document.getElementById('mic-icon').innerText = isMicOn ? "🎤" : "🔇";
    };

    window.toggleCam = () => {
        isCamOn = !isCamOn;
        myStream.getVideoTracks()[0].enabled = isCamOn;
        document.getElementById('cam-icon').classList.toggle('off', !isCamOn);
        document.getElementById('cam-icon').innerText = isCamOn ? "🎥" : "📵";
    };

    window.startCall = async (fid) => {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true }, 
                video: true 
            });
            document.getElementById('local-video').srcObject = myStream;
            const call = peer.call(fid, myStream);
            handleCallStream(call);
        } catch(e) { alert("카메라 권한을 확인해주세요."); }
    };

    function handleCallStream(call) {
        currentCall = call;
        document.getElementById('call-ui').style.display = 'flex';
        call.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
        call.on('close', window.endCall);
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-ui').style.display = 'none';
        isMicOn = true; isCamOn = true; // 상태 초기화
    };

    // [기본 로직]
    function loadData() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([fid, info]) => {
                const d = document.createElement('div'); d.className="list-item";
                d.innerHTML = `<div class="p-img"></div><b style="flex:1;">${fid}</b><span onclick="window.startCall('${fid}')">🎥</span>`;
                d.onclick = (e) => { if(e.target.tagName !== 'SPAN') window.openChat(fid); };
                list.appendChild(d);
            });
        });
    }

    window.openChat = (fid) => {
        activeRid = myId < fid ? `${myId}_${fid}` : `${fid}_${myId}`;
        document.getElementById('chat-target-name').innerText = fid;
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.values(snap.val()).forEach(m => {
                v.innerHTML += `<div class="bubble ${m.s===myId?'me':'o'}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const i = document.getElementById('m-in'); if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), { t: i.value, s: myId });
        i.value = "";
    };

    window.addFriend = () => {
        const fid = prompt("친구 ID:").trim().toLowerCase();
        if(fid) update(ref(db), {[`friends/${myId}/${fid}`]:{name:fid}, [`friends/${fid}/${myId}`]:{name:myId}});
    };

    window.showPanel = (t, el) => {
        document.querySelectorAll('.content-panel').forEach(p=>p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); el.classList.add('active');
    };
    window.closeChat = () => document.getElementById('chat-window').style.display='none';
</script>
</body>
</html>
