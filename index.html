<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - LOGIN FIX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #FEE500; --dark: #3C1E1E; --bg: #bacee0; }
        body { background: var(--main); font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 90%; max-width: 320px; text-align: center; }
        .logo { font-size: 32px; font-weight: bold; color: var(--dark); margin-bottom: 30px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; outline: none; }
        button { width: 100%; padding: 14px; background: var(--dark); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #status { color: #ff4747; font-size: 12px; margin-top: 15px; min-height: 18px; }
    </style>
</head>
<body>

<div id="login-ui" class="login-box">
    <div class="logo">STAR TALK</div>
    <input type="text" id="myId" placeholder="아이디 (문자/숫자)">
    <input type="password" id="myPw" placeholder="비밀번호">
    <button id="loginBtn">로그인 / 시작하기</button>
    <div id="status"></div>
</div>

<div id="main-ui" style="display:none; width:100%; height:100vh; background: var(--bg);">
    <div style="background:#333; color:white; padding:15px; display:flex; justify-content:space-between;">
        <b id="display-id">접속됨</b>
        <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:#fff; cursor:pointer; font-size:11px;">로그아웃</button>
    </div>
    <div style="padding:20px; text-align:center;">
        <h3>🎉 로그인 성공!</h3>
        <p>친구를 추가하고 대화를 시작하세요.</p>
    </div>
</div>

<script type="module">
    // Firebase SDK 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 보내주신 설정값 적용
    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73",
        measurementId: "G-QPCFFFTKW6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const status = document.getElementById('status');

    // 로그인 버튼 클릭 이벤트
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const id = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();

        if(!id || !pw) {
            status.innerText = "아이디와 비번을 입력해주세요.";
            return;
        }

        status.innerText = "서버 연결 중...";

        try {
            const userRef = ref(db, `auth/${id}`);
            const snap = await get(userRef);

            if(!snap.exists()) {
                // 회원가입
                await set(userRef, { pw: pw });
                alert("반가워요! 신규 가입되었습니다.");
                goMain(id);
            } else {
                // 로그인
                if(snap.val().pw === pw) {
                    goMain(id);
                } else {
                    status.innerText = "비밀번호가 일치하지 않습니다.";
                }
            }
        } catch (e) {
            console.error(e);
            status.innerText = "에러: " + e.message;
            if(e.message.includes("permission_denied")) {
                status.innerText = "파이어베이스 Rules(규칙)를 true로 바꿔주세요!";
            }
        }
    });

    function goMain(id) {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        document.getElementById('display-id').innerText = "ID: " + id;
    }
</script>
</body>
</html>
