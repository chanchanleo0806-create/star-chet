<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - FIX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #FEE500; --dark: #3C1E1E; --bg: #bacee0; }
        body { background: var(--main); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 15px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--dark); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #err { color: #d32f2f; font-size: 12px; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div id="login-ui" class="box">
    <h2 style="margin-top:0;">STAR TALK</h2>
    <input type="text" id="myId" placeholder="아이디">
    <input type="password" id="myPw" placeholder="비밀번호">
    <button id="loginBtn">로그인 / 시작</button>
    <div id="err"></div>
</div>

<div id="main-ui" style="display:none; width:100%; height:100vh; background: var(--bg);">
    <div style="background:#333; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center;">
        <b id="user-display"></b>
        <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:white; padding:5px 10px; border-radius:5px; font-size:11px;">로그아웃</button>
    </div>
    <div style="padding:20px; text-align:center;">
        <div style="background:white; padding:20px; border-radius:10px;">
            <h3>✅ 연결 성공!</h3>
            <p>데이터베이스와 정상적으로 연결되었습니다.</p>
        </div>
    </div>
</div>

<script type="module">
    // CDN 방식을 사용하여 최신 SDK 로드
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 유저님이 제공하신 설정값 (불필요한 공백 제거)
    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const errDiv = document.getElementById('err');

    try {
        // 1. 파이어베이스 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 2. 로그인 버튼 클릭 핸들러
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const id = document.getElementById('myId').value.trim();
            const pw = document.getElementById('myPw').value.trim();

            if(!id || !pw) {
                errDiv.innerText = "⚠️ 아이디와 비밀번호를 입력하세요.";
                return;
            }

            errDiv.style.color = "blue";
            errDiv.innerText = "서버 확인 중...";

            try {
                const userRef = ref(db, `auth/${id}`);
                const snap = await get(userRef);

                if(!snap.exists()) {
                    // 신규 유저 등록
                    await set(userRef, { pw: pw });
                    alert("축하합니다! 신규 아이디로 등록되었습니다.");
                    showMain(id);
                } else {
                    // 기존 유저 확인
                    if(snap.val().pw === pw) {
                        showMain(id);
                    } else {
                        errDiv.style.color = "red";
                        errDiv.innerText = "❌ 비밀번호가 틀립니다.";
                    }
                }
            } catch (error) {
                errDiv.style.color = "red";
                if(error.message.includes("permission_denied")) {
                    errDiv.innerText = "🔥 파이어베이스 [Rules]에서 read, write를 true로 바꾸고 [게시]를 눌러주세요!";
                } else {
                    errDiv.innerText = "연결 에러: " + error.message;
                }
            }
        });
    } catch (e) {
        errDiv.innerText = "⚠️ 설정값 로드 실패: " + e.message;
    }

    function showMain(id) {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        document.getElementById('user-display').innerText = "ID: " + id;
    }
</script>
</body>
</html>
