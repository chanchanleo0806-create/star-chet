<div class="footer" id="bottom-bar">
    <label for="file-in" style="cursor:pointer; font-size:20px;">📎</label>
    <input type="file" id="file-in" style="display:none;" onchange="uploadFile(this)">
    <span onclick="makeCall(false)" style="cursor:pointer; font-size:20px;">📞</span>
    <span onclick="makeCall(true)" style="cursor:pointer; font-size:20px;">📹</span>
    <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) sendMsg()">
    <button onclick="sendMsg()" style="border:none; background:none; font-weight:bold; color:var(--dark);">전송</button>
</div>

<script type="module">
    // 1. Storage 라이브러리 추가 호출
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 유저님의 설정값
    const config = { /* ...동일... */ };
    const app = initializeApp(config);
    const db = getDatabase(app);
    const storage = getStorage(app); // 스토리지 초기화

    // 2. 파일 업로드 로직
    window.uploadFile = async (input) => {
        const file = input.files[0];
        if (!file) return;

        const status = document.getElementById('header-id');
        const originalText = status.innerText;
        status.innerText = "파일 업로드 중...";

        try {
            // 파일 경로 설정 (파일명에 시간을 붙여 중복 방지)
            const fileRef = sRef(storage, `uploads/${Date.now()}_${file.name}`);
            
            // 업로드 후 URL 가져오기
            const snapshot = await uploadBytes(fileRef, file);
            const url = await getDownloadURL(snapshot.ref);

            // 채팅방에 파일 URL 전송
            const rid = [myId, targetId].sort().join("_");
            push(ref(db, `messages/${rid}`), { 
                text: url, 
                sender: myId, 
                type: file.type.includes('image') ? 'image' : 'file',
                fileName: file.name
            });

            status.innerText = originalText;
        } catch (e) {
            alert("파일 전송 실패: " + e.message);
            status.innerText = originalText;
        }
    };

    // 3. 메시지 렌더링 수정 (이미지면 그림으로 보여주기)
    function renderMessages(snap) {
        const box = document.getElementById('chat-view'); 
        box.innerHTML = "";
        if(snap.val()) {
            Object.values(snap.val()).forEach(m => {
                const d = document.createElement('div');
                d.className = `bubble ${m.sender === myId ? 'me' : 'o'}`;
                
                if (m.type === 'image') {
                    d.innerHTML = `<img src="${m.text}" style="max-width:200px; border-radius:10px; cursor:pointer;" onclick="window.open('${m.text}')">`;
                } else if (m.type === 'file') {
                    d.innerHTML = `📁 <a href="${m.text}" target="_blank" style="color:inherit;">${m.fileName}</a>`;
                } else {
                    d.innerText = m.text;
                }
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        }
    }
    // (기존 openChat 내의 onValue 부분에서 renderMessages를 호출하도록 수정)
</script>
