<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK FINAL FIX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --yellow: #fee500; --accent: #ff3b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [로그인/메인 레이아웃] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .login-box input { padding: 15px; border: 1px solid #eee; border-radius: 12px; }
        .login-box button { padding: 15px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; }

        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 25px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; position: relative; }
        .content-panel.active { display: flex; }

        /* [통화 화면 - 영상 보정] */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v-box { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; overflow: hidden; border: 2px solid #fff; z-index: 4010; }
        #local-v { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .call-btns { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; gap: 20px; }
        .c-circle { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; cursor: pointer; }
        .c-circle.red { background: var(--accent); }

        /* [프로필/통화 선택] */
        #profile-popup { position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; color: #fff; }
        .p-bg { position: absolute; inset: 0; background: #848b94; z-index: 1; }
        .p-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        .p-ui { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 60px; }
        .p-btns { display: flex; gap: 40px; border-top: 0.5px solid rgba(255,255,255,0.3); width: 100%; justify-content: center; padding-top: 30px; }
        
        #call-select { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; color: #000; }
        .sel-box { background: #fff; padding: 30px; border-radius: 20px; text-align: center; width: 260px; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-box">
        <h2>STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.doLogin()">로그인</button>
    </div>
</div>

<div id="call-select" onclick="this.style.display='none'">
    <div class="sel-box" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:20px;">통화 선택</h3>
        <div style="display:flex; justify-content:space-around;">
            <div onclick="window.makeCall(false)" style="cursor:pointer;">📞<br><b>음성</b></div>
            <div onclick="window.makeCall(true)" style="cursor:pointer; color:#007aff;">🎥<br><b>영상</b></div>
        </div>
    </div>
</div>

<div id="call-ui">
    <video id="remote-v" autoplay playsinline></video>
    <div id="local-v-box"><video id="local-v" autoplay playsinline muted></video></div>
    <div class="call-btns">
        <div onclick="window.endCall()"><div class="c-circle red">✕</div></div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="nav-item" onclick="window.showPanel('chat', this)">💬</div>
    </nav>
    <div id="panel-friend" class="content-panel active">
        <div style="padding:20px; font-weight:bold;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">➕</span></div>
        <div id="friend-list"></div>
    </div>
</div>

<div id="profile-popup">
    <div class="p-bg"><img src="https://via.placeholder.com/800x1200/848b94/848b94"></div>
    <div class="p-ui">
        <span onclick="window.closeProfile()" style="position:absolute; top:20px; left:20px; font-size:24px; cursor:pointer;">✕</span>
        <img id="p-pop-img" style="width:100px; height:100px; border-radius:35px; margin-bottom:15px; object-fit:cover;" src="https://via.placeholder.com/150">
        <b id="p-pop-name" style="font-size:20px; margin-bottom:40px;">이름</b>
        <div class="p-btns">
            <div class="p-btn" style="cursor:pointer; text-align:center;">💬<br>1:1 채팅</div>
            <div class="p-btn" onclick="window.openCallSelect()" style="cursor:pointer; text-align:center;">📞<br>통화하기</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, peer, currentCall, myStream, selFid;

    window.doLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        if(!id) return;
        myId = id; localStorage.setItem('st_id', id);
        document.getElementById('login-ui').style.display='none';
        document.getElementById('main-app').style.display='flex';
        
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님의 전화 수락?")) {
                const isVideo = call.metadata && call.metadata.video;
                myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:isVideo });
                call.answer(myStream);
                handleCall(call, isVideo);
            }
        });
        loadFriends();
    };

    // [통화 기능 핵심 FIX]
    window.openCallSelect = () => {
        document.getElementById('call-select').style.display = 'flex';
    };

    window.makeCall = async (isVideo) => {
        document.getElementById('call-select').style.display = 'none';
        document.getElementById('profile-popup').style.display = 'none';
        
        try {
            // 카메라 및 마이크 권한 요청
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
            document.getElementById('local-v').srcObject = myStream;
            document.getElementById('local-v-box').style.display = isVideo ? 'block' : 'none';
            document.getElementById('call-ui').style.display = 'flex';

            const call = peer.call(selFid, myStream, { metadata: { video: isVideo } });
            handleCall(call, isVideo);
        } catch(e) {
            alert("카메라/마이크 권한을 허용해주세요.");
        }
    };

    function handleCall(call, isVideo) {
        currentCall = call;
        call.on('stream', rs => {
            const rv = document.getElementById('remote-v');
            rv.srcObject = rs;
            rv.play();
        });
        call.on('close', window.endCall);
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-ui').style.display = 'none';
    };

    // [친구 및 프로필 로직]
    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(fid => {
                const d = document.createElement('div');
                d.style = "padding:15px; border-bottom:1px solid #eee; cursor:pointer;";
                d.innerHTML = `<b>${fid}</b>`;
                d.onclick = () => { selFid = fid; document.getElementById('p-pop-name').innerText = fid; document.getElementById('profile-popup').style.display='flex'; };
                list.appendChild(d);
            });
        });
    }

    window.addFriend = () => {
        const fid = prompt("ID:").trim().toLowerCase();
        if(fid) update(ref(db), {[`friends/${myId}/${fid}`]:{id:fid}, [`friends/${fid}/${myId}`]:{id:myId}});
    };

    window.closeProfile = () => document.getElementById('profile-popup').style.display = 'none';
    window.showPanel = (t, el) => {
        document.querySelectorAll('.content-panel').forEach(p=>p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); el.classList.add('active');
    };
</script>
</body>
</html>
