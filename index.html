<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - CALL BUTTON</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --call-green: #4cd964; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; font-family: sans-serif; }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-input { width: 100%; max-width: 300px; height: 50px; margin-bottom: 10px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; }
        .btn-login { width: 100%; max-width: 300px; height: 50px; background: #000; color: #fff; border: none; border-radius: 10px; font-weight: bold; }

        /* [메인 헤더 - 전화버튼 포함] */
        header { 
            height: 60px; background: #fff; border-bottom: 1px solid #eee; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; 
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        #target-title { font-size: 18px; font-weight: bold; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* [전화기 아이콘 버튼] */
        .call-btn { 
            width: 45px; height: 45px; background: var(--call-green); color: white; 
            border: none; border-radius: 50%; font-size: 20px; cursor: pointer;
            display: none; /* 친구 선택 전엔 숨김 */
            align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 채팅 구역 */
        #chat-view { flex: 1; overflow-y: auto; background: var(--bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; }
        .me { align-self: flex-end; background: var(--main); }
        .o { align-self: flex-start; background: #fff; }

        /* 하단 입력창 */
        footer { height: 70px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
        #m-in { flex: 1; height: 45px; background: #f0f0f0; border: none; border-radius: 22px; padding: 0 15px; font-size: 16px; outline: none; }
        .send-btn { width: 60px; height: 45px; background: var(--main); border: none; border-radius: 10px; font-weight: bold; }

        /* 사이드 메뉴 */
        #side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 4000; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
        #side-menu.open { left: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3500; display: none; }

        /* 통화 중 화면 */
        #call-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

    <div id="login-ui">
        <h2 style="margin-bottom:30px;">STAR TALK</h2>
        <input type="text" id="myId" class="login-input" placeholder="아이디">
        <input type="password" id="myPw" class="login-input" placeholder="비밀번호">
        <button class="btn-login" onclick="window.handleLogin()">로그인</button>
    </div>

    <div id="call-ui">
        <div id="call-status" style="font-size: 24px;">통화 연결 중...</div>
        <div id="call-target" style="font-size: 18px; margin: 20px 0; color: #ccc;">상대방</div>
        <button onclick="location.reload()" style="background: #ff3b30; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold;">종료</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div style="padding:20px; border-bottom:1px solid #eee; font-weight:bold; display:flex; justify-content:space-between;">
            친구 목록 <button onclick="window.handleAddFriend()">+ 추가</button>
        </div>
        <div id="friend-list" style="padding:10px;"></div>
    </nav>

    <main id="main-app" style="display:none; flex-direction:column; height:100%;">
        <header>
            <div class="header-left">
                <button onclick="window.toggleMenu()" style="background:none; border:none; font-size:24px;">≡</button>
                <span id="target-title">상대 선택</span>
            </div>
            <button id="btn-call" class="call-btn" onclick="window.makeCall()">📞</button>
        </header>

        <div id="chat-view"></div>

        <footer>
            <input type="text" id="m-in" placeholder="채팅 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button class="send-btn" onclick="window.handleSend()">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId, peer, myStream;

    window.toggleMenu = () => {
        document.getElementById('side-menu').classList.toggle('open');
        const overlay = document.getElementById('overlay');
        overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
    };

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            initPeer(); loadFriends(); window.toggleMenu();
        } else alert("비밀번호 오류");
    };

    function initPeer() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님의 전화를 받으시겠습니까?")) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                call.answer(myStream);
                document.getElementById('call-ui').style.display = 'flex';
                document.getElementById('call-target').innerText = call.peer;
                document.getElementById('call-status').innerText = "통화 중...";
                call.on('stream', (rs) => { const a = new Audio(); a.srcObject = rs; a.play(); });
            }
        });
    }

    window.makeCall = async () => {
        if(!targetId) return;
        document.getElementById('call-ui').style.display = 'flex';
        document.getElementById('call-target').innerText = targetId;
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const call = peer.call(targetId, myStream);
            call.on('stream', (rs) => {
                document.getElementById('call-status').innerText = "통화 중...";
                const a = new Audio(); a.srcObject = rs; a.play();
            });
        } catch(e) { alert("마이크 권한 필요"); location.reload(); }
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(fid => {
                const item = document.createElement('div');
                item.style = "padding:15px; border-bottom:1px solid #f0f0f0; font-weight:bold;";
                item.innerHTML = `👤 ${fid}`;
                item.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                list.appendChild(item);
            });
        });
    }

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        document.getElementById('btn-call').style.display = 'flex'; // 전화 버튼 보이기
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.s === myId ? 'me' : 'o'}`;
                div.innerText = m.t;
                v.appendChild(div);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), { t: i.value, s: myId, ts: serverTimestamp() });
        i.value = "";
    };

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:").toLowerCase().trim();
        if(fid && fid !== myId) {
            const check = await get(ref(db, `auth/${fid}`));
            if(check.exists()) await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
        }
    };
</script>
</body>
</html>
