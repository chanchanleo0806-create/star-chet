<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --yellow: #fee500; --accent: #ff3b30; --chat-bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [1] 인증 화면 (로그인/회원가입) */
        #auth-ui { position: fixed; inset: 0; background: #fff; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .auth-box input { padding: 15px; border: 1px solid #eee; border-radius: 12px; outline: none; }
        .auth-box button { padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* [2] 메인 레이아웃 */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 25px; z-index: 500; }
        .nav-item { color: #666; cursor: pointer; font-size: 24px; }
        .nav-item.active { color: #fff; }

        .content-container { flex: 1; position: relative; }
        .content-panel { position: absolute; inset: 0; display: none; flex-direction: column; background: #fff; }
        .content-panel.active { display: flex; }

        /* [3] 리스트 및 채팅 UI */
        .list-item { padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #f9f9f9; cursor: pointer; }
        .list-img { width: 50px; height: 50px; border-radius: 18px; object-fit: cover; background: #eee; }
        
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); z-index: 800; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-all; }
        .me { align-self: flex-end; background: var(--yellow); border-top-right-radius: 2px; }
        .you { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }

        /* [4] 프로필 & 통화 연결 UI */
        #profile-popup { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; color: #fff; }
        .p-bg { position: absolute; inset: 0; background: #848b94; z-index: 1; }
        .p-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .p-ui { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 60px; }
        .p-btns { display: flex; gap: 40px; border-top: 0.5px solid rgba(255,255,255,0.3); width: 100%; justify-content: center; padding-top: 30px; }
        
        #calling-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .pulse { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--yellow); animation: pulse-ani 1.5s infinite; margin-bottom: 20px; }
        @keyframes pulse-ani { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(254, 229, 0, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(254, 229, 0, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(254, 229, 0, 0); } }

        /* [5] 통화 화면 */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v-box { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; overflow: hidden; border: 2px solid #fff; z-index: 5010; }
        #local-v { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

<div id="auth-ui">
    <div id="auth-box" class="auth-box">
        <h2 id="auth-title">STAR TALK</h2>
        <input type="text" id="authId" placeholder="아이디">
        <input type="password" id="authPw" placeholder="비밀번호">
        <button onclick="window.handleAuth('login')" style="background:#000; color:#fff;">로그인</button>
        <button onclick="window.handleAuth('signup')" style="background:#f5f5f5;">회원가입</button>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="nav-item" onclick="window.showPanel('set', this)">⚙️</div>
    </nav>
    <div class="content-container">
        <div id="panel-friend" class="content-panel active">
            <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">+</span></div>
            <div id="friend-list"></div>
        </div>
        <div id="panel-set" class="content-panel">
            <div style="padding:40px; text-align:center;">
                <h3 id="my-name-display" style="margin-bottom:20px;">내 프로필</h3>
                <button onclick="window.doLogout()" style="padding:10px 20px; background:#eee; border:none; border-radius:8px;">로그아웃</button>
            </div>
        </div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; background:var(--chat-bg); display:flex; align-items:center;">
        <span onclick="window.closeChat()" style="cursor:pointer; font-size:20px; margin-right:15px;">◀</span>
        <b id="chat-target-name">이름</b>
    </div>
    <div id="chat-view"></div>
    <div style="padding:10px; background:#fff; display:flex; gap:10px;">
        <input type="text" id="msg-input" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; outline:none;" onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:10px; font-weight:bold;">전송</button>
    </div>
</div>

<div id="profile-popup">
    <div class="p-bg"><img src="https://via.placeholder.com/800x1200/848b94/848b94"></div>
    <div class="p-ui">
        <span onclick="window.closePop()" style="position:absolute; top:20px; left:20px; font-size:24px; cursor:pointer;">✕</span>
        <img id="p-pop-img" style="width:100px; height:100px; border-radius:35px; margin-bottom:15px; object-fit:cover;" src="https://via.placeholder.com/150">
        <b id="p-pop-name" style="font-size:20px; margin-bottom:40px;">이름</b>
        <div class="p-btns">
            <div onclick="window.openChat(window.selFid)" style="cursor:pointer; text-align:center;">💬<br><small>1:1 채팅</small></div>
            <div onclick="window.initCall(false)" style="cursor:pointer; text-align:center;">📞<br><small>통화보정</small></div>
            <div onclick="window.initCall(true)" style="cursor:pointer; text-align:center;">🎥<br><small>영상보정</small></div>
        </div>
    </div>
</div>

<div id="calling-overlay">
    <div class="pulse"><img id="calling-img" src="https://via.placeholder.com/100" style="width:100%; height:100%; border-radius:50%;"></div>
    <b id="calling-name">이름</b>
    <p style="margin-top:10px; opacity:0.7;">전화 연결 중...</p>
    <div onclick="window.endCall()" style="margin-top:50px; width:60px; height:60px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">✕</div>
</div>

<div id="call-ui">
    <video id="remote-v" autoplay playsinline></video>
    <div id="local-v-box"><video id="local-v" autoplay playsinline muted></video></div>
    <div style="position:absolute; bottom:50px; width:100%; display:flex; justify-content:center;">
        <div onclick="window.endCall()" style="width:60px; height:60px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;">✕</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, peer, myStream, currentCall, selFid, activeRid;

    window.onload = () => { if(localStorage.getItem('st_auto_id')) { myId = localStorage.getItem('st_auto_id'); startApp(); } };

    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        if(!id || !pw) return alert("아이디와 비번을 입력하세요.");
        const snap = await get(ref(db, `users/${id}`));
        if(type === 'signup') {
            if(snap.exists()) return alert("이미 있는 아이디입니다.");
            await set(ref(db, `users/${id}`), {id, pw, name: id});
            alert("가입 완료! 로그인 해주세요.");
        } else {
            if(snap.exists() && snap.val().pw === pw) {
                myId = id; localStorage.setItem('st_auto_id', id); startApp();
            } else alert("정보가 틀립니다.");
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        document.getElementById('my-name-display').innerText = myId + "님 반갑습니다";
        
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님의 전화를 받으시겠습니까?")) {
                const isVideo = call.metadata?.video;
                myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:isVideo });
                call.answer(myStream);
                handleCallUI(call, isVideo);
            }
        });
        loadFriends();
    }

    // [채팅 로직 보정]
    window.openChat = (fid) => {
        window.closePop();
        window.selFid = fid;
        activeRid = [myId, fid].sort().join('_');
        document.getElementById('chat-target-name').innerText = fid;
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) Object.values(snap.val()).forEach(m => {
                const d = document.createElement('div');
                d.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                d.innerText = m.t;
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };
    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), {s: myId, t: i.value.trim()});
        i.value = "";
    };
    window.closeChat = () => document.getElementById('chat-window').style.display = 'none';

    // [통화 로직 보정]
    window.initCall = async (isVideo) => {
        window.closePop();
        document.getElementById('calling-name').innerText = window.selFid;
        document.getElementById('calling-overlay').style.display = 'flex';
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true }, 
                video: isVideo ? { facingMode: "user" } : false 
            });
            const call = peer.call(window.selFid, myStream, { metadata: { video: isVideo } });
            handleCallUI(call, isVideo);
        } catch(e) { alert("권한 거부됨"); window.endCall(); }
    };

    function handleCallUI(call, isVideo) {
        currentCall = call;
        call.on('stream', rs => {
            document.getElementById('calling-overlay').style.display = 'none';
            document.getElementById('call-ui').style.display = 'block';
            document.getElementById('remote-v').srcObject = rs;
            document.getElementById('local-v').srcObject = myStream;
            document.getElementById('local-v-box').style.display = isVideo ? 'block' : 'none';
        });
        call.on('close', window.endCall);
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('calling-overlay').style.display = 'none';
        document.getElementById('call-ui').style.display = 'none';
    };

    // [친구 및 유틸]
    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const l = document.getElementById('friend-list'); l.innerHTML = "";
            if(snap.exists()) Object.keys(snap.val()).forEach(fid => {
                const d = document.createElement('div'); d.className="list-item";
                d.innerHTML = `<img class="list-img" src="https://via.placeholder.com/50"><b>${fid}</b>`;
                d.onclick = () => { window.selFid = fid; document.getElementById('p-pop-name').innerText = fid; document.getElementById('profile-popup').style.display='flex'; };
                l.appendChild(d);
            });
        });
    }
    window.addFriend = () => {
        const fid = prompt("추가할 ID:").trim().toLowerCase();
        if(fid && fid !== myId) update(ref(db), {[`friends/${myId}/${fid}`]:{id:fid}, [`friends/${fid}/${myId}`]:{id:myId}});
    };
    window.closePop = () => document.getElementById('profile-popup').style.display = 'none';
    window.showPanel = (p, el) => {
        document.querySelectorAll('.content-panel').forEach(v => v.classList.remove('active'));
        document.getElementById(`panel-${p}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
        el.classList.add('active');
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
