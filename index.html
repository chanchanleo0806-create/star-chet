<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --yellow: #fee500; --accent: #ff3b30; --chat-bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [1] 공통 스타일 */
        .content-panel { position: absolute; inset: 0; display: none; flex-direction: column; background: #fff; }
        .content-panel.active { display: flex; }
        .btn-round { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }

        /* [2] 채팅 UI 보정 (파일 업로드 추가) */
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); z-index: 800; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; }
        .me { align-self: flex-end; background: var(--yellow); }
        .you { align-self: flex-start; background: #fff; }
        .file-msg { display: block; color: #007aff; text-decoration: none; font-weight: bold; margin-top: 5px; }
        .chat-input-bar { padding: 10px; background: #fff; display: flex; align-items: center; gap: 8px; }
        
        /* [3] 프로필 편집 UI */
        #edit-profile-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: #fff; }
        .edit-box { background: #fff; color: #000; width: 300px; padding: 25px; border-radius: 20px; text-align: center; }

        /* [4] 통화 UI */
        #calling-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v-box { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; border: 2px solid #fff; overflow: hidden; }
    </style>
</head>
<body>

<div id="auth-ui" style="position:fixed; inset:0; background:#fff; z-index:10000; display:flex; align-items:center; justify-content:center;">
    <div class="auth-box" style="width:280px; display:flex; flex-direction:column; gap:10px;">
        <h2 style="text-align:center;">STAR TALK</h2>
        <input type="text" id="authId" placeholder="아이디">
        <input type="password" id="authPw" placeholder="비밀번호">
        <button onclick="window.handleAuth('login')" style="padding:15px; background:#000; color:#fff; border-radius:12px;">로그인</button>
        <button onclick="window.handleAuth('signup')" style="padding:10px; background:none; border:none; color:#666;">회원가입</button>
    </div>
</div>

<div id="main-app" style="display:none; height:100%; width:100%;">
    <nav style="width:70px; background:var(--side); display:flex; flex-direction:column; align-items:center; padding-top:20px; gap:30px;">
        <div onclick="window.showPanel('friend', this)" style="color:#fff; cursor:pointer; font-size:24px;">👤</div>
        <div onclick="window.showPanel('set', this)" style="color:#666; cursor:pointer; font-size:24px;">⚙️</div>
    </nav>

    <div style="flex:1; position:relative;">
        <div id="panel-friend" class="content-panel active">
            <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">+</span></div>
            <div id="friend-list"></div>
        </div>

        <div id="panel-set" class="content-panel">
            <div style="padding:20px; text-align:center;">
                <div style="position:relative; display:inline-block;">
                    <img id="my-profile-preview" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:40px; object-fit:cover;">
                    <button onclick="document.getElementById('profile-upload').click()" style="position:absolute; bottom:0; right:0; background:#000; color:#fff; border:none; border-radius:50%; width:30px; height:30px;">+</button>
                </div>
                <input type="file" id="profile-upload" hidden accept="image/*" onchange="window.updateProfilePic(this)">
                <h3 id="my-name-display" style="margin-top:15px;">이름</h3>
                <button onclick="window.openEditName()" class="btn-round" style="margin-top:10px; background:#f5f5f5;">이름 편집</button>
                <br><br>
                <button onclick="window.doLogout()" style="color:red; background:none; border:none;">로그아웃</button>
            </div>
        </div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; background:var(--chat-bg); display:flex; align-items:center;">
        <span onclick="window.closeChat()" style="cursor:pointer; font-size:20px; margin-right:15px;">◀</span>
        <b id="chat-target-name">이름</b>
    </div>
    <div id="chat-view"></div>
    <div class="chat-input-bar">
        <button onclick="document.getElementById('file-input').click()" style="background:none; border:none; font-size:20px;">📎</button>
        <input type="file" id="file-input" hidden onchange="window.uploadFile(this)">
        <input type="text" id="msg-input" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; outline:none;" placeholder="메시지 입력...">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:10px; font-weight:bold;">전송</button>
    </div>
</div>

<div id="profile-popup" style="position:fixed; inset:0; z-index:2000; display:none; flex-direction:column; color:#fff;">
    <div style="position:absolute; inset:0; background:#848b94;"><img id="p-pop-bg" src="" style="width:100%; height:100%; object-fit:cover; filter:brightness(0.6);"></div>
    <div style="position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:60px;">
        <span onclick="window.closePop()" style="position:absolute; top:20px; left:20px; font-size:24px; cursor:pointer;">✕</span>
        <img id="p-pop-img" src="https://via.placeholder.com/150" style="width:100px; height:100px; border-radius:35px; margin-bottom:15px; object-fit:cover;">
        <b id="p-pop-name" style="font-size:20px; margin-bottom:40px;">이름</b>
        <div style="display:flex; gap:40px; border-top:0.5px solid rgba(255,255,255,0.3); width:100%; justify-content:center; padding-top:30px;">
            <div onclick="window.openChat(window.selFid)" style="cursor:pointer; text-align:center;">💬<br><small>1:1 채팅</small></div>
            <div onclick="window.initCall(false)" style="cursor:pointer; text-align:center;">📞<br><small>음성 통화</small></div>
            <div onclick="window.initCall(true)" style="cursor:pointer; text-align:center;">🎥<br><small>영상 통화</small></div>
        </div>
    </div>
</div>

<div id="calling-overlay">...</div>
<div id="call-ui">...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, selFid, myName;

    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        if(!id || !pw) return alert("입력 필수");
        const snap = await get(ref(db, `users/${id}`));
        if(type === 'signup') {
            if(snap.exists()) return alert("중복 아이디");
            await set(ref(db, `users/${id}`), {id, pw, name: id, pic: ""});
            alert("가입완료");
        } else {
            if(snap.exists() && snap.val().pw === pw) {
                myId = id; localStorage.setItem('st_auto_id', id); startApp();
            } else alert("불일치");
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        onValue(ref(db, `users/${myId}`), snap => {
            const d = snap.val();
            myName = d.name;
            document.getElementById('my-name-display').innerText = d.name;
            if(d.pic) document.getElementById('my-profile-preview').src = d.pic;
        });
        loadFriends();
    }

    // [1] 프로필 편집 기능
    window.openEditName = () => {
        const newName = prompt("변경할 이름을 입력하세요", myName);
        if(newName) update(ref(db, `users/${myId}`), {name: newName});
    };
    window.updateProfilePic = (el) => {
        const file = el.files[0];
        const reader = new FileReader();
        reader.onloadend = () => {
            update(ref(db, `users/${myId}`), {pic: reader.result});
        };
        if(file) reader.readAsDataURL(file);
    };

    // [2] 파일 업로드 기능 (채팅창)
    window.uploadFile = (el) => {
        const file = el.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
            push(ref(db, `msgs/${activeRid}`), {
                s: myId,
                t: `파일 전송: ${file.name}`,
                file: reader.result,
                fileName: file.name,
                type: 'file'
            });
        };
        reader.readAsDataURL(file);
    };

    // [3] 채팅방 리스너 보정 (파일 렌더링 포함)
    window.openChat = (fid) => {
        window.closePop(); selFid = fid;
        activeRid = [myId, fid].sort().join('_');
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) Object.values(snap.val()).forEach(m => {
                const d = document.createElement('div');
                d.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                if(m.type === 'file') {
                    d.innerHTML = `📄 <a href="${m.file}" download="${m.fileName}" class="file-msg">${m.fileName}</a>`;
                } else { d.innerText = m.t; }
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    // [기타 함수 - 친구 추가, 로그아웃 등 기존과 동일]
    window.sendMsg = () => {
        const i = document.getElementById('msg-input');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), {s: myId, t: i.value.trim(), type: 'text'});
        i.value = "";
    };
    window.loadFriends = () => {
        onValue(ref(db, `friends/${myId}`), snap => {
            const l = document.getElementById('friend-list'); l.innerHTML = "";
            if(snap.exists()) Object.keys(snap.val()).forEach(fid => {
                const d = document.createElement('div'); d.className="list-item";
                d.style="padding:15px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px; cursor:pointer;";
                d.innerHTML = `<img src="https://via.placeholder.com/50" style="width:40px; height:40px; border-radius:15px;"> <b>${fid}</b>`;
                d.onclick = () => { window.selFid = fid; document.getElementById('p-pop-name').innerText = fid; document.getElementById('profile-popup').style.display='flex'; };
                l.appendChild(d);
            });
        });
    };
    window.addFriend = () => {
        const fid = prompt("추가할 ID:").trim().toLowerCase();
        if(fid && fid !== myId) update(ref(db), {[`friends/${myId}/${fid}`]:{id:fid}, [`friends/${fid}/${myId}`]:{id:myId}});
    };
    window.closePop = () => document.getElementById('profile-popup').style.display = 'none';
    window.closeChat = () => document.getElementById('chat-window').style.display = 'none';
    window.showPanel = (p, el) => {
        document.querySelectorAll('.content-panel').forEach(v => v.classList.remove('active'));
        document.getElementById(`panel-${p}`).classList.add('active');
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
