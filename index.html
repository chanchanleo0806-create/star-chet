<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK AUTO-LOGIN</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --yellow: #fee500; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .login-box input { padding: 15px; border: 1px solid #eee; border-radius: 12px; outline: none; }
        .login-box button { padding: 15px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* [메인 레이아웃] */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 25px; }
        .nav-item { color: #666; cursor: pointer; font-size: 22px; }
        .nav-item.active { color: #fff; }
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; }
        .content-panel.active { display: flex; }
        
        .header { padding: 20px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-box">
        <h2 style="text-align:center; margin-bottom:10px;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호 (선택사항)">
        <button onclick="window.doLogin()">로그인 및 자동로그인 설정</button>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="nav-item" onclick="window.showPanel('profile', this)">⚙️</div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div class="header">친구 <span onclick="window.addFriend()" style="cursor:pointer;">➕</span></div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-profile" class="content-panel">
        <div class="header">설정</div>
        <div style="padding:40px; text-align:center;">
            <div id="my-id-view" style="font-size:18px; font-weight:bold; margin-bottom:20px;"></div>
            <button onclick="window.doLogout()" style="padding:15px 30px; background:#ff3b30; color:#fff; border:none; border-radius:12px; font-weight:bold;">로그아웃 (자동로그인 해제)</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, peer;

    // [핵심: 페이지 로드 시 자동 로그인 확인]
    window.addEventListener('load', () => {
        const savedId = localStorage.getItem('st_auto_id');
        if (savedId) {
            console.log("자동 로그인 시도:", savedId);
            myId = savedId;
            startApp();
        }
    });

    // [로그인 버튼 클릭 시]
    window.doLogin = () => {
        const idInput = document.getElementById('myId').value.trim().toLowerCase();
        if (!idInput) {
            alert("아이디를 입력해주세요.");
            return;
        }
        
        myId = idInput;
        // 브라우저에 아이디 저장 (자동 로그인 핵심)
        localStorage.setItem('st_auto_id', myId);
        startApp();
    };

    // [앱 시작 로직]
    function startApp() {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        document.getElementById('my-id-view').innerText = `내 아이디: ${myId}`;
        
        // PeerJS 초기화
        peer = new Peer(myId);
        
        // 친구 목록 로드
        loadFriends();
    }

    // [로그아웃: 자동 로그인 해제]
    window.doLogout = () => {
        if(confirm("로그아웃 하시겠습니까? 다음 접속 시 다시 로그인해야 합니다.")) {
            localStorage.removeItem('st_auto_id'); // 자동 로그인 정보 삭제
            location.reload(); // 페이지 새로고침하여 로그인 화면으로 이동
        }
    };

    // 친구 기능
    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.val()) {
                Object.keys(snap.val()).forEach(fid => {
                    const d = document.createElement('div');
                    d.style = "padding:15px; border-bottom:1px solid #eee;";
                    d.innerHTML = `<b>${fid}</b>`;
                    list.appendChild(d);
                });
            }
        });
    }

    window.addFriend = () => {
        const fid = prompt("친구 ID:").trim().toLowerCase();
        if(fid && fid !== myId) {
            update(ref(db), {
                [`friends/${myId}/${fid}`]: {id: fid},
                [`friends/${fid}/${myId}`]: {id: myId}
            });
        }
    };

    window.showPanel = (t, el) => {
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    };
</script>
</body>
</html>
