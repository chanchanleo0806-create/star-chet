<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --card: rgba(255, 255, 255, 0.03); --yellow: #fee500; --text: #ffffff; --chat-bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

        /* [로그인 UI] */
        #auth-ui { position: fixed; inset: 0; background: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #0a0a0c 100%); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 340px; background: var(--card); backdrop-filter: blur(20px); padding: 50px 30px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; }
        .input-group input { width: 100%; padding: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fff; margin-bottom: 12px; outline: none; }
        .btn-login { width: 100%; padding: 18px; background: var(--yellow); border: none; border-radius: 20px; font-weight: 700; cursor: pointer; color: #000; }

        /* [메인 앱] */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 75px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 30px; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { color: #444; cursor: pointer; font-size: 26px; }
        .nav-item.active { color: var(--yellow); }
        .content-panel { flex: 1; position: relative; background: #fff; color: #000; border-radius: 30px 0 0 0; overflow: hidden; }
        .panel { display: none; height: 100%; flex-direction: column; }
        .panel.active { display: flex; }

        /* [친구 리스트] */
        .list-item { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #f9f9f9; cursor: pointer; position: relative; }
        .list-item img { width: 45px; height: 45px; border-radius: 18px; object-fit: cover; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; position: absolute; left: 45px; bottom: 15px; background: #ccc; }
        .status-dot.online { background: #2ecc71; }

        /* [채팅창] */
        #chat-window { position: fixed; inset: 0 0 0 75px; background: var(--chat-bg); z-index: 800; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble-container { display: flex; flex-direction: column; max-width: 80%; }
        .me-container { align-self: flex-end; align-items: flex-end; }
        .you-container { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 10px; border-radius: 12px; font-size: 14px; color: #000; background: #fff; }
        .me { background: var(--yellow); }
        .bubble img { max-width: 200px; border-radius: 8px; display: block; margin-top: 5px; }

        /* [통화 UI - PIP 방지 최적화] */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; border: 2px solid #fff; }
        .end-btn { position: absolute; bottom: 50px; width: 65px; height: 65px; background: #ff3b30; border-radius: 50%; display: flex; align-items:center; justify-content:center; cursor:pointer; font-size: 28px; color: #fff; z-index: 6000; }
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <h2 style="margin-bottom:30px;">STAR TALK</h2>
        <div class="input-group">
            <input type="text" id="authId" placeholder="아이디">
            <input type="password" id="authPw" placeholder="비밀번호">
        </div>
        <button class="btn-login" onclick="window.handleAuth('login')">로그인</button>
        <p style="margin-top:20px; font-size:13px; color:rgba(255,255,255,0.4)">계정이 없나요? <span onclick="window.handleAuth('signup')" style="color:#fff; cursor:pointer;">회원가입</span></p>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.switchTab('friend', this)">👤</div>
        <div class="nav-item" onclick="window.switchTab('set', this)">⚙️</div>
    </nav>
    <div class="content-panel">
        <div id="panel-friend" class="panel active">
            <div style="padding:25px; font-size:20px; font-weight:800;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer; color:var(--yellow); background:#000; padding:0 8px; border-radius:50%;">+</span></div>
            <div id="friend-list"></div>
        </div>
        <div id="panel-set" class="panel">
            <div style="padding:25px; font-size:20px; font-weight:800;">설정</div>
            <div style="text-align:center; padding:50px;">
                <button onclick="window.doLogout()" style="color:red; background:none; border:none;">로그아웃</button>
            </div>
        </div>
    </div>
</div>

<div id="call-ui">
    <video id="remote-video" autoplay playsinline disablepictureinpicture oncontextmenu="return false;"></video>
    <video id="local-video" autoplay playsinline muted disablepictureinpicture oncontextmenu="return false;"></video>
    <div class="end-btn" onclick="window.endCall()">✕</div>
</div>

<audio id="alert-sound" src="https://t1.daumcdn.net/kakaotalk/public/sound/talk.mp3"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, selFid, peer, myStream, currentCall;

    // [전화 및 메시지 알림]
    function playAlert() {
        const audio = document.getElementById('alert-sound');
        audio.play().catch(()=>{});
        if("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
    }

    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        if(!id || !pw) return;
        const userRef = ref(db, `users/${id}`);
        const snap = await get(userRef);
        if(type === 'signup') {
            await set(userRef, { id, pw, name: id, pic: "" }); alert("가입 완료");
        } else {
            if(snap.exists() && snap.val().pw === pw) {
                myId = id; localStorage.setItem('st_id', id); startApp();
            } else alert("정보 불일치");
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        set(ref(db, `status/${myId}`), "online");
        onDisconnect(ref(db, `status/${myId}`)).set(serverTimestamp());

        // [PeerJS 초기화 및 수신 대기 - 중요!]
        peer = new Peer(myId);
        
        peer.on('open', () => console.log('내 피어 아이디:', myId));

        // 전화가 왔을 때 실행 (수신 알림)
        peer.on('call', async (call) => {
            playAlert(); // 전화 올 때 소리
            if(confirm("📞 전화가 왔습니다! 받으시겠습니까?")) {
                const isVideo = call.metadata.video;
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
                call.answer(myStream);
                handleCallStream(call, isVideo);
            } else {
                call.close();
            }
        });

        loadFriends();
    }

    // [전화 걸기]
    window.initCall = async (video) => {
        if(!window.selFid) return alert("대상을 선택하세요");
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
            document.getElementById('local-video').srcObject = myStream;
            document.getElementById('call-ui').style.display = 'flex';
            
            // 전화를 거는 부분
            const call = peer.call(window.selFid, myStream, { metadata: { video: video } });
            handleCallStream(call, video);
        } catch(e) { alert("카메라/마이크 권한이 없습니다."); }
    };

    function handleCallStream(call, isVideo) {
        currentCall = call;
        document.getElementById('call-ui').style.display = 'flex';
        
        // 전체화면 시도 (PIP 방지 보조)
        const callDiv = document.getElementById('call-ui');
        if(callDiv.requestFullscreen) callDiv.requestFullscreen();

        call.on('stream', (remoteStream) => {
            const remoteVid = document.getElementById('remote-video');
            remoteVid.srcObject = remoteStream;
            // PIP 차단 강제 설정
            remoteVid.disablePictureInPicture = true;
        });

        call.on('close', () => window.endCall());
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-ui').style.display = 'none';
        if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    };

    // [친구 및 채팅 (알림 포함)]
    function loadFriends() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(fid => {
                    const item = document.createElement('div');
                    item.className = "list-item";
                    item.innerHTML = `<b>${fid}</b><div id="dot-${fid}" class="status-dot"></div>`;
                    item.onclick = () => { window.selFid = fid; window.openChat(fid); };
                    list.appendChild(item);
                });
            }
        });
    }

    window.openChat = (fid) => {
        activeRid = [myId, fid].sort().join('_');
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(k => {
                    const m = data[k];
                    // 알림 로직: 내가 안 읽은 새 메시지일 때
                    if(m.s !== myId && !m.read) {
                        update(ref(db, `msgs/${activeRid}/${k}`), { read: true });
                        playAlert();
                    }
                    const c = document.createElement('div');
                    c.className = `bubble-container ${m.s === myId ? 'me-container' : 'you-container'}`;
                    c.innerHTML = `<div class="bubble ${m.s === myId ? 'me' : ''}">${m.t}</div>`;
                    v.appendChild(c);
                });
            }
            v.scrollTop = v.scrollHeight;
        });
    };

    // 기본 보조 함수들
    window.switchTab = (p, el) => {
        document.querySelectorAll('.panel').forEach(v => v.classList.remove('active'));
        document.getElementById(`panel-${p}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    };
    window.addFriend = () => {
        const fid = prompt("친구 ID:").trim().toLowerCase();
        if(fid) update(ref(db), {[`friends/${myId}/${fid}`]:{id:fid}, [`friends/${fid}/${myId}`]:{id:myId}});
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
    if(localStorage.getItem('st_id')) { myId = localStorage.getItem('st_id'); startApp(); }
</script>
</body>
</html>
