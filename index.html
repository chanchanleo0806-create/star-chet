<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR CHAT - VOICE PLUS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #9bbbd4; --me: #fef01b; --other: #ffffff; --dark: #343d46; }
        body { background: #eee; margin: 0; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 450px; background: var(--bg); display: flex; flex-direction: column; position: relative; }
        #login-sec { position: absolute; inset: 0; background: #fff; z-index: 20; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        .in { padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        header { background: var(--dark); color: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .m { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .m.o { align-self: flex-start; background: var(--other); border-top-left-radius: 2px; }
        .m.me { align-self: flex-end; background: var(--me); border-top-right-radius: 2px; }
        .bottom { background: #fff; padding: 10px; display: flex; gap: 8px; }
        #input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; }
        .v-btn { border: none; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; color: #fff; background: #6e767d; }
        .v-btn.on { background: #f04747; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-sec">
        <h2 style="text-align:center;">🔐 보이스 채팅 입장</h2>
        <input type="number" id="rNum" class="in" placeholder="방 번호 (1-100)">
        <input type="password" id="rPw" class="in" placeholder="비밀번호">
        <button onclick="join()" style="padding:15px; background:var(--dark); color:#fff; border:none; border-radius:8px; font-weight:bold;">입장</button>
    </div>

    <header>
        <b id="info">대기 중...</b>
        <button id="vBtn" class="v-btn" onclick="startVoice()">🎤 음성 연결</button>
    </header>

    <div id="msgs"></div>
    <div id="audio-container"></div> <div class="bottom">
        <input type="text" id="input" placeholder="메시지..." onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()" style="background:var(--me); border:none; padding:0 15px; border-radius:20px; font-weight:bold;">전송</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const conf = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(conf);
    const db = getDatabase(app);
    let room = "", isAdmin = false, myId = "", peer = null;

    window.join = async () => {
        room = document.getElementById('rNum').value;
        const pw = document.getElementById('rPw').value;
        if(!room || !pw) return alert("입력 필수!");

        const rRef = ref(db, `rooms/${room}`);
        const snap = await get(rRef);
        
        // 내 Peer ID 생성 (방번호_랜덤)
        myId = "user_" + room + "_" + Math.random().toString(36).substring(7);
        peer = new Peer(myId);

        if(!snap.exists() || !snap.val().password) {
            isAdmin = true;
            await set(rRef, { password: pw, owner: myId });
            onDisconnect(rRef).remove();
            onDisconnect(ref(db, `chats/${room}`)).remove();
        } else {
            if(snap.val().password !== pw) return alert("비번 틀림!");
        }

        document.getElementById('login-sec').style.display = 'none';
        document.getElementById('info').innerText = room + "번 방";
        
        // 채팅 리스너
        onValue(ref(db, `chats/${room}`), (s) => {
            const box = document.getElementById('msgs'); box.innerHTML = "";
            const data = s.val();
            if(data) {
                Object.values(data).forEach(m => {
                    const d = document.createElement('div');
                    d.className = `m ${m.sid === myId ? 'me' : 'o'}`;
                    d.innerText = m.t;
                    box.appendChild(d);
                });
                box.scrollTop = box.scrollHeight;
            }
        });

        // 음성 전화 걸기 수신 준비
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                call.answer(stream);
                call.on('stream', remoteStream => playStream(remoteStream));
            });
        });
    };

    window.send = () => {
        const i = document.getElementById('input'); if(!i.value) return;
        push(ref(db, `chats/${room}`), { t: i.value, sid: myId });
        i.value = "";
    };

    window.startVoice = async () => {
        const btn = document.getElementById('vBtn');
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});
        btn.classList.add('on'); btn.innerText = "🔊 연결 중...";

        // 방에 있는 다른 사람들에게 전화 걸기
        const rRef = ref(db, `chats/${room}`);
        const snap = await get(rRef);
        const users = new Set();
        if(snap.val()) Object.values(snap.val()).forEach(m => { if(m.sid !== myId) users.add(m.sid); });

        users.forEach(userId => {
            const call = peer.call(userId, stream);
            call.on('stream', remoteStream => playStream(remoteStream));
        });
        alert("음성 채팅이 시작되었습니다!");
    };

    function playStream(stream) {
        const audio = document.createElement('audio');
        audio.srcObject = stream;
        audio.autoplay = true;
        document.getElementById('audio-container').appendChild(audio);
    }
</script>
</body>
</html>
