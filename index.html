<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StarChat - Multi Channel System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .server-icon { @apply w-12 h-12 bg-[#313338] text-[#23A559] rounded-[24px] flex items-center justify-center hover:bg-[#23A559] hover:text-white transition-all cursor-pointer; }
        .active-server { border-radius: 16px !important; background-color: #5865F2 !important; color: white !important; }
        .channel-item { @apply flex items-center px-2 py-1 rounded cursor-pointer text-[#949BA4] hover:bg-[#35373C] hover:text-white transition-all; }
        .active-channel { @apply bg-[#3F4147] text-white !important; }
    </style>
</head>
<body class="bg-[#313338] text-[#DBDEE1] font-sans overflow-hidden text-sm">

<div class="flex h-screen w-full">
    <nav class="w-[72px] bg-[#1E1F22] flex flex-col items-center py-3 space-y-2 shrink-0">
        <div id="login-btn" class="server-icon overflow-hidden border-2 border-transparent">
            <span id="user-status" class="text-[10px] font-bold text-center">로그인</span>
        </div>
        <div class="w-8 h-[2px] bg-[#35363C] rounded-full mx-auto"></div>
        <div id="server-list" class="flex flex-col space-y-2 w-full items-center"></div>
        <button id="add-server-btn" class="server-icon text-2xl">+</button>
    </nav>

    <aside class="w-60 bg-[#2B2D31] flex flex-col shrink-0 border-r border-[#1E1F22]">
        <div id="active-server-name" class="h-12 px-4 flex items-center shadow-md font-bold text-white border-b border-[#1E1F22]">서버 선택</div>
        
        <div class="flex-1 overflow-y-auto">
            <div class="p-3">
                <div class="flex items-center justify-between text-[11px] font-bold text-[#949BA4] uppercase mb-2 px-2">
                    <span>채널 목록</span>
                    <button id="add-channel-btn" class="hidden hover:text-white text-lg">+</button>
                </div>
                <div id="channel-list" class="space-y-[2px]"></div>
            </div>

            <div class="p-3 border-t border-[#35363C]">
                <div class="text-[11px] font-bold text-[#949BA4] uppercase mb-2 px-2">접속 유저</div>
                <div id="user-list" class="space-y-1"></div>
            </div>
        </div>

        <div id="user-footer" class="p-3 bg-[#232428] hidden">
            <button onclick="editProfile()" class="w-full text-[10px] bg-[#4E5058] py-1 rounded mb-2">프로필 수정</button>
            <div class="flex items-center">
                <img id="my-img" class="w-8 h-8 rounded-full mr-2">
                <span id="my-name" class="font-bold truncate">유저</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#313338]">
        <header class="h-12 px-4 flex items-center shadow-sm border-b border-[#1E1F22] font-bold text-white shrink-0">
            <span class="text-[#80848E] mr-2 text-xl">#</span>
            <span id="active-channel-name">채널을 선택하세요</span>
        </header>
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
        <form id="chat-form" class="p-4 shrink-0">
            <div class="bg-[#383A40] rounded-lg p-3">
                <input id="chat-input" type="text" placeholder="메시지 입력..." class="bg-transparent w-full outline-none" disabled autocomplete="off">
            </div>
        </form>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:ee6b941e1a70bcaa02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let activeSid = null;
    let activeCid = null;

    setPersistence(auth, browserLocalPersistence);

    // [서버 입장]
    window.selectServer = (sid, name, ownerId) => {
        activeSid = sid;
        document.getElementById('active-server-name').innerText = name;
        
        // 방장 권한 확인 (채널 추가 버튼 표시)
        const isAdmin = (ownerId === auth.currentUser.uid || ownerId === 'admin');
        document.getElementById('add-channel-btn').style.display = isAdmin ? 'block' : 'none';
        
        // 서버 내 유저 정보 등록
        set(ref(db, `servers/${sid}/users/${auth.currentUser.uid}`), {
            name: currentUser.customName || auth.currentUser.displayName,
            photo: currentUser.customPhoto || auth.currentUser.photoURL,
            uid: auth.currentUser.uid
        });

        // 1. 채널 목록 로드 (방 안에 방)
        onValue(ref(db, `servers/${sid}/channels`), (snap) => {
            const list = document.getElementById('channel-list');
            list.innerHTML = '';
            if (!snap.exists()) {
                // 채널이 없으면 기본 '일반' 채널 자동 생성
                if (isAdmin) createChannel('일반');
            }
            snap.forEach(c => {
                const cid = c.key;
                const cname = c.val().name;
                const el = document.createElement('div');
                el.className = `channel-item ${activeCid === cid ? 'active-channel' : ''}`;
                el.innerHTML = `<span class="mr-2 text-lg">#</span> ${cname}`;
                el.onclick = () => selectChannel(cid, cname);
                list.appendChild(el);
            });
        });

        // 2. 유저 목록 로드 (강퇴 기능 포함)
        onValue(ref(db, `servers/${sid}/users`), (snap) => {
            const ulist = document.getElementById('user-list');
            ulist.innerHTML = '';
            snap.forEach(u => {
                const ud = u.val();
                const kickBtn = (isAdmin && ud.uid !== auth.currentUser.uid) ? `<button onclick="kickUser('${sid}','${ud.uid}')" class="ml-auto text-red-400">❌</button>` : '';
                ulist.innerHTML += `<div class="flex items-center px-2 py-1"><img src="${ud.photo}" class="w-5 h-5 rounded-full mr-2"><span>${ud.name}</span>${kickBtn}</div>`;
            });
        });
    };

    // [채널 선택]
    window.selectChannel = (cid, cname) => {
        activeCid = cid;
        document.getElementById('active-channel-name').innerText = cname;
        document.getElementById('chat-input').disabled = false;
        loadMessages(activeSid, cid);
    };

    // [방장의 채널 추가]
    document.getElementById('add-channel-btn').onclick = () => {
        const name = prompt("새 채널 이름:");
        if (name) createChannel(name);
    };

    function createChannel(name) {
        const newRef = push(ref(db, `servers/${activeSid}/channels`));
        set(newRef, { name: name });
    }

    // [유저 강퇴]
    window.kickUser = (sid, uid) => {
        if (confirm("강퇴하시겠습니까?")) remove(ref(db, `servers/${sid}/users/${uid}`));
    };

    // [프로필 수정]
    window.editProfile = () => {
        const n = prompt("이름:", currentUser.displayName);
        const p = prompt("사진URL:", currentUser.photoURL);
        if (n) {
            currentUser.customName = n; currentUser.customPhoto = p;
            document.getElementById('my-name').innerText = n;
            document.getElementById('my-img').src = p || currentUser.photoURL;
        }
    };

    // 초기 로그인 설정
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('user-footer').classList.remove('hidden');
            document.getElementById('my-img').src = user.photoURL;
            document.getElementById('my-name').innerText = user.displayName;
            document.getElementById('user-status').innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
            
            // StarChat 공식서버 자동 입장
            selectServer('official', 'StarChat 공식서버', 'admin');
            loadServerList();
        }
    });

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

    function loadServerList() {
        onValue(ref(db, 'server_list'), (snap) => {
            const list = document.getElementById('server-list');
            list.innerHTML = `<div onclick="selectServer('official','StarChat 공식서버','admin')" class="server-icon mb-2">S</div>`;
            snap.forEach(s => {
                const d = s.val();
                list.innerHTML += `<div onclick="selectServer('${s.key}','${d.name}','${d.owner}')" class="server-icon mb-2">${d.initial}</div>`;
            });
        });
    }

    document.getElementById('add-server-btn').onclick = () => {
        const n = prompt("서버 이름:");
        if (n) {
            const r = push(ref(db, 'server_list'));
            set(r, { name: n, initial: n[0].toUpperCase(), owner: auth.currentUser.uid });
        }
    };

    function loadMessages(sid, cid) {
        onValue(ref(db, `chats/${sid}/${cid}`), (snap) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            snap.forEach(m => {
                const d = m.val();
                box.innerHTML += `<div class="flex items-start space-x-3"><img src="${d.photo}" class="w-9 h-9 rounded-full mt-1"><div><div class="flex items-baseline space-x-2"><span class="font-bold text-white text-sm">${d.name}</span></div><p class="text-sm text-gray-200">${d.text}</p></div></div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        if (!input.value || !activeSid || !activeCid) return;
        push(ref(db, `chats/${activeSid}/${activeCid}`), {
            text: input.value,
            name: currentUser.customName || auth.currentUser.displayName,
            photo: currentUser.customPhoto || auth.currentUser.photoURL,
            timestamp: serverTimestamp()
        });
        input.value = '';
    };
</script>
</body>
</html>
