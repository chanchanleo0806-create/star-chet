<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - SECURE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #FEE500; --bg: #bacee0; --dark: #3C1E1E; --white: #ffffff; }
        body { margin: 0; font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; height: 100vh; }
        #app { width: 100%; max-width: 480px; background: var(--bg); display: flex; flex-direction: column; position: relative; }
        
        /* 보안 로그인 화면 */
        .overlay { position: absolute; inset: 0; background: var(--main); z-index: 1000; display: flex; flex-direction: column; padding: 40px; align-items: center; justify-content: center; }
        .logo { font-size: 40px; font-weight: bold; color: var(--dark); margin-bottom: 30px; letter-spacing: -2px; }
        .in { width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 15px; background: var(--dark); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .hint { font-size: 11px; color: #666; margin-top: 10px; text-align: center; }

        /* 내부 레이아웃 */
        header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tab-menu { background: #fff; display: flex; border-bottom: 1px solid #ddd; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; color: #666; }
        .tab.active { color: var(--dark); border-bottom: 3px solid var(--dark); font-weight: bold; }

        #list-view { flex: 1; overflow-y: auto; background: #fff; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 10px; }
        
        /* 메시지 스타일 */
        .m-wrap { display: flex; flex-direction: column; max-width: 80%; }
        .m-box { padding: 8px 12px; border-radius: 10px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me { align-self: flex-end; align-items: flex-end; } .me .m-box { background: var(--main); border-top-right-radius: 0; }
        .o { align-self: flex-start; } .o .m-box { background: var(--white); border-top-left-radius: 0; }

        .bottom-bar { background: #fff; padding: 10px; display: none; gap: 8px; }
        #msg-input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; }
        
        /* 비디오통화 */
        #video-ui { position: absolute; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        video { flex: 1; width: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-layer" class="overlay">
        <div class="logo">STAR TALK</div>
        <input type="text" id="myId" class="in" placeholder="아이디">
        <input type="password" id="myPw" class="in" placeholder="비밀번호">
        <button onclick="secureLogin()" class="btn">로그인 / 회원가입</button>
        <p class="hint">첫 로그인 시 입력한 비번이 고정됩니다.</p>
    </div>

    <header>
        <span id="title-text">STAR TALK</span>
        <div>
            <button onclick="addItem('friend')" style="background:none; border:none; color:white; font-size:18px;">👤+</button>
            <button onclick="addItem('group')" style="background:none; border:none; color:white; font-size:18px;">👨‍👩‍👧‍👦+</button>
        </div>
    </header>

    <div class="tab-menu">
        <div class="tab active" onclick="showView('list')">목록</div>
        <div class="tab" id="chat-tab-name" onclick="showView('chat')">대화창</div>
    </div>

    <div id="list-view"></div>
    <div id="chat-view"></div>

    <div class="bottom-bar" id="input-area">
        <button onclick="openVideo()" style="border:none; background:none; font-size:20px;">📹</button>
        <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()" style="background:var(--main); border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">전송</button>
    </div>

    <div id="video-ui">
        <video id="rv" autoplay playsinline></video>
        <video id="lv" autoplay muted playsinline style="height:25%; border-top:2px solid #fff;"></video>
        <button onclick="location.reload()" style="padding:20px; background:#ff4747; color:#fff; border:none;">종료</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const conf = { /* 본인의 Firebase 설정을 넣으세요 */ };
    const app = initializeApp(conf);
    const db = getDatabase(app);
    let myId = "", peer = null, currentRoom = "";

    // [보안 로그인 로직]
    window.secureLogin = async () => {
        myId = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        if(!myId || !pw) return alert("아이디와 비번을 모두 입력하세요!");

        const userRef = ref(db, `auth/${myId}`);
        const snap = await get(userRef);

        if(!snap.exists()) {
            // 회원가입
            if(confirm("신규 아이디입니다. 이 비번으로 가입할까요?")) {
                await set(userRef, { pw: pw });
                startSession();
            }
        } else {
            // 로그인 체크
            if(snap.val().pw === pw) {
                startSession();
            } else {
                alert("비밀번호가 틀렸습니다!");
            }
        }
    };

    function startSession() {
        peer = new Peer(myId);
        peer.on('open', (id) => {
            document.getElementById('login-layer').style.display = 'none';
            document.getElementById('title-text').innerText = "내 코드: " + id;
            refreshList();
            listenCalls();
        });
    }

    // [목록 및 채팅 로직]
    window.addItem = (type) => {
        const val = prompt(type === 'friend' ? "친구 ID:" : "단톡방 이름:");
        if(!val) return;
        set(ref(db, `users/${myId}/${type}s/${val}`), { id: val });
    };

    function refreshList() {
        onValue(ref(db, `users/${myId}`), (snap) => {
            const listDiv = document.getElementById('list-view'); listDiv.innerHTML = "";
            const data = snap.val();
            if(data) {
                if(data.friends) Object.keys(data.friends).forEach(id => renderItem(id, '👤'));
                if(data.groups) Object.keys(data.groups).forEach(id => renderItem(id, '👨‍👩‍👧‍👦'));
            }
        });
    }

    function renderItem(id, icon) {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `<div>${icon}</div> <b>${id}</b>`;
        item.onclick = () => {
            currentRoom = icon === '👤' ? [myId, id].sort().join("_") : "group_"+id;
            document.getElementById('chat-tab-name').innerText = id;
            showView('chat');
            loadMsgs();
        };
        document.getElementById('list-view').appendChild(item);
    }

    function loadMsgs() {
        onValue(ref(db, `chat_data/${currentRoom}`), (snap) => {
            const chatDiv = document.getElementById('chat-view'); chatDiv.innerHTML = "";
            if(snap.val()) {
                Object.values(snap.val()).forEach(m => {
                    const isMe = m.sid === myId;
                    chatDiv.innerHTML += `<div class="m-wrap ${isMe?'me':'o'}"><small>${m.sid}</small><div class="m-box">${m.t}</div></div>`;
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        });
    }

    window.showView = (v) => {
        document.getElementById('list-view').style.display = v === 'list' ? 'block' : 'none';
        document.getElementById('chat-view').style.display = v === 'chat' ? 'flex' : 'none';
        document.getElementById('input-area').style.display = v === 'chat' ? 'flex' : 'none';
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (v==='list'?i===0:i===1)));
    };

    window.send = () => {
        const i = document.getElementById('msg-input'); if(!i.value) return;
        push(ref(db, `chat_data/${currentRoom}`), { t: i.value, sid: myId });
        i.value = "";
    };

    // [영상통화]
    window.openVideo = async () => {
        const target = prompt("통화할 대상 ID:");
        const s = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('video-ui').style.display = 'flex';
        document.getElementById('lv').srcObject = s;
        peer.call(target, s).on('stream', rs => document.getElementById('rv').srcObject = rs);
    };

    function listenCalls() {
        peer.on('call', async call => {
            if(confirm(call.peer + " 전화 수락?")) {
                const s = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('video-ui').style.display = 'flex';
                document.getElementById('lv').srcObject = s;
                call.answer(s);
                call.on('stream', rs => document.getElementById('rv').srcObject = rs);
            }
        });
    }
</script>
</body>
</html>
