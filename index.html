<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --menu-w: 280px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: #fff; height: 100vh; overflow: hidden; }

        /* [사이드 메뉴] */
        #side-menu {
            position: fixed; top: 0; left: calc(var(--menu-w) * -1); 
            width: var(--menu-w); height: 100%; background: #fff; z-index: 3000;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        #side-menu.open { left: 0; }
        .menu-header { padding: 25px 20px; font-weight: bold; font-size: 18px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: #f8f9fa; display: flex; align-items: center; gap: 10px; font-size: 15px; }
        .friend-item:active { background: #eee; }

        /* [배경 레이어] */
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }

        /* [메인 채팅] */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        header { height: 60px; padding: 0 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .menu-btn { font-size: 26px; background: none; border: none; cursor: pointer; padding: 5px; }

        #chat-view { flex: 1; overflow-y: auto; background: var(--bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.4; word-break: break-all; }
        .me { align-self: flex-end; background: var(--main); border-top-right-radius: 2px; }
        .o { align-self: flex-start; background: #fff; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        footer { padding: 10px; background: #fff; display: flex; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #m-in { flex: 1; height: 42px; border: 1px solid #ddd; border-radius: 21px; padding: 0 15px; font-size: 16px; outline: none; }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .login-logo { font-size: 32px; font-weight: bold; margin-bottom: 40px; }
        .login-input { width: 100%; max-width: 320px; height: 55px; margin-bottom: 12px; padding: 0 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
        .btn-login { width: 100%; max-width: 320px; height: 55px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 17px; }
    </style>
</head>
<body>

    <div id="login-ui">
        <div class="login-logo">STAR TALK</div>
        <input type="text" id="myId" class="login-input" placeholder="아이디" inputmode="email">
        <input type="password" id="myPw" class="login-input" placeholder="비밀번호">
        <button class="btn-login" onclick="window.handleLogin()">로그인 후 입장</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div class="menu-header">
            <span>친구 목록</span>
            <button onclick="window.handleAddFriend()" style="background:#000; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:13px;">+ 추가</button>
        </div>
        <div id="friend-list" class="friend-list"></div>
    </nav>

    <main id="main-app">
        <header>
            <button class="menu-btn" onclick="window.toggleMenu()">≡</button>
            <b id="target-title">대상을 선택하세요</b>
            <div style="width:30px;"></div>
        </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="border:none; background:none; font-weight:bold; color:#333; font-size:16px; padding:5px 10px;">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId;

    // 메뉴 토글
    window.toggleMenu = () => {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const isOpen = menu.classList.toggle('open');
        overlay.style.display = isOpen ? 'block' : 'none';
    };

    // 로그인 및 친구 목록 로드 시작
    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return alert("정보를 입력하세요.");

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadFriends(); // 서버에서 저장된 친구 목록 가져오기
        } else alert("비밀번호 불일치");
    };

    // 서버에 저장된 친구 목록 실시간 동기화
    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) {
                Object.keys(data).forEach(fid => {
                    const item = document.createElement('div');
                    item.className = 'friend-item';
                    item.innerHTML = `👤 <b>${fid}</b>`;
                    item.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = "<div style='text-align:center; padding:30px; color:#999; font-size:13px;'>등록된 친구가 없습니다.</div>";
            }
        });
    }

    // 친구 추가 (서버에 영구 저장)
    window.handleAddFriend = async () => {
        const fid = prompt("친구 아이디 입력:").toLowerCase().trim();
        if(!fid || fid === myId) return;
        
        const check = await get(ref(db, `auth/${fid}`));
        if(check.exists()) {
            // users/내아이디/f/상대아이디 경로에 저장 (새로고침해도 유지됨)
            await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
            window.openChat(fid);
            window.toggleMenu();
        } else alert("존재하지 않는 아이디입니다.");
    };

    // 채팅창 열기
    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const cls = m.s === myId ? 'me' : 'o';
                v.innerHTML += `<div class="msg ${cls}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    // 메시지 전송
    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        i.value = "";
    };
</script>
</body>
</html>
