<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0a0c; --card: rgba(255, 255, 255, 0.03); --yellow: #fee500; --text: #ffffff; --chat-bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

        /* [1] 공통 레이아웃 */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 75px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 30px; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { color: #444; cursor: pointer; font-size: 26px; }
        .nav-item.active { color: var(--yellow); }
        .content-panel { flex: 1; background: #fff; color: #000; border-radius: 30px 0 0 0; overflow: hidden; }

        /* [2] 카톡 스타일 프로필 팝업 */
        #profile-popup { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; background: #848b94; color: #fff; }
        #p-pop-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); z-index: 1; }
        .p-pop-content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 80px; }
        .p-pop-close { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; }
        #p-pop-img { width: 100px; height: 100px; border-radius: 35px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.3); }
        .p-pop-actions { display: flex; gap: 40px; border-top: 1px solid rgba(255,255,255,0.2); width: 100%; justify-content: center; padding-top: 30px; }
        .p-action-btn { text-align: center; cursor: pointer; font-size: 13px; }
        .p-action-btn i { display: block; font-size: 24px; margin-bottom: 8px; }

        /* [3] 통화 화면 UI */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; border: 2px solid #fff; object-fit: cover; }
        .call-btns { position: absolute; bottom: 50px; display: flex; gap: 30px; }
        .hangup-btn { width: 60px; height: 60px; background: #ff3b30; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; }
        
        /* 기존 스타일 생략 (로그인, 채팅 등 유지) */
    </style>
</head>
<body>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.switchTab('friend', this)">👤</div>
        <div class="nav-item" onclick="window.switchTab('set', this)">⚙️</div>
    </nav>
    <div class="content-panel">
        <div id="panel-friend" style="display:block;">
            <div style="padding:25px; font-size:20px; font-weight:800;">친구</div>
            <div id="friend-list"></div>
        </div>
        </div>
</div>

<div id="profile-popup">
    <img id="p-pop-bg" src="">
    <div class="p-pop-content">
        <span class="p-pop-close" onclick="window.closePop()">✕</span>
        <img id="p-pop-img" src="https://via.placeholder.com/100">
        <b id="p-pop-name" style="font-size:18px; margin-bottom:40px;">이름</b>
        <div class="p-pop-actions">
            <div class="p-action-btn" onclick="window.openChat(window.selFid)"><i>💬</i>채팅하기</div>
            <div class="p-action-btn" onclick="window.initCall(false)"><i>📞</i>음성통화</div>
            <div class="p-action-btn" onclick="window.initCall(true)"><i>🎥</i>영상통화</div>
        </div>
    </div>
</div>

<div id="call-ui">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div style="position:absolute; top:100px; text-align:center;">
        <h2 id="call-status-name">상대방 이름</h2>
        <p id="call-timer">통화 중...</p>
    </div>
    <div class="call-btns">
        <div class="hangup-btn" onclick="window.endCall()">✕</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 설정 생략...
    const db = getDatabase(app);
    let myId, selFid, peer, myStream, currentCall;

    // [1] PeerJS 초기화 (통화용)
    function initPeer() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm("전화가 왔습니다. 받으시겠습니까?")) {
                myStream = await navigator.mediaDevices.getUserMedia({audio: true, video: call.metadata.video});
                call.answer(myStream);
                handleCall(call, call.metadata.video);
            }
        });
    }

    // [2] 통화 시작 (영상/음성 선택)
    window.initCall = async (video) => {
        window.closePop();
        try {
            myStream = await navigator.mediaDevices.getUserMedia({audio: true, video: video});
            document.getElementById('local-video').srcObject = myStream;
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('call-status-name').innerText = window.selFid;

            const call = peer.call(window.selFid, myStream, {metadata: {video: video}});
            handleCall(call, video);
        } catch (e) { alert("카메라/마이크 권한이 필요합니다."); }
    };

    function handleCall(call, isVideo) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            document.getElementById('remote-video').srcObject = remoteStream;
            if(!isVideo) document.getElementById('remote-video').style.display = 'none';
        });
        call.on('close', window.endCall);
    }

    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-ui').style.display = 'none';
        location.reload(); // 스트림 완전 종료를 위해 리로드 권장
    };

    // [3] 프로필 팝업 열기 (카톡 스타일)
    window.openProfile = (fid) => {
        window.selFid = fid;
        get(ref(db, `users/${fid}`)).then(snap => {
            const d = snap.val();
            document.getElementById('p-pop-name').innerText = d.name;
            document.getElementById('p-pop-img').src = d.pic || "https://via.placeholder.com/100";
            document.getElementById('p-pop-bg').src = d.pic || "";
            document.getElementById('profile-popup').style.display = 'flex';
        });
    };

    window.closePop = () => document.getElementById('profile-popup').style.display = 'none';

    // 기존 로그인/친구목록 로직 통합 시 window.openProfile(fid) 호출로 연결
    // ... (생략된 기존 코드들) ...
</script>
</body>
</html>
