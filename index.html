<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK K-STYLE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --line: #eeeeee; --accent: #ff3b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [1] 로그인 & 자동로그인 */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .login-box input { padding: 15px; border: 1px solid #eee; border-radius: 12px; outline: none; }
        .login-box button { padding: 15px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; }

        /* [2] 메인 레이아웃 */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 25px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 22px; }
        .nav-text { font-size: 10px; font-weight: bold; }

        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; position: relative; }
        .content-panel.active { display: flex; }

        /* [3] ★ 카카오톡 스타일 프로필 디자인 ★ */
        .k-profile-container { position: absolute; inset: 0; background: #848b94; z-index: 50; display: flex; flex-direction: column; }
        .k-profile-bg { position: absolute; inset: 0; z-index: 1; }
        .k-profile-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
        
        .k-profile-header { position: relative; z-index: 52; padding: 20px; display: flex; justify-content: space-between; color: #fff; font-size: 20px; }
        
        .k-profile-content { position: relative; z-index: 52; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; color: #fff; }
        .k-p-img { width: 95px; height: 95px; border-radius: 35px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; background: #eee; }
        .k-p-name { font-size: 19px; font-weight: bold; margin-bottom: 30px; }
        
        .k-p-actions { width: 100%; border-top: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; padding-top: 25px; gap: 40px; }
        .k-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .k-action-icon { font-size: 24px; }
        .k-action-text { font-size: 12px; }

        /* [4] 통화 UI */
        #call-ui { position: fixed; inset: 0; background: #111; z-index: 4000; display: none; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v-box { position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 12px; overflow: hidden; border: 2px solid #fff; z-index: 4010; }
        #local-v { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .call-btns { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; gap: 25px; }
        .c-circle { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .c-circle.red { background: var(--accent); }

        /* 편집 모달 */
        #edit-modal { position: absolute; inset: 0; background: #fff; z-index: 200; display: none; padding: 40px 20px; flex-direction: column; gap: 20px; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-box">
        <h2 style="text-align:center; margin-bottom:10px;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.doLogin()">시작하기</button>
    </div>
</div>

<div id="call-ui">
    <video id="remote-v" autoplay playsinline></video>
    <div id="local-v-box"><video id="local-v" autoplay playsinline muted></video></div>
    <div class="call-btns">
        <div onclick="window.toggleMic()"><div id="mic-icon" class="c-circle">🎤</div></div>
        <div onclick="window.endCall()"><div class="c-circle red">✕</div></div>
        <div onclick="window.toggleCam()"><div id="cam-icon" class="c-circle">🎥</div></div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">
            <span class="nav-icon">👤</span><span class="nav-text">친구</span>
        </div>
        <div class="nav-item" onclick="window.showPanel('chat', this)">
            <span class="nav-icon">💬</span><span class="nav-text">채팅</span>
        </div>
        <div class="nav-item" onclick="window.showPanel('profile', this)">
            <span class="nav-icon">⚙️</span><span class="nav-text">내프로필</span>
        </div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구</div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-profile" class="content-panel">
        <div class="k-profile-container">
            <div class="k-profile-bg"><img id="view-bg" src="https://via.placeholder.com/800x1200/848b94/848b94"></div>
            <div class="k-profile-header">
                <span onclick="window.showPanel('friend', document.querySelector('.nav-item'))">✕</span>
                <span>⚙️</span>
            </div>
            <div class="k-profile-content">
                <img id="view-p" class="k-p-img" src="https://via.placeholder.com/150">
                <div id="view-name" class="k-p-name">사용자</div>
                <div class="k-p-actions">
                    <div class="k-action-btn">
                        <span class="k-action-icon">💬</span>
                        <span class="k-action-text">나와의 채팅</span>
                    </div>
                    <div class="k-action-btn" onclick="window.showEdit()">
                        <span class="k-action-icon">✏️</span>
                        <span class="k-action-text">프로필 편집</span>
                    </div>
                    <div class="k-action-btn" onclick="window.doLogout()">
                        <span class="k-action-icon">🚪</span>
                        <span class="k-action-text">로그아웃</span>
                    </div>
                </div>
            </div>
            
            <div id="edit-modal">
                <h3 style="margin-bottom:20px;">프로필 편집</h3>
                <label>닉네임</label>
                <input type="text" id="set-name" style="padding:12px; border:1px solid #eee; border-radius:10px;">
                <label>프로필 사진</label>
                <input type="file" onchange="window.pre(this, 'view-p')">
                <label>배경 사진</label>
                <input type="file" onchange="window.pre(this, 'view-bg')">
                <button onclick="window.saveP()" style="padding:15px; background:#fee500; color:#000; border:none; border-radius:12px; font-weight:bold; margin-top:20px;">완료</button>
                <button onclick="document.getElementById('edit-modal').style.display='none'" style="background:none; border:none; color:#999;">취소</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, peer, currentCall, myStream, isMic=true, isCam=true;

    // [자동 로그인]
    window.onload = () => {
        const sid = localStorage.getItem('st_id'), spw = localStorage.getItem('st_pw');
        if(sid && spw) {
            document.getElementById('myId').value = sid;
            document.getElementById('myPw').value = spw;
            window.doLogin();
        }
    };

    window.doLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase(), pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        myId = id; localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
        document.getElementById('login-ui').style.display='none';
        document.getElementById('main-app').style.display='flex';
        initApp();
    };

    function initApp() {
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm(call.peer + "님의 전화 수락?")) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
                call.answer(myStream);
                handleCall(call);
            }
        });
        loadData();
    }

    // [프로필 저장 및 로드]
    window.pre = (input, targetId) => {
        const reader = new FileReader();
        reader.onload = e => document.getElementById(targetId).src = e.target.result;
        reader.readAsDataURL(input.files[0]);
    };
    window.saveP = () => {
        const name = document.getElementById('set-name').value;
        const pImg = document.getElementById('view-p').src;
        const bgImg = document.getElementById('view-bg').src;
        update(ref(db, `users/${myId}`), { name, img: pImg, bg: bgImg });
        document.getElementById('edit-modal').style.display = 'none';
    };

    function loadData() {
        onValue(ref(db, `users/${myId}`), snap => {
            const v = snap.val(); if(!v) return;
            document.getElementById('view-name').innerText = v.name || myId;
            document.getElementById('view-p').src = v.img || "https://via.placeholder.com/150";
            document.getElementById('view-bg').src = v.bg || "https://via.placeholder.com/800x1200/848b94/848b94";
        });
    }

    // [기타 제어]
    window.showEdit = () => document.getElementById('edit-modal').style.display = 'flex';
    window.showPanel = (t, el) => {
        document.querySelectorAll('.content-panel').forEach(p=>p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); el.classList.add('active');
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
    window.endCall = () => { if(currentCall) currentCall.close(); document.getElementById('call-ui').style.display='none'; };
</script>
</body>
</html>
