<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR CHAT PRO</title>
    <style>
        :root { --main-bg: #9bbbd4; --my-msg: #fef01b; --other-msg: #ffffff; --header-bg: #343d46; }
        body { background: #f0f0f0; font-family: 'Apple SD Gothic Neo', sans-serif; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 450px; background: var(--main-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        
        /* 로그인 화면 */
        #login-sec { position: absolute; inset: 0; background: #fff; z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .login-input { padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .login-btn { padding: 15px; background: #343d46; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 헤더 */
        header { background: var(--header-bg); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
        .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,0.2); }

        /* 음성 컨트롤 영역 */
        .voice-controls { display: flex; align-items: center; gap: 8px; }
        .v-toggle { border: none; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .v-off { background: #6e767d; }
        .v-on { background: #f04747; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* 메시지 영역 */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 15px; font-size: 14px; position: relative; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.other { align-self: flex-start; background: var(--other-msg); color: #000; border-top-left-radius: 2px; }
        .msg.me { align-self: flex-end; background: var(--my-msg); color: #000; border-top-right-radius: 2px; }
        .del-btn { color: #ff5f5f; font-size: 10px; cursor: pointer; margin-left: 10px; border: none; background: none; padding: 0; }
        .time { font-size: 10px; color: #666; margin-top: 5px; display: block; }

        /* 입력창 */
        .input-area { background: #fff; padding: 10px; display: flex; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #msgInput { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 20px; outline: none; font-size: 15px; }
        .send-btn { background: #fef01b; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-sec">
        <h1 style="text-align:center; color:#343d46;">🔐 STAR CHAT</h1>
        <input type="number" id="roomNum" class="login-input" placeholder="방 번호 (1-100)">
        <input type="password" id="roomPw" class="login-input" placeholder="비밀번호">
        <button onclick="joinRoom()" class="login-btn">입장 / 방 만들기</button>
    </div>

    <header>
        <div>
            <b id="room-info">📡 대기 중</b>
            <span id="admin-tag" class="status-badge" style="display:none; color:#fef01b;">OWNER</span>
        </div>
        <div class="voice-controls">
            <button id="v-btn" class="v-toggle v-off" onclick="toggleVoice()">🎤 음성 끔</button>
            <button onclick="location.reload()" style="background:none; border:1px solid #ff5f5f; color:#ff5f5f; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:12px;">나가기</button>
        </div>
    </header>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." onkeypress="if(event.keyCode==13) sendMsg()">
        <button onclick="sendMsg()" class="send-btn">전송</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let room = "";
    let isAdmin = false;
    let myId = Math.random().toString(36).substring(7);

    // [1] 방 입장 로직
    window.joinRoom = async () => {
        room = document.getElementById('roomNum').value;
        const pw = document.getElementById('roomPw').value;
        if(!room || !pw) return alert("방 번호와 비밀번호를 입력하세요!");

        const roomRef = ref(db, `rooms/${room}`);
        const snap = await get(roomRef);

        if(snap.exists()) {
            if(snap.val().password !== pw) return alert("비밀번호가 틀립니다!");
            isAdmin = false;
        } else {
            isAdmin = true;
            await set(roomRef, { password: pw, owner: myId });
            // 방장 연결 종료 시 자동 삭제
            onDisconnect(roomRef).remove();
            onDisconnect(ref(db, `chats/${room}`)).remove();
            document.getElementById('admin-tag').style.display = 'inline-block';
        }

        document.getElementById('login-sec').style.display = 'none';
        document.getElementById('room-info').innerText = `${room}번 방`;
        listenMessages();
    };

    // [2] 채팅 읽기
    function listenMessages() {
        onValue(ref(db, `chats/${room}`), (snap) => {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            const data = snap.val();
            
            if(!data && !isAdmin) {
                alert("방장이 나갔거나 방이 폭파되었습니다.");
                location.reload();
            }

            if(data) {
                Object.keys(data).forEach(key => {
                    const m = data[key];
                    const isMe = m.senderId === myId;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'me' : 'other'}`;
                    
                    let delHtml = (isAdmin || isMe) ? `<button class="del-btn" onclick="deleteMsg('${key}')">삭제</button>` : "";
                    
                    div.innerHTML = `
                        <div>${m.text} ${delHtml}</div>
                        <span class="time">${m.time}</span>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }
        });
    }

    // [3] 채팅 삭제
    window.deleteMsg = (key) => {
        if(confirm("이 메시지를 삭제할까요?")) {
            remove(ref(db, `chats/${room}/${key}`));
        }
    };

    // [4] 채팅 전송
    window.sendMsg = () => {
        const input = document.getElementById('msgInput');
        if(!input.value) return;
        push(ref(db, `chats/${room}`), {
            text: input.value,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            senderId: myId
        });
        input.value = "";
    };

    // [5] 음성 채팅 켬/끔 토글
    let localStream = null;
    window.toggleVoice = async () => {
        const btn = document.getElementById('v-btn');
        
        if (!localStream) {
            // 음성 켜기
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                btn.innerText = "🔊 음성 켬";
                btn.classList.remove('v-off');
                btn.classList.add('v-on');
                // 실제 상용 앱처럼 음성이 전달되려면 WebRTC 피어 연결이 필요하지만, 
                // 이 코드는 마이크 활성화를 통해 대화 준비 상태를 만듭니다.
            } catch (err) {
                alert("마이크 권한이 거부되었습니다.");
            }
        } else {
            // 음성 끄기
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            btn.innerText = "🎤 음성 끔";
            btn.classList.remove('v-on');
            btn.classList.add('v-off');
        }
    };
</script>
</body>
</html>

        </div>
    </div>
