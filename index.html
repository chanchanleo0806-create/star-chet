<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK ANDROID FIX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --point: #fee500; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: #f4f4f7; height: 100vh; display: flex; flex-direction: column; }

        /* 로그인 */
        #login-ui { position: fixed; inset: 0; background: var(--point); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
        .login-box button { width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 10px; font-weight: bold; }

        /* 메인 레이아웃 */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 12px 15px; background: white; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #f4f4f7; }
        
        /* 메시지 스타일 */
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 75%; font-size: 15px; word-break: break-all; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--point); border-top-right-radius: 2px; }
        .o { align-self: flex-start; background: white; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* 안드로이드 키보드 대응 하단 입력창 */
        footer { padding: 10px; background: white; display: none; gap: 8px; border-top: 1px solid #eee; align-items: center; }
        #m-in { flex: 1; border: none; background: #f0f0f2; padding: 12px 15px; border-radius: 20px; font-size: 16px; outline: none; }
        #send-btn { background: var(--point); border: none; padding: 10px 15px; border-radius: 15px; font-weight: bold; cursor: pointer; min-width: 60px; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-box">
        <h3>STAR TALK</h3>
        <input type="text" id="myId" placeholder="아이디" inputmode="email">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.handleLogin()">시작하기</button>
    </div>
</div>

<main>
    <header>
        <b id="target-name">대상 없음</b>
        <button onclick="window.handleAddFriend()" style="font-size:12px;">+ 친구</button>
    </header>
    <div id="chat-view"></div>
    <footer id="chat-footer">
        <input type="text" id="m-in" placeholder="메시지..." autocomplete="off">
        <button id="send-btn" onclick="window.handleSend()">전송</button>
    </footer>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId, peer;

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw, nick: id});
            myId = id;
            startApp();
        } else alert("비번 틀림");
    };

    function startApp() {
        peer = new Peer(myId, { config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} });
        peer.on('open', () => {
            document.getElementById('login-ui').style.display = 'none';
            loadFriends();
        });
    }

    window.handleAddFriend = async () => {
        const fid = prompt("친구 아이디:").toLowerCase();
        if(fid && fid !== myId) set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            if(!snap.val()) return;
            // 친구를 누르면 채팅창 활성화 (테스트용으로 자동 첫번째 친구 연결 로직 생략)
            Object.keys(snap.val()).forEach(fid => {
                window.openChat(fid); // 예시: 목록 클릭 시 호출되도록 연동
            });
        });
    }

    // 전송 버튼과 엔터키 완벽 대응
    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value || !targetId) return;

        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        
        i.value = "";
        i.focus(); // 모바일에서 전송 후 키보드 유지
    };

    // 모바일 엔터키 전송 이벤트 리스너
    document.getElementById('m-in').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            window.handleSend();
        }
    });

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-name').innerText = fid;
        document.getElementById('chat-footer').style.display = 'flex';
        const rid = [myId, fid].sort().join("_");
        
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view');
            v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                const cls = m.s === myId ? 'me' : 'o';
                v.innerHTML += `<div class="msg ${cls}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };
</script>
</body>
</html>
