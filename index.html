<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - Secure Auto Login</title>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --line: #eeeeee; --gray: #f8f8f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }
        #main-app { display: none; height: 100%; width: 100%; }
        
        /* [사이드바 & 레이아웃] */
        nav { width: 65px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 30px; flex-shrink: 0; }
        .s-icon { color: #555; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .s-icon.active { color: #fff; }
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
        .content-panel.active { display: flex; }
        .panel-header { padding: 25px 20px; font-size: 22px; font-weight: bold; }

        /* [리스트 아이템] */
        .list-item { padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .list-item:hover { background: var(--gray); }
        .p-img { width: 50px; height: 50px; background: #eee; border-radius: 18px; }
        .hr { height: 1px; background: #f2f2f2; margin: 10px 20px; }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 320px; display: flex; flex-direction: column; gap: 12px; padding: 40px; }
        .login-card h1 { text-align: center; margin-bottom: 20px; font-weight: 900; }
        .l-in { padding: 15px; border: 1px solid #eee; border-radius: 12px; outline: none; font-size: 14px; }
        .l-btn { padding: 15px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* [채팅창 & 팝업] */
        #chat-window { position: fixed; inset: 0 0 0 65px; background: #fff; z-index: 100; display: none; flex-direction: column; }
        .overlay { position: fixed; inset: 0; background: rgba(17,17,17,0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .bubble { padding: 10px 15px; border-radius: 18px; font-size: 14px; max-width: 75%; margin-bottom: 5px; }
        .me { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .o { align-self: flex-start; background: #fff; color: #000; border: 1px solid #eee; border-bottom-left-radius: 4px; }
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; background: #f9f9f9; }
    </style>
</head>
<body>

<div id="login-ui">
    <div class="login-card">
        <h1>STAR TALK</h1>
        <input type="text" id="myId" class="l-in" placeholder="아이디">
        <input type="password" id="myPw" class="l-in" placeholder="비밀번호">
        <button onclick="window.doLogin()" class="l-btn">로그인 / 시작하기</button>
        <p style="font-size: 11px; color: #aaa; text-align: center; margin-top: 10px;">처음 접속 시 입력한 비번이 저장됩니다.</p>
    </div>
</div>

<div id="my-edit-popup" class="overlay">
    <input type="text" id="edit-name" placeholder="이름" style="background:none; border:none; border-bottom:1px solid #444; color:#fff; text-align:center; margin-bottom:20px; outline:none;">
    <button onclick="window.saveProfile()" style="padding:10px 30px; border-radius:20px; border:none;">저장</button>
</div>

<div id="main-app">
    <nav>
        <div class="s-icon active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="s-icon" onclick="window.showPanel('chat', this)">💬</div>
        <div class="s-icon" style="margin-top:auto;" onclick="window.doLogout()">🚪</div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div class="panel-header">친구</div>
        <div class="list-item" onclick="window.openMyEdit()">
            <div class="p-img"></div>
            <div style="margin-left:15px;"><b id="display-my-name">나</b></div>
        </div>
        <div class="hr"></div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-chat" class="content-panel">
        <div class="panel-header">채팅</div>
        <div id="chat-list"></div>
    </div>

    <div id="chat-window">
        <div style="height:60px; border-bottom:1px solid #eee; display:flex; align-items:center; padding:0 20px;">
            <span onclick="document.getElementById('chat-window').style.display='none'" style="cursor:pointer;">◀</span>
            <b id="chat-target-name" style="margin-left:20px;">대상</b>
        </div>
        <div id="chat-view"></div>
        <div style="padding:15px; border-top:1px solid #eee; display:flex; gap:10px;">
            <input type="text" id="m-in" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; outline:none;" onkeypress="if(event.keyCode==13) window.sendMsg()">
            <button onclick="window.sendMsg()" style="padding:0 20px; background:#000; color:#fff; border:none; border-radius:20px;">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid;

    // [체크] 페이지 열 때 로컬 정보 확인
    window.addEventListener('load', () => {
        const sid = localStorage.getItem('st_id');
        const spw = localStorage.getItem('st_pw');
        if(sid && spw) {
            checkLogin(sid, spw, true);
        }
    });

    window.doLogin = () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return alert("ID와 비번을 모두 입력하세요.");
        checkLogin(id, pw, false);
    };

    async function checkLogin(id, pw, isAuto) {
        const snap = await get(ref(db, `auth/${id}`));
        
        if(!snap.exists()) {
            // 신규 가입
            await set(ref(db, `auth/${id}`), { pw: pw });
            loginSuccess(id, pw);
        } else {
            // 기존 유저 확인
            if(snap.val().pw === pw) {
                loginSuccess(id, pw);
            } else {
                if(isAuto) {
                    localStorage.clear();
                    location.reload();
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            }
        }
    }

    function loginSuccess(id, pw) {
        myId = id;
        localStorage.setItem('st_id', id);
        localStorage.setItem('st_pw', pw);
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        initApp();
    }

    window.doLogout = () => {
        localStorage.clear();
        location.reload();
    };

    // 나머지 앱 로직 (이전과 동일)
    function initApp() {
        onValue(ref(db, `users/${myId}`), snap => {
            const data = snap.val() || { name: myId };
            document.getElementById('display-my-name').innerText = data.name;
            document.getElementById('edit-name').value = data.name;
        });
        loadData();
    }

    function loadData() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([fid, info]) => {
                const d = document.createElement('div');
                d.className = "list-item";
                d.innerHTML = `<div class="p-img" style="width:40px; height:40px;"></div><b style="margin-left:15px;">${info.name}</b>`;
                d.onclick = () => window.openChat(myId < fid ? `${myId}_${fid}` : `${fid}_${myId}`, info.name);
                list.appendChild(d);
            });
        });
        // 임시 친구 추가
        get(ref(db, `friends/${myId}`)).then(s => { if(!s.exists()) set(ref(db, `friends/${myId}/friend1`), {name: "친구1"}); });
    }

    window.openChat = (rid, name) => {
        activeRid = rid;
        document.getElementById('chat-target-name').innerText = name;
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([mid, m]) => {
                const d = document.createElement('div');
                d.className = `bubble ${m.s === myId ? 'me' : 'o'}`;
                d.innerText = m.t;
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.sendMsg = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), { t: i.value, s: myId });
        i.value = "";
    };
    
    window.showPanel = (type, el) => {
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${type}`).classList.add('active');
    };
    window.openMyEdit = () => document.getElementById('my-edit-popup').style.display='flex';
    window.saveProfile = () => {
        update(ref(db, `users/${myId}`), { name: document.getElementById('edit-name').value });
        document.getElementById('my-edit-popup').style.display='none';
    };
</script>
</body>
</html>
