<div style="padding: 10px 20px; display: flex; flex-direction: column; gap: 5px;">
    <div style="display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 13px;">
        <span>채팅 목록</span>
        <div style="display: flex; gap: 10px;">
            <span onclick="addFriend()" style="cursor:pointer; color:var(--point);">+ 친구</span>
            <span onclick="createGroupChat()" style="cursor:pointer; color:var(--point);">+ 단톡방</span>
        </div>
    </div>
</div>
<div class="f-list" id="chat-list"></div>

<script type="module">
    // ... (기존 설정값 firebaseConfig 동일) ...

    let isGroup = false; // 현재 방이 단톡방인지 확인

    // [추가] 단톡방 만들기 기능
    window.createGroupChat = async () => {
        const input = prompt("함께 대화할 친구들의 ID를 입력하세요 (예: id1, id2, id3)");
        if(!input) return;

        const members = input.split(',').map(s => s.trim()).filter(s => s !== "");
        members.push(myId); // 나도 포함

        if(members.length < 3) {
            alert("단톡방은 나를 포함해 3명 이상이어야 합니다.");
            return;
        }

        // 단톡방 아이디 생성 (멤버 이름을 정렬해서 조합)
        const groupId = "GROUP_" + members.sort().join("_");
        const groupName = prompt("단톡방 이름을 정해 주세요:", members.join(", ") + "의 단톡방");

        // 각 멤버의 목록에 단톡방 정보 저장
        for(let member of members) {
            await set(ref(db, `users/${member}/groups/${groupId}`), {
                id: groupId,
                name: groupName,
                members: members
            });
        }
        alert("단톡방이 생성되었습니다!");
    };

    // [수정] 목록 불러오기 (개인 친구 + 단톡방 통합)
    function loadList() {
        // 친구 목록과 단톡방 목록을 한 번에 감시
        onValue(ref(db, `users/${myId}`), async (snap) => {
            const list = document.getElementById('chat-list');
            list.innerHTML = "";
            const data = snap.val();

            // 1. 개인 친구 출력
            if(data?.f) {
                for(let fid of Object.keys(data.f)) {
                    const fInfo = await get(ref(db, `auth/${fid}`));
                    const d = document.createElement('div');
                    d.className = 'f-item';
                    d.innerHTML = `<img src="${fInfo.val()?.pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"> 
                                   <div><b>${fid}</b><br><small style="color:gray;">1:1 메시지</small></div>`;
                    d.onclick = () => openChat(fid, false);
                    list.appendChild(d);
                }
            }

            // 2. 단톡방 출력
            if(data?.groups) {
                Object.values(data.groups).forEach(g => {
                    const d = document.createElement('div');
                    d.className = 'f-item';
                    d.innerHTML = `<div style="width:45px;height:45px;background:#555;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;">👥</div>
                                   <div><b>${g.name}</b><br><small style="color:#fee500;">그룹 참여 중</small></div>`;
                    d.onclick = () => openChat(g.id, true, g.name);
                    list.appendChild(d);
                });
            }
        });
    }

    // [수정] 채팅방 열기 (단톡방 대응)
    function openChat(id, groupMode, groupName = "") {
        targetId = id;
        isGroup = groupMode;
        document.getElementById('target-name').innerText = groupMode ? groupName : id;
        document.getElementById('chat-footer').style.visibility = 'visible';
        
        // 방 ID 결정: 단톡방은 그대로, 개인톡은 정렬 조합
        const rid = groupMode ? id : [myId, id].sort().join("_");

        onValue(ref(db, `msgs/${rid}`), s => {
            const b = document.getElementById('chat-view');
            b.innerHTML = "";
            if(s.val()) {
                Object.values(s.val()).forEach(m => {
                    const d = document.createElement('div');
                    d.className = `msg ${m.s === myId ? 'me' : 'o'}`;
                    // 단톡방에서는 보낸 사람 이름 표시
                    const senderTag = (groupMode && m.s !== myId) ? `<small style="display:block;margin-bottom:4px;color:#888;">${m.s}</small>` : "";
                    
                    if (m.t.includes('http')) {
                        d.innerHTML = `${senderTag}<img src="${m.t}" style="max-width:200px;border-radius:10px;">`;
                    } else {
                        d.innerHTML = `${senderTag}${m.t}`;
                    }
                    b.appendChild(d);
                });
                b.scrollTop = b.scrollHeight;
            }
        });
    }

    // [수정] 메시지 전송 (단톡방 대응)
    window.send = () => {
        const i = document.getElementById('m-in'); 
        if(!i.value) return;
        const rid = isGroup ? targetId : [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId, time: Date.now()}); 
        i.value = "";
    };
</script>
