<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR MULTI TALK</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #FEE500; --bg: #bacee0; --dark: #3C1E1E; --white: #ffffff; }
        body { margin: 0; font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; height: 100vh; }
        #app { width: 100%; max-width: 480px; background: var(--bg); display: flex; flex-direction: column; position: relative; border: 1px solid #ddd; }
        
        /* 로그인 화면 */
        .overlay { position: absolute; inset: 0; background: var(--main); z-index: 1000; display: flex; flex-direction: column; padding: 40px; align-items: center; justify-content: center; }
        .logo { font-size: 50px; font-weight: bold; color: var(--dark); margin-bottom: 40px; }
        .in { width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--dark); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 상단 네비게이션 */
        header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tab-menu { background: #fff; display: flex; border-bottom: 1px solid #ddd; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; color: #666; }
        .tab.active { color: var(--dark); border-bottom: 3px solid var(--dark); }

        /* 목록 영역 */
        #list-view { flex: 1; overflow-y: auto; display: block; background: #fff; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .list-item:hover { background: #f9f9f9; }
        .icon { width: 40px; height: 40px; border-radius: 15px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* 채팅창 영역 */
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 10px; }
        .m-wrap { display: flex; flex-direction: column; max-width: 80%; }
        .m-name { font-size: 11px; color: #555; margin-bottom: 2px; }
        .m-box { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me { align-self: flex-end; align-items: flex-end; } .me .m-box { background: var(--main); border-top-right-radius: 0; }
        .o { align-self: flex-start; } .o .m-box { background: var(--white); border-top-left-radius: 0; }

        /* 하단바 */
        .bottom-bar { background: #fff; padding: 10px; display: none; gap: 8px; align-items: center; }
        #msg-input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 20px; outline: none; }

        /* 영상통화 */
        #video-ui { position: absolute; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        video { flex: 1; width: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-layer" class="overlay">
        <div class="logo">STAR</div>
        <input type="text" id="myId" class="in" placeholder="사용할 아이디 (고유 코드)">
        <button onclick="doLogin()" class="btn">시작하기</button>
    </div>

    <header>
        <span id="title-text">STAR TALK</span>
        <div id="action-btns">
            <button onclick="addItem('friend')" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">👤+</button>
            <button onclick="addItem('group')" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">👨‍👩‍👧‍👦+</button>
        </div>
    </header>

    <div class="tab-menu">
        <div class="tab active" onclick="showView('list')">친구/채팅목록</div>
        <div class="tab" id="chat-tab-name" onclick="showView('chat')">대화창</div>
    </div>

    <div id="list-view"></div>

    <div id="chat-view"></div>

    <div class="bottom-bar" id="input-area">
        <button onclick="openVideo()" style="border:none; background:none; font-size:20px; cursor:pointer;">📹</button>
        <input type="text" id="msg-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()" style="background:var(--main); border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">전송</button>
    </div>

    <div id="video-ui">
        <video id="rv" autoplay playsinline></video>
        <video id="lv" autoplay muted playsinline style="height:30%; border-top:2px solid #fff;"></video>
        <button onclick="closeVideo()" style="padding:20px; background:#ff4747; color:#fff; border:none; font-weight:bold;">종료</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const conf = { /* 본인의 Firebase 정보를 여기에 넣으세요 */ };
    const app = initializeApp(conf);
    const db = getDatabase(app);
    let myId = "", peer = null, currentRoom = "", currentCall = null;

    // [로그인]
    window.doLogin = () => {
        myId = document.getElementById('myId').value.trim();
        if(!myId) return alert("아이디를 입력하세요!");
        
        peer = new Peer(myId);
        peer.on('open', (id) => {
            document.getElementById('login-layer').style.display = 'none';
            document.getElementById('title-text').innerText = "ID: " + id;
            refreshList();
            listenForCalls();
        });
    };

    // [친구/방 추가]
    window.addItem = (type) => {
        const val = prompt(type === 'friend' ? "친구 아이디를 입력하세요:" : "입장할 단톡방 이름을 입력하세요:");
        if(!val) return;
        const path = type === 'friend' ? `users/${myId}/friends/${val}` : `users/${myId}/groups/${val}`;
        set(ref(db, path), { id: val, type: type });
    };

    // [목록 갱신]
    function refreshList() {
        onValue(ref(db, `users/${myId}`), (snap) => {
            const listDiv = document.getElementById('list-view');
            listDiv.innerHTML = "";
            const data = snap.val();
            if(!data) return listDiv.innerHTML = "<p style='text-align:center; padding:20px; color:gray;'>친구를 추가해보세요!</p>";

            if(data.friends) Object.keys(data.friends).forEach(id => renderItem(id, 'friend'));
            if(data.groups) Object.keys(data.groups).forEach(id => renderItem(id, 'group'));
        });
    }

    function renderItem(id, type) {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `<div class="icon">${type === 'friend' ? '👤' : '👨‍👩‍👧‍👦'}</div><div><b>${id}</b><br><small>${type === 'friend' ? '1:1 대화' : '그룹 채팅'}</small></div>`;
        item.onclick = () => startChat(id, type);
        document.getElementById('list-view').appendChild(item);
    }

    // [채팅 시작]
    function startChat(id, type) {
        currentRoom = type === 'friend' ? [myId, id].sort().join("_") : "group_" + id;
        document.getElementById('chat-tab-name').innerText = id;
        showView('chat');

        onValue(ref(db, `chat_rooms/${currentRoom}`), (snap) => {
            const chatDiv = document.getElementById('chat-view');
            chatDiv.innerHTML = "";
            if(snap.val()) {
                Object.values(snap.val()).forEach(m => {
                    const isMe = m.sid === myId;
                    const w = document.createElement('div');
                    w.className = `m-wrap ${isMe ? 'me' : 'o'}`;
                    w.innerHTML = `<span class="m-name">${m.name}</span><div class="m-box">${m.t}</div>`;
                    chatDiv.appendChild(w);
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        });
    }

    // [화면 전환]
    window.showView = (v) => {
        document.getElementById('list-view').style.display = v === 'list' ? 'block' : 'none';
        document.getElementById('chat-view').style.display = v === 'chat' ? 'flex' : 'none';
        document.getElementById('input-area').style.display = v === 'chat' ? 'flex' : 'none';
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (v==='list' && i===0) || (v==='chat' && i===1)));
    };

    // [메시지 전송]
    window.send = () => {
        const i = document.getElementById('msg-input'); if(!i.value || !currentRoom) return;
        push(ref(db, `chat_rooms/${currentRoom}`), { t: i.value, sid: myId, name: myId });
        i.value = "";
    };

    // [영상통화]
    window.openVideo = async () => {
        const target = prompt("통화할 아이디를 입력:");
        if(!target) return;
        const s = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('video-ui').style.display = 'flex';
        document.getElementById('lv').srcObject = s;
        currentCall = peer.call(target, s);
        currentCall.on('stream', rs => document.getElementById('rv').srcObject = rs);
    };

    function listenForCalls() {
        peer.on('call', async call => {
            if(confirm(call.peer + "님의 영상통화 요청! 받으시겠습니까?")) {
                const s = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('video-ui').style.display = 'flex';
                document.getElementById('lv').srcObject = s;
                call.answer(s);
                currentCall = call;
                call.on('stream', rs => document.getElementById('rv').srcObject = rs);
            }
        });
    }

    window.closeVideo = () => { if(currentCall) currentCall.close(); location.reload(); };
</script>
</body>
</html>
