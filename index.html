<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK - PERMANENT</title>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --white: #ffffff; --red: #ff3b30; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-input { width: 100%; max-width: 300px; height: 50px; margin-bottom: 10px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }

        /* [메인 레이아웃] */
        #main-app { display: none; flex-direction: column; height: 100%; background: var(--bg); }
        header { height: 60px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        /* [말풍선 & 읽음 숫자] */
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .msg-wrap.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrap.o { align-self: flex-start; align-items: flex-start; }
        .sender { font-size: 11px; color: #555; margin: 0 0 3px 5px; }
        
        .bubble-row { display: flex; align-items: flex-end; gap: 5px; }
        .me .bubble-row { flex-direction: row-reverse; }
        
        .bubble { padding: 10px 14px; border-radius: 15px; font-size: 15px; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me .bubble { background: var(--main); border-top-right-radius: 2px; }
        .o .bubble { background: var(--white); border-top-left-radius: 2px; }

        .unread-cnt { color: var(--main); font-size: 11px; font-weight: bold; cursor: pointer; user-select: none; margin-bottom: 2px; }

        /* [하단 입력창] */
        footer { height: 70px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
        #m-in { flex: 1; height: 45px; background: #f0f0f0; border-radius: 22px; padding: 0 15px; border: none; font-size: 16px; outline: none; }
        
        /* [사이드바] */
        #side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 4000; transition: 0.3s; overflow-y: auto; }
        #side-menu.open { left: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3500; display: none; }
        .room-item { padding: 15px; border-bottom: 1px solid #eee; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-ui">
        <h2 style="margin-bottom:20px;">STAR TALK</h2>
        <input type="text" id="myId" class="login-input" placeholder="아이디">
        <input type="password" id="myPw" class="login-input" placeholder="비밀번호">
        <button onclick="window.handleLogin()" style="width:100%; max-width:300px; height:50px; background:#000; color:#fff; border:none; border-radius:10px; font-weight:bold;">시작하기</button>
        <p id="auto-status" style="font-size:12px; color:#999; margin-top:15px;">아이디와 비번을 입력하세요.</p>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>
    <nav id="side-menu">
        <div style="padding:20px; background:#f9f9f9; display:flex; justify-content:space-between; align-items:center;">
            <b>채팅 목록</b>
            <button onclick="window.createGroup()" style="font-size:12px;">+ 단톡방</button>
        </div>
        <div id="chat-list"></div>
        <button onclick="window.handleLogout()" style="width:100%; padding:20px; border:none; color:var(--red); background:none; font-weight:bold;">로그아웃</button>
    </nav>

    <main id="main-app">
        <header>
            <button onclick="window.toggleMenu()" style="background:none; border:none; font-size:24px;">≡</button>
            <b id="chat-title">방을 선택하세요</b>
            <div style="width:24px;"></div>
        </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="width:60px; height:45px; background:var(--main); border:none; border-radius:10px; font-weight:bold;">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, currentChatId, currentMembers = [];

    // [1] 로그인 & 자동로그인
    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            localStorage.setItem('st_id', id); localStorage.setItem('st_pw', pw);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadChatRooms();
        } else { alert("비밀번호 오류"); localStorage.clear(); }
    };

    window.addEventListener('load', () => {
        const sid = localStorage.getItem('st_id'), spw = localStorage.getItem('st_pw');
        if(sid && spw) {
            document.getElementById('myId').value = sid; document.getElementById('myPw').value = spw;
            window.handleLogin();
        }
    });

    // [2] 단톡방 생성
    window.createGroup = async () => {
        const input = prompt("초대할 아이디들을 쉼표(,)로 구분해 입력하세요.");
        if(!input) return;
        let members = input.split(',').map(s => s.trim().toLowerCase());
        members.push(myId);
        members = [...new Set(members)];

        const roomId = "room_" + Date.now();
        const roomName = (members.length > 2) ? `${members[0]} 외 ${members.length-1}명` : members.join(', ');

        for(const m of members) {
            await set(ref(db, `userRooms/${m}/${roomId}`), { name: roomName, members: members });
        }
        window.toggleMenu();
    };

    // [3] 채팅 목록
    function loadChatRooms() {
        onValue(ref(db, `userRooms/${myId}`), snap => {
            const list = document.getElementById('chat-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([rid, info]) => {
                const div = document.createElement('div');
                div.className = "room-item";
                div.innerHTML = `💬 ${info.name}`;
                div.onclick = () => { window.enterChat(rid, info); window.toggleMenu(); };
                list.appendChild(div);
            });
        });
    }

    // [4] 채팅방 입장 및 읽음 확인 (자동삭제 제거됨)
    window.enterChat = (rid, info) => {
        currentChatId = rid;
        currentMembers = info.members;
        document.getElementById('chat-title').innerText = info.name;
        
        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            const msgs = snap.val();
            if(!msgs) return;

            Object.entries(msgs).forEach(([mid, m]) => {
                // 읽음 처리 업데이트
                if (!m.readers || !m.readers[myId]) {
                    update(ref(db, `msgs/${rid}/${mid}/readers`), { [myId]: true });
                }

                const readers = m.readers ? Object.keys(m.readers) : [];
                const unreadList = currentMembers.filter(id => !readers.includes(id));
                const unreadCount = unreadList.length;
                const isMe = m.s === myId;

                const wrap = document.createElement('div');
                wrap.className = `msg-wrap ${isMe ? 'me' : 'o'}`;
                wrap.innerHTML = `
                    ${!isMe ? `<span class="sender">${m.s}</span>` : ''}
                    <div class="bubble-row">
                        <div class="bubble">${m.t}</div>
                        ${unreadCount > 0 ? `<span class="unread-cnt" onclick="alert('안 읽은 사람: ${unreadList.join(', ')}')">${unreadCount}</span>` : ''}
                    </div>
                `;
                v.appendChild(wrap);
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    // [5] 메시지 전송
    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !currentChatId) return;
        push(ref(db, `msgs/${currentChatId}`), {
            t: i.value, s: myId, readers: { [myId]: true }
        });
        i.value = "";
    };

    window.toggleMenu = () => {
        document.getElementById('side-menu').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('side-menu').classList.contains('open') ? 'block' : 'none';
    };
    window.handleLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
