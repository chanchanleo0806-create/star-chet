<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK FINAL</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --yellow: #fee500; --accent: #ff3b30; --chat-bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }

        /* [1] 로그인 & 회원가입 스타일 (다크 & 글래스모피즘) */
        #auth-ui { position: fixed; inset: 0; background: radial-gradient(circle at top right, #2c3e50, #000); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .auth-header h2 { color: #fff; font-size: 26px; letter-spacing: 2px; margin: 10px 0; }
        .auth-header p { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 30px; }
        .input-group input { width: 100%; padding: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: #fff; margin-bottom: 12px; outline: none; }
        .btn-login { width: 100%; padding: 16px; background: var(--yellow); border: none; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-footer { margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.4); }
        .auth-footer span { color: #fff; cursor: pointer; text-decoration: underline; margin-left: 5px; }

        /* [2] 메인 레이아웃 */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 25px; z-index: 500; }
        .nav-item { color: #666; cursor: pointer; font-size: 24px; }
        .nav-item.active { color: #fff; }

        /* [3] 채팅 및 프로필 */
        #chat-window { position: fixed; inset: 0 0 0 70px; background: var(--chat-bg); z-index: 800; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 10px; border-radius: 12px; font-size: 14px; }
        .me { align-self: flex-end; background: var(--yellow); }
        .you { align-self: flex-start; background: #fff; }
        
        /* [4] 통화 UI */
        #calling-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .pulse { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--yellow); animation: pulse-ani 1.5s infinite; margin-bottom: 20px; }
        @keyframes pulse-ani { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(254, 229, 0, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(254, 229, 0, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(254, 229, 0, 0); } }
    </style>
</head>
<body>

<div id="auth-ui">
    <div class="auth-card">
        <div class="auth-header">
            <h2 id="auth-main-title">STAR TALK</h2>
            <p id="auth-sub-title">특별한 연결의 시작</p>
        </div>
        <div class="input-group">
            <input type="text" id="authId" placeholder="아이디">
            <input type="password" id="authPw" placeholder="비밀번호">
            <input type="text" id="authName" placeholder="이름 (회원가입 시)" style="display:none;">
        </div>
        <button class="btn-login" id="auth-btn" onclick="window.handleAuth('login')">로그인</button>
        <div class="auth-footer" id="auth-toggle-msg">
            계정이 없으신가요? <span onclick="window.toggleAuthMode('signup')">회원가입</span>
        </div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">👤</div>
        <div class="nav-item" onclick="window.showPanel('set', this)">⚙️</div>
    </nav>
    <div style="flex:1; position:relative;">
        <div id="panel-friend" class="content-panel active" style="display:flex; flex-direction:column;">
            <div style="padding:20px; font-weight:bold; border-bottom:1px solid #eee;">친구 <span onclick="window.addFriend()" style="float:right; cursor:pointer;">+</span></div>
            <div id="friend-list" style="flex:1; overflow-y:auto;"></div>
        </div>
        <div id="panel-set" class="content-panel" style="display:none; padding:40px; text-align:center;">
            <img id="my-pic" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:40px; object-fit:cover; border:1px solid #eee;">
            <h3 id="my-name-ui" style="margin:15px 0;">이름</h3>
            <button onclick="window.editMyProfile()" style="padding:8px 15px; border-radius:10px; border:1px solid #ddd; background:#fff;">프로필 편집</button>
            <br><br>
            <button onclick="window.doLogout()" style="color:red; background:none; border:none; cursor:pointer;">로그아웃</button>
        </div>
    </div>
</div>

<div id="chat-window">
    <div style="padding:15px; background:var(--chat-bg); display:flex; align-items:center;">
        <span onclick="window.closeChat()" style="cursor:pointer; font-size:20px; margin-right:15px;">◀</span>
        <b id="chat-target-name">상대방</b>
    </div>
    <div id="chat-view"></div>
    <div style="padding:10px; background:#fff; display:flex; gap:8px;">
        <button onclick="document.getElementById('file-up').click()" style="background:none; border:none; font-size:20px;">📎</button>
        <input type="file" id="file-up" hidden onchange="window.handleFileUpload(this)">
        <input type="text" id="msg-input" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; outline:none;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:10px; font-weight:bold;">전송</button>
    </div>
</div>

<div id="profile-popup" style="position:fixed; inset:0; z-index:2000; display:none; flex-direction:column;">
    <div style="position:absolute; inset:0; background:#848b94;"><img src="https://via.placeholder.com/800x1200/848b94/848b94" style="width:100%; height:100%; object-fit:cover; filter:brightness(0.6);"></div>
    <div style="position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:60px; color:#fff;">
        <span onclick="window.closePop()" style="position:absolute; top:20px; left:20px; font-size:24px; cursor:pointer;">✕</span>
        <img id="p-pop-img" src="https://via.placeholder.com/150" style="width:100px; height:100px; border-radius:35px; margin-bottom:15px; object-fit:cover;">
        <b id="p-pop-name" style="font-size:20px; margin-bottom:40px;">이름</b>
        <div style="display:flex; gap:40px; border-top:0.5px solid rgba(255,255,255,0.3); width:100%; justify-content:center; padding-top:30px;">
            <div onclick="window.openChat(window.selFid)" style="cursor:pointer; text-align:center;">💬<br><small>1:1 채팅</small></div>
            <div onclick="window.initCall(false)" style="cursor:pointer; text-align:center;">📞<br><small>음성 통화</small></div>
            <div onclick="window.initCall(true)" style="cursor:pointer; text-align:center;">🎥<br><small>영상 통화</small></div>
        </div>
    </div>
</div>

<div id="calling-overlay">
    <div class="pulse"></div>
    <b id="calling-name">이름</b>
    <p style="margin-top:10px; opacity:0.7;">전화 연결 중...</p>
    <div onclick="window.endCall()" style="margin-top:50px; width:60px; height:60px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">✕</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, myName, activeRid, selFid, peer, myStream, currentCall;

    // [1] 자동 로그인
    window.onload = () => { if(localStorage.getItem('st_id')) { myId = localStorage.getItem('st_id'); startApp(); } };

    // [2] 인증 모드 전환
    window.toggleAuthMode = (mode) => {
        const isLogin = mode === 'login';
        document.getElementById('auth-main-title').innerText = isLogin ? "STAR TALK" : "회원가입";
        document.getElementById('auth-name').style.display = isLogin ? "none" : "block";
        document.getElementById('auth-btn').innerText = isLogin ? "로그인" : "가입하기";
        document.getElementById('auth-btn').onclick = () => window.handleAuth(mode);
        document.getElementById('auth-toggle-msg').innerHTML = isLogin ? 
            `계정이 없으신가요? <span onclick="window.toggleAuthMode('signup')">회원가입</span>` : 
            `이미 계정이 있나요? <span onclick="window.toggleAuthMode('login')">로그인</span>`;
    };

    // [3] 로그인 & 회원가입 (중복 아이디 방지 포함)
    window.handleAuth = async (type) => {
        const id = document.getElementById('authId').value.trim().toLowerCase();
        const pw = document.getElementById('authPw').value.trim();
        const name = document.getElementById('authName').value.trim();

        if(!id || !pw) return alert("필수 정보를 입력하세요.");
        const userRef = ref(db, `users/${id}`);
        const snap = await get(userRef);

        if(type === 'signup') {
            if(snap.exists()) return alert("이미 존재하는 아이디입니다. 다른 아이디를 사용해주세요.");
            if(!name) return alert("이름을 입력해주세요.");
            await set(userRef, {id, pw, name, pic: ""});
            alert("가입이 완료되었습니다! 로그인해주세요.");
            window.toggleAuthMode('login');
        } else {
            if(snap.exists() && snap.val().pw === pw) {
                myId = id; localStorage.setItem('st_id', id); startApp();
            } else alert("아이디 또는 비밀번호가 틀렸습니다.");
        }
    };

    function startApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        onValue(ref(db, `users/${myId}`), snap => {
            const d = snap.val(); myName = d.name;
            document.getElementById('my-name-ui').innerText = d.name;
            if(d.pic) document.getElementById('my-pic').src = d.pic;
        });
        peer = new Peer(myId);
        peer.on('call', async (call) => {
            if(confirm("전화가 왔습니다. 받으시겠습니까?")) {
                myStream = await navigator.mediaDevices.getUserMedia({audio:true, video:call.metadata.video});
                call.answer(myStream); handleCallUI(call, call.metadata.video);
            }
        });
        loadFriends();
    }

    // [4] 친구 & 프로필 편집
    window.loadFriends = () => {
        onValue(ref(db, `friends/${myId}`), snap => {
            const l = document.getElementById('friend-list'); l.innerHTML = "";
            if(snap.exists()) Object.keys(snap.val()).forEach(fid => {
                const d = document.createElement('div'); d.className="list-item";
                d.style="padding:15px; border-bottom:1px solid #f5f5f5; display:flex; align-items:center; gap:12px; cursor:pointer;";
                d.innerHTML = `<img src="https://via.placeholder.com/50" style="width:45px; height:45px; border-radius:18px;"> <b>${fid}</b>`;
                d.onclick = () => { window.selFid = fid; document.getElementById('p-pop-name').innerText = fid; document.getElementById('profile-popup').style.display='flex'; };
                l.appendChild(d);
            });
        });
    };
    window.addFriend = () => {
        const fid = prompt("친구 ID:").trim().toLowerCase();
        if(fid && fid !== myId) update(ref(db), {[`friends/${myId}/${fid}`]:{id:fid}, [`friends/${fid}/${myId}`]:{id:myId}});
    };
    window.editMyProfile = () => {
        const n = prompt("변경할 이름:", myName);
        if(n) update(ref(db, `users/${myId}`), {name: n});
    };

    // [5] 채팅 & 파일 업로드
    window.openChat = (fid) => {
        window.closePop(); window.selFid = fid;
        activeRid = [myId, fid].sort().join('_');
        document.getElementById('chat-target-name').innerText = fid;
        document.getElementById('chat-window').style.display = 'flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.exists()) Object.values(snap.val()).forEach(m => {
                const d = document.createElement('div'); d.className = `bubble ${m.s === myId ? 'me' : 'you'}`;
                d.innerHTML = m.type === 'file' ? `📄 <a href="${m.data}" download="${m.name}" style="color:blue;">${m.name}</a>` : m.t;
                v.appendChild(d);
            });
            v.scrollTop = v.scrollHeight;
        });
    };
    window.sendMsg = () => {
        const i = document.getElementById('msg-input'); if(!i.value.trim()) return;
        push(ref(db, `msgs/${activeRid}`), {s: myId, t: i.value.trim(), type:'text'}); i.value = "";
    };
    window.handleFileUpload = (el) => {
        const file = el.files[0]; if(!file) return;
        const r = new FileReader(); r.onload = () => {
            push(ref(db, `msgs/${activeRid}`), {s:myId, type:'file', name:file.name, data:r.result});
        }; r.readAsDataURL(file);
    };

    // [6] 통화
    window.initCall = async (isVideo) => {
        window.closePop();
        document.getElementById('calling-name').innerText = window.selFid;
        document.getElementById('calling-overlay').style.display = 'flex';
        myStream = await navigator.mediaDevices.getUserMedia({audio:true, video:isVideo});
        const call = peer.call(window.selFid, myStream, {metadata:{video:isVideo}});
        handleCallUI(call, isVideo);
    };
    function handleCallUI(call, isVideo) {
        currentCall = call;
        call.on('stream', rs => {
            document.getElementById('calling-overlay').style.display = 'none';
            alert("통화 연결됨 (실제 통화 화면은 UI 구성에 따라 확장 가능)");
        });
    }
    window.endCall = () => {
        if(currentCall) currentCall.close();
        if(myStream) myStream.getTracks().forEach(t=>t.stop());
        document.getElementById('calling-overlay').style.display = 'none';
    };

    window.closePop = () => document.getElementById('profile-popup').style.display = 'none';
    window.closeChat = () => document.getElementById('chat-window').style.display = 'none';
    window.showPanel = (p, el) => {
        document.querySelectorAll('.content-panel').forEach(v=>v.style.display='none');
        document.getElementById(`panel-${p}`).style.display='block';
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
