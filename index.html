<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - Multi Auth</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --sidebar: #2c2c2e; --chat-bg: #f4f4f7; --point: #fee500; }
        body { margin: 0; font-family: sans-serif; background: #eee; display: flex; flex-direction: column; height: 100vh; }
        
        /* [추가] 계정 전환 바 */
        .auth-bar { background: #1a1a1a; padding: 5px 15px; display: flex; gap: 10px; align-items: center; color: white; font-size: 11px; }
        .acc-btn { padding: 4px 10px; border-radius: 12px; border: 1px solid #444; cursor: pointer; background: #333; color: #ccc; }
        .acc-btn.active { border-color: var(--point); color: var(--point); font-weight: bold; }

        /* 기존 디자인 유지 */
        .story-container { background: white; padding: 15px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid #eee; }
        .story-item { flex: 0 0 auto; text-align: center; width: 65px; cursor: pointer; }
        .story-img { width: 55px; height: 55px; border-radius: 22px; background: #ddd; border: 2px solid var(--point); object-fit: cover; }
        
        #login-ui { position: fixed; inset: 0; background: var(--point); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 260px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        main { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
        header { padding: 15px; background: white; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 12px; max-width: 75%; font-size: 14px; }
        .me { align-self: flex-end; background: var(--point); }
        .o { align-self: flex-start; background: white; }

        footer { padding: 15px; background: white; display: none; gap: 10px; }
        #m-in { flex: 1; border: none; background: #f0f0f2; padding: 12px; border-radius: 20px; outline: none; }
        
        #call-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div class="auth-bar" id="auth-bar" style="display:none;">
    <span>계정 전환:</span>
    <div id="acc-list" style="display:flex; gap:8px;"></div>
    <span onclick="logout()" style="margin-left:auto; cursor:pointer; color:#888;">로그아웃</span>
</div>

<div id="login-ui" class="login-ui">
    <div class="login-box">
        <h2 style="margin:0 0 20px;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="login()" style="width:100%; padding:15px; background:#333; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">로그인</button>
        <p style="font-size:11px; color:#888; margin-top:15px;">로그인 시 자동으로 계정이 저장됩니다.</p>
    </div>
</div>

<div class="story-container" id="story-area"></div>

<main>
    <header>
        <b id="target-name">대상을 선택하세요</b>
        <div style="display:flex; gap:15px;">
            <span onclick="startCall(false)" style="cursor:pointer; font-size:22px;">📞</span>
            <span onclick="startCall(true)" style="cursor:pointer; font-size:22px;">📹</span>
        </div>
    </header>
    <div id="chat-view"></div>
    <footer id="chat-footer">
        <input type="text" id="m-in" placeholder="메시지..." onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()">전송</button>
    </footer>
</main>

<div id="call-ui">
    <h2 id="call-name">연결 중...</h2>
    <button onclick="location.reload()" style="background:red; color:white; padding:10px 30px; border:none; border-radius:20px;">종료</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const conf = { /* 유저님의 Firebase 설정값 */ };
    const app = initializeApp(conf);
    const db = getDatabase(app);
    let myId, targetId, peer;

    // [핵심] 페이지 로드 시 자동 로그인 확인
    window.addEventListener('DOMContentLoaded', () => {
        const lastUser = localStorage.getItem('lastUser');
        if (lastUser) {
            autoLogin(lastUser);
        }
        updateAccountBar();
    });

    // 자동 로그인 실행
    async function autoLogin(id) {
        const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
        if (accounts[id]) {
            doProcessLogin(id, accounts[id]);
        }
    }

    // 일반 로그인
    window.login = async () => {
        const id = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        // 계정 정보 로컬 저장 (최대 2개 관리 예시)
        let accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
        accounts[id] = pw;
        localStorage.setItem('accounts', JSON.stringify(accounts));
        localStorage.setItem('lastUser', id);

        doProcessLogin(id, pw);
    };

    function doProcessLogin(id, pw) {
        myId = id;
        peer = new Peer(myId);
        peer.on('open', () => {
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('auth-bar').style.display = 'flex';
            updateAccountBar();
            loadStories();
        });
        // 통화 수신 대기 등... (기존 로직 동일)
    }

    // [핵심] 계정 전환 바 업데이트
    function updateAccountBar() {
        const accList = document.getElementById('acc-list');
        const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
        accList.innerHTML = "";

        Object.keys(accounts).forEach(id => {
            const btn = document.createElement('div');
            btn.className = `acc-btn ${id === myId ? 'active' : ''}`;
            btn.innerText = id;
            btn.onclick = () => {
                if(id !== myId) {
                    localStorage.setItem('lastUser', id);
                    location.reload(); // 계정 전환 시 새로고침
                }
            };
            accList.innerHTML += btn.outerHTML;
        });
    }

    window.logout = () => {
        localStorage.removeItem('lastUser');
        location.reload();
    };

    // ... (기존 loadStories, openChat, send, startCall 로직 동일) ...
</script>
</body>
</html>
