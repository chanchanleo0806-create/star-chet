<script type="module">
    // 1. Firebase 라이브러리 로드
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 2. 유저님 Firebase 설정 (이 부분만 정확히 입력하세요!)
    const conf = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(conf);
    const db = getDatabase(app);
    const storage = getStorage(app);
    let myId, targetId, peer;

    // 3. 자동 로그인 확인 (페이지 로드 시)
    window.addEventListener('DOMContentLoaded', () => {
        const lastUser = localStorage.getItem('lastUser');
        if (lastUser) {
            console.log("자동 로그인 시도:", lastUser);
            autoLogin(lastUser);
        }
    });

    async function autoLogin(id) {
        const accs = JSON.parse(localStorage.getItem('accounts') || '{}');
        if (accs[id]) doLoginProcess(id, accs[id]);
    }

    // 4. 메인 로그인 함수
    window.login = async () => {
        const id = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        
        if(!id || !pw) return alert("아이디와 비번을 입력해주세요.");
        
        try {
            const uRef = ref(db, `auth/${id}`);
            const snap = await get(uRef);
            
            // 계정이 없으면 자동 가입, 있으면 비번 확인
            if(!snap.exists() || snap.val().pw === pw) {
                if(!snap.exists()) {
                    await set(uRef, {pw: pw, nick: id, pic: ""});
                    console.log("새 계정 생성됨");
                }
                
                // 계정 정보 로컬 저장 (자동 로그인용)
                let accs = JSON.parse(localStorage.getItem('accounts') || '{}');
                accs[id] = pw;
                localStorage.setItem('accounts', JSON.stringify(accs));
                localStorage.setItem('lastUser', id);
                
                doLoginProcess(id, pw);
            } else {
                alert("비밀번호가 틀립니다.");
            }
        } catch (error) {
            console.error("Firebase 연결 에러:", error);
            alert("서버 연결에 실패했습니다. (Firebase 규칙을 확인하세요)");
        }
    };

    // 5. 로그인 성공 후 프로세스
    function doLoginProcess(id, pw) {
        myId = id;
        
        // PeerJS 연결 (아이디 중복 방지를 위해 에러 처리 포함)
        peer = new Peer(myId);
        
        peer.on('open', async () => {
            console.log("PeerJS 연결 성공. ID:", myId);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('auth-bar').style.display = 'flex';
            document.getElementById('my-id-label').innerText = "@" + myId;
            
            // 내 프로필 정보 불러오기
            const info = (await get(ref(db, `auth/${myId}`))).val();
            document.getElementById('my-nick').value = info?.nick || myId;
            document.getElementById('my-pic').src = info?.pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            
            updateAccBar();
            loadStories();
            listenCall();
        });

        peer.on('error', (err) => {
            console.error("PeerJS 에러 발생:", err.type);
            if(err.type === 'unavailable-id') {
                alert("이미 다른 곳에서 접속 중인 아이디입니다.");
            } else {
                alert("통신 오류가 발생했습니다.");
            }
            location.reload();
        });
    }

    // 계정 전환 바 업데이트
    function updateAccBar() {
        const bar = document.getElementById('acc-list');
        const accs = JSON.parse(localStorage.getItem('accounts') || '{}');
        bar.innerHTML = "";
        Object.keys(accs).forEach(id => {
            const btn = document.createElement('div');
            btn.className = `acc-btn ${id === myId ? 'active' : ''}`;
            btn.innerText = id;
            btn.onclick = () => {
                localStorage.setItem('lastUser', id);
                location.reload();
            };
            bar.appendChild(btn);
        });
    }

    window.logout = () => {
        localStorage.removeItem('lastUser');
        location.reload();
    };

    // 친구 목록 로드 (가로형)
    function loadStories() {
        onValue(ref(db, `users/${myId}/f`), async (snap) => {
            const area = document.getElementById('story-area');
            area.innerHTML = "";
            if(snap.val()) {
                for(let fid of Object.keys(snap.val())) {
                    const info = (await get(ref(db, `auth/${fid}`))).val();
                    const item = document.createElement('div');
                    item.className = 'story-item';
                    item.innerHTML = `
                        <img class="story-img" src="${info?.pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                        <div class="story-name">${info?.nick || fid}</div>
                    `;
                    item.onclick = () => openChat(fid, info?.nick || fid);
                    area.appendChild(item);
                }
            }
        });
    }

    // [중략: 기존 openChat, send, upFile, startCall 로직 그대로 유지]
</script>
