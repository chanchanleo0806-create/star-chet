<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - DIAGNOSIS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #fee500; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3c1e1e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #error-msg { color: red; font-size: 12px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box" id="login-ui">
    <h2>STAR LOGIN</h2>
    <input type="text" id="myId" placeholder="아이디">
    <input type="password" id="myPw" placeholder="비밀번호">
    <button onclick="checkAndLogin()">로그인 / 시작하기</button>
    <div id="error-msg"></div>
</div>

<div id="app-main" style="display:none; width: 100%; max-width: 450px; background: #bacee0; height: 100vh;">
    <h3 style="padding: 15px; background: #333; color: white; margin: 0;">로그인 성공!</h3>
    <p style="padding: 20px;">이제 친구를 추가하고 대화하세요.</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ★★★ 중요: 이 부분을 본인의 파이어베이스 정보로 바꾸세요! ★★★
    const firebaseConfig = {
        apiKey: "본인의 API키",
        authDomain: "본인의 도메인",
        databaseURL: "본인의 데이터베이스 주소", // 이게 없으면 로그인이 안 됩니다!
        projectId: "본인의 아이디",
        storageBucket: "본인의 버킷",
        messagingSenderId: "번호",
        appId: "앱아이디"
    };

    // 진단 시스템
    const errMsg = document.getElementById('error-msg');

    try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.checkAndLogin = async () => {
            const id = document.getElementById('myId').value.trim();
            const pw = document.getElementById('myPw').value.trim();

            if(!id || !pw) {
                errMsg.innerText = "⚠️ 아이디와 비번을 입력하세요.";
                return;
            }

            errMsg.innerText = "연결 시도 중...";

            try {
                const userRef = ref(db, `auth/${id}`);
                const snap = await get(userRef);

                if(!snap.exists()) {
                    await set(userRef, { pw: pw });
                    alert("신규 가입 성공!");
                    enterApp();
                } else {
                    if(snap.val().pw === pw) {
                        enterApp();
                    } else {
                        errMsg.innerText = "❌ 비밀번호가 틀립니다.";
                    }
                }
            } catch (e) {
                console.error(e);
                errMsg.innerText = "🔥 에러: " + e.message;
            }
        };
    } catch (e) {
        errMsg.innerText = "⚡ 파이어베이스 설정값(config)이 올바르지 않습니다.";
    }

    function enterApp() {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('app-main').style.display = 'block';
        document.body.style.background = "#bacee0";
    }
</script>
</body>
</html>
