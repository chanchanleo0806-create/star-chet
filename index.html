<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --sidebar: #2c2c2e; --chat-bg: #f4f4f7; --point: #fee500; }
        body { margin: 0; font-family: sans-serif; background: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 상단 바 */
        #auth-bar { background: #1a1a1a; padding: 10px 15px; display: none; gap: 10px; align-items: center; color: white; font-size: 11px; z-index: 10; }
        .acc-btn { padding: 4px 12px; border-radius: 15px; border: 1px solid #444; cursor: pointer; background: #333; }
        .acc-btn.active { border-color: var(--point); color: var(--point); font-weight: bold; }

        /* 로그인 UI */
        #login-ui { position: fixed; inset: 0; background: var(--point); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 280px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; }
        .login-box button { width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 가로형 친구 목록 */
        .story-container { background: white; padding: 15px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid #eee; }
        .story-item { flex: 0 0 auto; text-align: center; width: 60px; cursor: pointer; }
        .story-img { width: 50px; height: 50px; border-radius: 20px; background: #eee; border: 2px solid var(--point); object-fit: cover; }
        .story-name { font-size: 11px; margin-top: 5px; color: #333; }

        /* 채팅 구역 */
        main { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        header { padding: 15px 20px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 70%; font-size: 14px; }
        .me { align-self: flex-end; background: var(--point); }
        .o { align-self: flex-start; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        footer { padding: 15px; background: white; display: none; gap: 10px; border-top: 1px solid #eee; }
        #m-in { flex: 1; border: none; background: #f0f0f2; padding: 12px; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

<div id="auth-bar">
    <span>계정:</span>
    <div id="acc-list" style="display:flex; gap:8px;"></div>
    <button onclick="localStorage.removeItem('lastUser'); location.reload();" style="margin-left:auto; background:none; border:none; color:#888; cursor:pointer;">로그아웃</button>
</div>

<div id="login-ui">
    <div class="login-box">
        <h2 style="margin-top:0;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디">
        <input type="password" id="myPw" placeholder="비밀번호">
        <button onclick="window.handleLogin()">로그인 시작</button>
    </div>
</div>

<div class="story-container" id="story-area"></div>

<main>
    <header>
        <b id="target-name">대상 선택</b>
        <button onclick="window.handleAddFriend()">+ 친구추가</button>
    </header>
    <div id="chat-view"></div>
    <footer id="chat-footer">
        <input type="text" id="m-in" placeholder="메시지..." onkeypress="if(event.keyCode==13) window.handleSend()">
        <button onclick="window.handleSend()" style="border:none; background:none; font-weight:bold;">전송</button>
    </footer>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. 파이어베이스 설정 (본인의 정보로 꼭 확인하세요)
    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId, peer;

    // [전역 함수 등록] HTML 버튼에서 호출 가능하게 만듬
    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return alert("아이디와 비번을 입력하세요.");

        try {
            const snap = await get(ref(db, `auth/${id}`));
            if(!snap.exists() || snap.val().pw === pw) {
                if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw, nick: id});
                
                // 계정 정보 로컬 저장
                let accs = JSON.parse(localStorage.getItem('accounts') || '{}');
                accs[id] = pw;
                localStorage.setItem('accounts', JSON.stringify(accs));
                localStorage.setItem('lastUser', id);
                
                startApp(id);
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        } catch (e) {
            alert("서버 연결 실패! Firebase 규칙을 확인하세요.");
            console.error(e);
        }
    };

    function startApp(id) {
        myId = id;
        peer = new Peer(myId);
        
        peer.on('open', () => {
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('auth-bar').style.display = 'flex';
            updateAccUI();
            loadFriends();
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                alert("이 아이디는 현재 접속 중입니다. 잠시 후 다시 시도하세요.");
            } else {
                alert("오류 발생: " + err.type);
            }
            location.reload();
        });
    }

    function updateAccUI() {
        const list = document.getElementById('acc-list');
        const accs = JSON.parse(localStorage.getItem('accounts') || '{}');
        list.innerHTML = "";
        Object.keys(accs).forEach(aid => {
            const btn = document.createElement('div');
            btn.className = `acc-btn ${aid === myId ? 'active' : ''}`;
            btn.innerText = aid;
            btn.onclick = () => { localStorage.setItem('lastUser', aid); location.reload(); };
            list.appendChild(btn);
        });
    }

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:");
        if(!fid || fid === myId) return;
        const check = await get(ref(db, `auth/${fid}`));
        if(check.exists()) {
            await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
            alert("친구 추가됨!");
        } else alert("존재하지 않는 사용자입니다.");
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const area = document.getElementById('story-area');
            area.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(fid => {
                area.innerHTML += `
                    <div class="story-item" onclick="window.handleOpenChat('${fid}')">
                        <div class="story-img"></div>
                        <div class="story-name">${fid}</div>
                    </div>`;
            });
        });
    }

    window.handleOpenChat = (fid) => {
        targetId = fid;
        document.getElementById('target-name').innerText = fid;
        document.getElementById('chat-footer').style.display = 'flex';
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(m => {
                v.innerHTML += `<div class="msg ${m.s === myId ? 'me' : 'o'}">${m.t}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {t: i.value, s: myId});
        i.value = "";
    };

    // 자동 로그인 체크
    const last = localStorage.getItem('lastUser');
    if(last) startApp(last);
</script>
</body>
</html>
