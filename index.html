<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK - FIXED</title>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --menu-w: 280px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: #fff; height: 100vh; overflow: hidden; }

        /* [로그인 UI] */
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .login-input { width: 100%; max-width: 320px; height: 50px; margin-bottom: 10px; padding: 0 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .btn-login { width: 100%; max-width: 320px; height: 50px; background: #000; color: #fff; border: none; border-radius: 10px; font-weight: bold; }

        /* [사이드 메뉴] */
        #side-menu {
            position: fixed; top: 0; left: calc(var(--menu-w) * -1); 
            width: var(--menu-w); height: 100%; background: #fff; z-index: 3000;
            transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        #side-menu.open { left: 0; }
        .menu-header { padding: 20px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }

        /* [채팅 화면] */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        header { height: 60px; padding: 0 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        #chat-view { flex: 1; overflow-y: auto; background: var(--bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* 메시지 말풍선 */
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; word-break: break-all; position: relative; }
        .me { align-self: flex-end; background: var(--main); }
        .o { align-self: flex-start; background: #fff; }

        footer { padding: 10px; background: #fff; display: flex; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #m-in { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 20px; padding: 0 15px; outline: none; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; }
    </style>
</head>
<body>

    <div id="login-ui">
        <h2 style="margin-bottom:30px;">STAR TALK</h2>
        <input type="text" id="myId" class="login-input" placeholder="아이디">
        <input type="password" id="myPw" class="login-input" placeholder="비밀번호">
        <button class="btn-login" onclick="window.handleLogin()">시작하기</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div class="menu-header">
            <span>친구 목록</span>
            <button onclick="window.handleAddFriend()">+ 추가</button>
        </div>
        <div id="friend-list" style="padding:10px;"></div>
    </nav>

    <main id="main-app">
        <header>
            <button onclick="window.toggleMenu()" style="background:none; border:none; font-size:24px;">≡</button>
            <b id="target-title">대화 상대를 선택하세요</b>
            <div style="width:30px;"></div>
        </header>
        <div id="chat-view"></div>
        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button onclick="window.handleSend()" style="border:none; background:none; font-weight:bold; color:#333;">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId;

    window.toggleMenu = () => {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const isOpen = menu.classList.toggle('open');
        overlay.style.display = isOpen ? 'block' : 'none';
    };

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadFriends();
            window.toggleMenu(); // 로그인 직후 친구를 선택하도록 메뉴 열기
        } else alert("정보 불일치");
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.val()) {
                Object.keys(snap.val()).forEach(fid => {
                    const item = document.createElement('div');
                    item.style = "padding:15px; background:#f9f9f9; border-radius:10px; margin-bottom:8px; cursor:pointer;";
                    item.innerHTML = `👤 <b>${fid}</b>`;
                    item.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                    list.appendChild(item);
                });
            }
        });
    }

    window.handleAddFriend = async () => {
        const fid = prompt("친구 아이디:").toLowerCase().trim();
        if(fid && fid !== myId) {
            const check = await get(ref(db, `auth/${fid}`));
            if(check.exists()) await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
            else alert("없는 아이디");
        }
    };

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        const rid = [myId, fid].sort().join("_");
        
        // 채팅방 데이터를 실시간으로 가져와서 화면에 그림
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view');
            v.innerHTML = "";
            const data = s.val();
            if(data) {
                Object.values(data).forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.s === myId ? 'me' : 'o'}`;
                    div.innerText = m.t;
                    v.appendChild(div);
                });
                v.scrollTop = v.scrollHeight;
            }
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        const text = i.value.trim();
        if(!text) return;
        if(!targetId) return alert("대화 상대를 먼저 선택하세요! (왼쪽 메뉴)");

        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), {
            t: text,
            s: myId,
            ts: serverTimestamp()
        });
        i.value = "";
    };
</script>
</body>
</html>
