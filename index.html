<div id="chat-window">
    <div style="height:60px; border-bottom:1px solid #eee; display:flex; align-items:center; padding:0 20px; justify-content:space-between;">
        </div>
    <div id="chat-view"></div>
    
    <div id="preview-box" style="display:none; padding:10px; background:#fff; border-top:1px solid #eee; position:relative;">
        <img id="img-preview" src="" style="width:60px; height:60px; border-radius:8px; object-fit:cover;">
        <span onclick="window.clearPreview()" style="position:absolute; top:5px; left:65px; cursor:pointer; background:#000; color:#fff; border-radius:50%; width:20px; height:20px; text-align:center; font-size:12px;">✕</span>
    </div>

    <div style="padding:15px; border-top:1px solid #eee; display:flex; gap:10px; align-items:center;">
        <label for="file-in" style="cursor:pointer; font-size:20px;">🖼️</label>
        <input type="file" id="file-in" accept="image/*" style="display:none;" onchange="window.handleFile(this)">
        
        <input type="text" id="m-in" style="flex:1; padding:12px; border-radius:20px; border:1px solid #ddd; outline:none;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendMsg()">
        <button onclick="window.sendMsg()" style="padding:10px 20px; background:#000; color:#fff; border:none; border-radius:20px; font-weight:bold;">전송</button>
    </div>
</div>

<script type="module">
    // ... 기존 변수 및 초기화 로직 생략 ...

    let selectedFileData = null; // 선택된 이미지 데이터를 담을 변수

    // [1] 파일 선택 시 미리보기 처리
    window.handleFile = (input) => {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedFileData = e.target.result; // 이미지 데이터(Base64) 저장
                document.getElementById('img-preview').src = selectedFileData;
                document.getElementById('preview-box').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    };

    // [2] 미리보기 취소
    window.clearPreview = () => {
        selectedFileData = null;
        document.getElementById('file-in').value = "";
        document.getElementById('preview-box').style.display = 'none';
    };

    // [3] 메시지 전송 로직 수정 (글자 또는 사진)
    window.sendMsg = async () => {
        const i = document.getElementById('m-in');
        const msgText = i.value.trim();
        
        // 텍스트도 없고 사진도 없으면 전송 안 함
        if(!msgText && !selectedFileData) return;

        // Firebase에 저장할 데이터 객체
        const messageData = {
            t: msgText,
            s: myId,
            img: selectedFileData || null, // 사진이 있으면 포함
            time: Date.now()
        };

        push(ref(db, `msgs/${activeRid}`), messageData);
        
        // 전송 후 입력창 및 미리보기 초기화
        i.value = "";
        window.clearPreview();

        // 상대방 안 읽은 숫자 카운트 (이전 로직 동일)
        const targetId = activeRid.replace(myId, "").replace("_", "");
        const unreadRef = ref(db, `unread/${activeRid}/${targetId}`);
        const current = (await get(unreadRef)).val() || 0;
        set(unreadRef, current + 1);
    };

    // [4] 채팅 내역 표시 로직 수정 (사진 출력 추가)
    window.openChat = (rid, name) => {
        activeRid = rid;
        // ... (접속 상태 로직 생략) ...

        onValue(ref(db, `msgs/${rid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) {
                Object.entries(snap.val()).forEach(([mid, m]) => {
                    const isMe = m.s === myId;
                    let contentHTML = "";
                    
                    // 이미지가 있으면 이미지 태그 추가
                    if(m.img) {
                        contentHTML += `<img src="${m.img}" style="max-width:200px; border-radius:10px; display:block; margin-bottom:5px; cursor:pointer;" onclick="window.openFullImage('${m.img}')">`;
                    }
                    // 텍스트가 있으면 텍스트 추가
                    if(m.t) {
                        contentHTML += `<span>${m.t}</span>`;
                    }

                    v.innerHTML += `<div class="bubble ${isMe ? 'me' : 'o'}">${contentHTML}</div>`;
                });
            }
            v.scrollTop = v.scrollHeight;
        });
    };

    // 사진 크게 보기 (심플)
    window.openFullImage = (src) => {
        const win = window.open("");
        win.document.write(`<img src="${src}" style="width:100%; height:auto;">`);
    };
</script>
