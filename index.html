<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR TALK ULTIMATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #ffffff; --side: #1a1a1a; --line: #eeeeee; --gray: #f8f8f8; --accent: #ff3b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }
        
        /* 네비게이션 및 라벨 */
        #main-app { display: none; height: 100%; width: 100%; }
        nav { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #555; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 22px; }
        .nav-text { font-size: 10px; font-weight: bold; }

        /* 패널 및 리스트 */
        .content-panel { flex: 1; display: none; flex-direction: column; background: #fff; }
        .content-panel.active { display: flex; }
        .panel-header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
        .list-item { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 0.5px solid #eee; }
        .p-img { width: 50px; height: 50px; background: #eee; border-radius: 18px; object-fit: cover; }

        /* 채팅 및 메시지 */
        #chat-window { position: fixed; inset: 0 0 0 70px; background: #fff; z-index: 100; display: none; flex-direction: column; }
        #chat-view { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f2f2f2; }
        .bubble { padding: 10px 14px; border-radius: 15px; font-size: 14px; max-width: 80%; word-break: break-all; }
        .me { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 2px; }
        .o { align-self: flex-start; background: #fff; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .bubble img { max-width: 100%; border-radius: 10px; margin-top: 5px; }

        /* 영상통화 UI (PIP 개선) */
        #call-ui { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        #remote-v { width: 100%; height: 100%; object-fit: cover; }
        #local-v-box { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; border-radius: 12px; overflow: hidden; border: 2px solid #fff; z-index: 2010; }
        #local-v { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .call-btns { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 2020; }
        .c-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; cursor: pointer; }
        .c-circle { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .c-circle.red { background: var(--accent); }
        .c-circle.active { background: #fff; color: #000; }

        /* 오버레이 */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1500; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        #login-ui { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-ui">
    <div style="width:280px; display:flex; flex-direction:column; gap:12px;">
        <h2 style="text-align:center;">STAR TALK</h2>
        <input type="text" id="myId" placeholder="아이디" style="padding:15px; border:1px solid #eee; border-radius:12px;">
        <input type="password" id="myPw" placeholder="비밀번호" style="padding:15px; border:1px solid #eee; border-radius:12px;">
        <button onclick="window.doLogin()" style="padding:15px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:bold;">접속</button>
    </div>
</div>

<div id="call-ui">
    <video id="remote-v" autoplay playsinline></video>
    <div id="local-v-box"><video id="local-v" autoplay playsinline muted></video></div>
    <div class="call-btns">
        <div class="c-btn" onclick="window.toggleMic()">
            <div id="mic-icon" class="c-circle">🎤</div><span class="nav-text">음소거</span>
        </div>
        <div class="c-btn" onclick="window.endCall()">
            <div class="c-circle red">✕</div><span class="nav-text">종료</span>
        </div>
        <div class="c-btn" onclick="window.toggleCam()">
            <div id="cam-icon" class="c-circle">🎥</div><span class="nav-text">카메라</span>
        </div>
    </div>
</div>

<div id="main-app">
    <nav>
        <div class="nav-item active" onclick="window.showPanel('friend', this)">
            <span class="nav-icon">👤</span><span class="nav-text">친구</span>
        </div>
        <div class="nav-item" onclick="window.showPanel('chat', this)">
            <span class="nav-icon">💬</span><span class="nav-text">채팅</span>
        </div>
        <div class="nav-item" onclick="window.showPanel('profile', this)">
            <span class="nav-icon">⚙️</span><span class="nav-text">설정</span>
        </div>
        <div class="nav-item" style="margin-top:auto;" onclick="window.doLogout()">
            <span class="nav-icon">🚪</span><span class="nav-text">로그아웃</span>
        </div>
    </nav>

    <div id="panel-friend" class="content-panel active">
        <div class="panel-header"><span>친구</span><span onclick="window.addFriend()">+</span></div>
        <div id="friend-list"></div>
    </div>

    <div id="panel-chat" class="content-panel">
        <div class="panel-header">채팅</div>
        <div id="chat-list"></div>
    </div>

    <div id="panel-profile" class="content-panel">
        <div class="panel-header">프로필 설정</div>
        <div style="padding:30px; display:flex; flex-direction:column; align-items:center; gap:20px;">
            <img id="my-profile-img" class="p-img" style="width:100px; height:100px;" src="https://via.placeholder.com/100">
            <input type="file" id="p-file" accept="image/*" style="display:none;" onchange="window.updateProfileImg(this)">
            <button onclick="document.getElementById('p-file').click()" style="padding:8px 15px; border-radius:15px; border:1px solid #ddd; background:none;">사진 변경</button>
            <input type="text" id="my-nick" placeholder="닉네임" style="width:100%; padding:12px; border:1px solid #eee; border-radius:10px; text-align:center;">
            <button onclick="window.saveProfile()" style="width:100%; padding:15px; background:#000; color:#fff; border:none; border-radius:12px;">저장하기</button>
        </div>
    </div>

    <div id="chat-window">
        <div style="height:60px; border-bottom:1px solid #eee; display:flex; align-items:center; padding:0 15px;">
            <span onclick="window.closeChat()" style="font-size:20px;">◀</span>
            <b id="chat-title" style="margin-left:15px;">대상</b>
        </div>
        <div id="chat-view"></div>
        <div id="preview-area" style="display:none; padding:10px; background:#fff; border-top:1px solid #eee;">
            <img id="img-pre" style="width:50px; height:50px; border-radius:5px;">
            <span onclick="window.cancelFile()" style="margin-left:10px;">✕</span>
        </div>
        <div style="padding:10px; display:flex; align-items:center; gap:10px; border-top:1px solid #eee;">
            <label for="f-in" style="font-size:24px;">🖼️</label>
            <input type="file" id="f-in" style="display:none;" onchange="window.handleFile(this)">
            <button id="rec-btn" style="background:none; border:none; font-size:24px;" onclick="window.toggleRecord()">🎤</button>
            <input type="text" id="m-in" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; outline:none;" onkeypress="if(event.keyCode==13) window.sendMsg()">
            <button onclick="window.sendMsg()" style="padding:8px 15px; background:#000; color:#fff; border:none; border-radius:15px;">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ", databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "starchet-e9630" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, activeRid, peer, currentCall, myStream, fileData, recorder, chunks = [], isMic = true, isCam = true;

    // [로그인 및 초기화]
    window.doLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase(), pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;
        myId = id; localStorage.setItem('st_id', id);
        document.getElementById('login-ui').style.display='none';
        document.getElementById('main-app').style.display='flex';
        initApp();
    };

    function initApp() {
        peer = new Peer(myId);
        // [전화 수신 알림 해결]
        peer.on('call', async (call) => {
            const accept = confirm(`${call.peer}님의 영상통화가 왔습니다!`);
            if(accept) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
                document.getElementById('local-v').srcObject = myStream;
                call.answer(myStream);
                handleCall(call);
            }
        });
        loadData();
    }

    // [프로필 꾸미기]
    window.updateProfileImg = (input) => {
        const reader = new FileReader();
        reader.onload = (e) => { document.getElementById('my-profile-img').src = e.target.result; };
        reader.readAsDataURL(input.files[0]);
    };
    window.saveProfile = () => {
        const nick = document.getElementById('my-nick').value;
        const img = document.getElementById('my-profile-img').src;
        update(ref(db, `users/${myId}`), { name: nick, img: img });
        alert("저장되었습니다!");
    };

    // [전화 및 PIP 제어]
    window.startCall = async (fid) => {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
            document.getElementById('local-v').srcObject = myStream;
            document.getElementById('call-ui').style.display='flex';
            const call = peer.call(fid, myStream);
            handleCall(call);
        } catch(e) { alert("카메라 권한을 허용해주세요."); }
    };
    function handleCall(call) {
        currentCall = call;
        document.getElementById('call-ui').style.display='flex';
        call.on('stream', rs => { 
            const rv = document.getElementById('remote-v');
            rv.srcObject = rs;
            rv.onloadedmetadata = () => rv.play(); // 모바일 자동재생 강제
        });
        call.on('close', window.endCall);
    }
    window.toggleMic = () => { isMic = !isMic; myStream.getAudioTracks()[0].enabled = isMic; document.getElementById('mic-icon').innerText = isMic ? "🎤" : "🔇"; };
    window.toggleCam = () => { isCam = !isCam; myStream.getVideoTracks()[0].enabled = isCam; document.getElementById('cam-icon').innerText = isCam ? "🎥" : "📵"; };
    window.endCall = () => { if(currentCall) currentCall.close(); if(myStream) myStream.getTracks().forEach(t=>t.stop()); document.getElementById('call-ui').style.display='none'; };

    // [파일 및 메시지]
    window.handleFile = (input) => {
        const reader = new FileReader();
        reader.onload = (e) => { fileData = e.target.result; document.getElementById('img-pre').src = fileData; document.getElementById('preview-area').style.display='block'; };
        reader.readAsDataURL(input.files[0]);
    };
    window.sendMsg = () => {
        const i = document.getElementById('m-in'); if(!i.value.trim() && !fileData) return;
        push(ref(db, `msgs/${activeRid}`), { t: i.value, s: myId, f: fileData || null });
        i.value = ""; window.cancelFile();
    };
    window.cancelFile = () => { fileData = null; document.getElementById('preview-area').style.display='none'; };

    // [음성 녹음]
    window.toggleRecord = async () => {
        if(!recorder) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
                const reader = new FileReader();
                reader.onload = (e) => { push(ref(db, `msgs/${activeRid}`), { s: myId, audio: e.target.result }); };
                reader.readAsDataURL(blob);
                chunks = [];
            };
            recorder.start();
            document.getElementById('rec-btn').innerText = "🛑";
        } else {
            recorder.stop(); recorder = null;
            document.getElementById('rec-btn').innerText = "🎤";
        }
    };

    // [기본 로직]
    function loadData() {
        onValue(ref(db, `friends/${myId}`), snap => {
            const list = document.getElementById('friend-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([fid, info]) => {
                const d = document.createElement('div'); d.className="list-item";
                d.innerHTML = `<img class="p-img" src="https://via.placeholder.com/50"><b>${fid}</b><span onclick="window.startCall('${fid}')" style="margin-left:auto;">🎥</span>`;
                d.onclick = (e) => { if(e.target.tagName !== 'SPAN') window.openChat(fid); };
                list.appendChild(d);
            });
        });
        onValue(ref(db, `users/${myId}`), snap => {
            if(snap.val()) {
                document.getElementById('my-nick').value = snap.val().name || "";
                document.getElementById('my-profile-img').src = snap.val().img || "https://via.placeholder.com/100";
            }
        });
    }
    window.openChat = (fid) => {
        activeRid = myId < fid ? `${myId}_${fid}` : `${fid}_${myId}`;
        document.getElementById('chat-title').innerText = fid;
        document.getElementById('chat-window').style.display='flex';
        onValue(ref(db, `msgs/${activeRid}`), snap => {
            const v = document.getElementById('chat-view'); v.innerHTML = "";
            if(snap.val()) Object.values(snap.val()).forEach(m => {
                let content = m.t || "";
                if(m.f) content = `<img src="${m.f}">` + content;
                if(m.audio) content = `<audio controls src="${m.audio}" style="width:200px;"></audio>`;
                v.innerHTML += `<div class="bubble ${m.s===myId?'me':'o'}">${content}</div>`;
            });
            v.scrollTop = v.scrollHeight;
        });
    };
    window.showPanel = (t, el) => {
        document.querySelectorAll('.content-panel').forEach(p=>p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); el.classList.add('active');
    };
    window.closeChat = () => document.getElementById('chat-window').style.display='none';
    window.addFriend = () => {
        const fid = prompt("친구 ID:").trim().toLowerCase();
        if(fid) update(ref(db), {[`friends/${myId}/${fid}`]:{name:fid}, [`friends/${fid}/${myId}`]:{name:myId}});
    };
    window.doLogout = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
