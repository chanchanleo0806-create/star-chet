<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR CHAT PRO - 방장 관리 모드</title>
    <style>
        body { background: #202225; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { background: #2f3136; padding: 20px; border-radius: 12px; width: 95%; max-width: 500px; height: 90vh; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input, button { padding: 12px; border-radius: 6px; border: none; margin: 5px 0; }
        input { background: #40444b; color: #fff; width: 100%; box-sizing: border-box; }
        button { background: #5865f2; color: #fff; cursor: pointer; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; background: #36393f; padding: 10px; margin: 10px 0; border-radius: 6px; }
        .msg { background: #40444b; padding: 10px; border-radius: 6px; margin-bottom: 8px; position: relative; }
        .del-btn { position: absolute; right: 5px; top: 5px; background: #f04747; color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; }
        .is-admin-badge { color: #faa61a; font-size: 11px; font-weight: bold; background: rgba(250,166,26,0.1); padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-sec" style="text-align:center;">
        <h2>🔐 STAR CHAT ADMIN</h2>
        <input type="number" id="roomNum" placeholder="방 번호 (1-100)">
        <input type="password" id="roomPw" placeholder="비밀번호">
        <button onclick="joinRoom()" style="width:100%">입장 / 방 만들기</button>
    </div>

    <div id="chat-sec" style="display:none; height:100%; flex-direction:column;">
        <div style="background: #292b2f; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
            <span id="room-info">📡 접속 대기</span>
            <span id="admin-badge" class="is-admin-badge" style="display:none;">👑 방장</span>
            <button onclick="location.reload()" style="background:#f04747; padding:5px 10px; margin:0; font-size:12px;">방 나가기</button>
        </div>
        
        <div id="messages"></div>

        <div style="display:flex; flex-direction:column; gap:5px;">
            <input type="text" id="msgInput" placeholder="메시지 입력...">
            <button onclick="sendMsg()">전송</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let room = "";
    let isAdmin = false;

    // 1. 방 입장 및 방장 판별
    window.joinRoom = async () => {
        room = document.getElementById('roomNum').value;
        const pw = document.getElementById('roomPw').value;
        if(!room || !pw) return alert("번호와 비번을 입력하세요.");

        const roomRef = ref(db, `rooms/${room}`);
        const snap = await get(roomRef);

        if(snap.exists()) {
            if(snap.val().password !== pw) return alert("비번 틀림!");
            isAdmin = false;
        } else {
            isAdmin = true;
            await set(roomRef, { password: pw, owner: true });
            // 방장 종료 시 자동 폭파 설정
            onDisconnect(ref(db, `rooms/${room}`)).remove();
            onDisconnect(ref(db, `chats/${room}`)).remove();
            document.getElementById('admin-badge').style.display = 'inline';
        }

        document.getElementById('login-sec').style.display = 'none';
        document.getElementById('chat-sec').style.display = 'flex';
        document.getElementById('room-info').innerText = `📡 Room ${room}`;
        listenMessages();
    };

    // 2. 실시간 메시지 수신 (삭제 기능 포함)
    function listenMessages() {
        onValue(ref(db, `chats/${room}`), (snap) => {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            const data = snap.val();

            if(!data && !isAdmin) {
                alert("방장이 나갔거나 방이 삭제되었습니다.");
                location.reload();
            }

            if(data) {
                // 메시지 키(ID)를 포함하여 리스트 생성
                Object.keys(data).forEach(key => {
                    const m = data[key];
                    const div = document.createElement('div');
                    div.className = 'msg';
                    
                    // 방장일 때만 삭제 버튼 추가
                    const delBtn = isAdmin ? `<button class="del-btn" onclick="deleteMsg('${key}')">X</button>` : "";
                    
                    div.innerHTML = `
                        <small style="color:#888; font-size:10px;">${m.time}</small>
                        <div style="margin-top:5px;">${m.text}</div>
                        ${delBtn}
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }
        });
    }

    // 3. 개별 메시지 삭제 함수 (방장 전용)
    window.deleteMsg = (msgId) => {
        if(!isAdmin) return;
        if(confirm("이 메시지를 삭제할까요?")) {
            remove(ref(db, `chats/${room}/${msgId}`));
        }
    };

    // 4. 메시지 전송
    window.sendMsg = () => {
        const input = document.getElementById('msgInput');
        if(!input.value) return;
        push(ref(db, `chats/${room}`), {
            text: input.value,
            time: new Date().toLocaleTimeString()
        });
        input.value = "";
    };
</script>
</body>
