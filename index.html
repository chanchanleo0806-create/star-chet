<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR TALK - FRIENDS</title>
    <style>
        :root { --main: #FEE500; --dark: #3C1E1E; --bg: #bacee0; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); height: 100vh; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 450px; background: white; display: flex; flex-direction: column; position: relative; }
        
        /* 로그인 */
        .overlay { position: absolute; inset: 0; background: var(--main); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .in { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-dark { width: 100%; padding: 12px; background: var(--dark); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* 헤더 & 탭 */
        header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: #f9f9f9; border-bottom: 1px solid #ddd; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; color: #666; }
        .tab.active { color: var(--dark); border-bottom: 3px solid var(--dark); font-weight: bold; }

        /* 리스트 & 채팅창 */
        #list-view, #chat-view { flex: 1; overflow-y: auto; display: none; }
        .f-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
        .f-item:hover { background: #f5f5f5; }
        .f-icon { width: 40px; height: 40px; background: #eee; border-radius: 15px; margin-right: 12px; display: flex; align-items: center; justify-content: center; }

        #chat-view { background: var(--bg); padding: 15px; flex-direction: column; gap: 10px; }
        .m-wrap { display: flex; flex-direction: column; max-width: 80%; }
        .m-box { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; }
        .me { align-self: flex-end; align-items: flex-end; } .me .m-box { background: var(--main); }
        .o { align-self: flex-start; } .o .m-box { background: white; }

        /* 하단 입력창 */
        .input-bar { padding: 10px; display: none; background: white; gap: 5px; }
        #msg-in { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="login-ui" class="overlay">
        <h2 style="color:var(--dark);">STAR TALK</h2>
        <input type="text" id="myId" class="in" placeholder="아이디">
        <input type="password" id="myPw" class="in" placeholder="비밀번호">
        <button onclick="login()" class="btn-dark">로그인 / 시작</button>
    </div>

    <header>
        <span id="title">STAR TALK</span>
        <button onclick="addFriend()" style="background:var(--main); border:none; padding:5px 10px; border-radius:5px; font-size:12px; font-weight:bold; cursor:pointer;">+ 친구추가</button>
    </header>

    <div class="tabs">
        <div class="tab active" id="t-list" onclick="showTab('list')">친구목록</div>
        <div class="tab" id="t-chat" onclick="showTab('chat')">대화창</div>
    </div>

    <div id="list-view" style="display:block;"></div>
    <div id="chat-view"></div>

    <div class="input-bar" id="input-area">
        <input type="text" id="msg-in" placeholder="메시지를 입력하세요" onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()" style="background:var(--main); border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">전송</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const conf = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        storageBucket: "starchet-e9630.firebasestorage.app",
        messagingSenderId: "532571302538",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(conf);
    const db = getDatabase(app);
    let myId = "", targetId = "", chatRoomId = "";

    // 1. 로그인
    window.login = async () => {
        myId = document.getElementById('myId').value.trim();
        const pw = document.getElementById('myPw').value.trim();
        if(!myId || !pw) return;

        const authRef = ref(db, `auth/${myId}`);
        const snap = await get(authRef);

        if(!snap.exists()) {
            await set(authRef, { pw: pw });
            start();
        } else if(snap.val().pw === pw) {
            start();
        } else {
            alert("비밀번호가 틀립니다.");
        }
    };

    function start() {
        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('title').innerText = "ID: " + myId;
        loadFriends();
    }

    // 2. 친구 추가
    window.addFriend = async () => {
        const fid = prompt("추가할 친구의 아이디를 입력하세요:");
        if(!fid || fid === myId) return;
        
        // 내 친구 목록에 저장
        await set(ref(db, `users/${myId}/friends/${fid}`), { id: fid });
        // 상대방 친구 목록에도 나를 저장 (서로 친구)
        await set(ref(db, `users/${fid}/friends/${myId}`), { id: myId });
        alert(fid + "님과 친구가 되었습니다!");
    };

    // 3. 친구 목록 불러오기
    function loadFriends() {
        onValue(ref(db, `users/${myId}/friends`), (snap) => {
            const list = document.getElementById('list-view');
            list.innerHTML = "";
            if(!snap.exists()) {
                list.innerHTML = "<p style='text-align:center; padding:20px; color:gray;'>친구가 없습니다.</p>";
                return;
            }
            Object.keys(snap.val()).forEach(fid => {
                const div = document.createElement('div');
                div.className = 'f-item';
                div.innerHTML = `<div class="f-icon">👤</div><b>${fid}</b>`;
                div.onclick = () => openChat(fid);
                list.appendChild(div);
            });
        });
    }

    // 4. 채팅방 열기
    function openChat(fid) {
        targetId = fid;
        chatRoomId = [myId, fid].sort().join("_"); // 고유 방 ID 생성
        showTab('chat');
        document.getElementById('t-chat').innerText = fid + "님과 대화";

        onValue(ref(db, `messages/${chatRoomId}`), (snap) => {
            const box = document.getElementById('chat-view');
            box.innerHTML = "";
            if(snap.exists()) {
                Object.values(snap.val()).forEach(m => {
                    const isMe = m.sender === myId;
                    const wrap = document.createElement('div');
                    wrap.className = `m-wrap ${isMe ? 'me' : 'o'}`;
                    wrap.innerHTML = `<div class="m-box">${m.text}</div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            }
        });
    }

    // 5. 메시지 전송
    window.send = () => {
        const input = document.getElementById('msg-in');
        if(!input.value || !chatRoomId) return;
        push(ref(db, `messages/${chatRoomId}`), {
            text: input.value,
            sender: myId,
            time: Date.now()
        });
        input.value = "";
    };

    // 6. 탭 전환
    window.showTab = (type) => {
        document.getElementById('list-view').style.display = type === 'list' ? 'block' : 'none';
        document.getElementById('chat-view').style.display = type === 'chat' ? 'flex' : 'none';
        document.getElementById('input-area').style.display = type === 'chat' ? 'flex' : 'none';
        document.getElementById('t-list').classList.toggle('active', type === 'list');
        document.getElementById('t-chat').classList.toggle('active', type === 'chat');
    };
</script>
</body>
</html>
