<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STAR TALK - MOBILE FIXED</title>
    <style>
        :root { --main: #fee500; --bg: #abc1d1; --menu-w: 260px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 전체 화면 설정 - 안드로이드 스크롤 방지 */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed; 
        }

        /* [로그인 UI] */
        #login-ui { 
            position: fixed; inset: 0; background: #fff; z-index: 5000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; 
        }
        .login-input { width: 100%; max-width: 300px; height: 50px; margin-bottom: 10px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-login { width: 100%; max-width: 300px; height: 50px; background: #000; color: #fff; border: none; border-radius: 8px; font-weight: bold; }

        /* [메인 앱 레이아웃] */
        #main-app { 
            display: none; flex-direction: column; width: 100%; height: 100%; background: var(--bg);
        }

        /* 상단 헤더 */
        header { 
            height: 55px; min-height: 55px; background: #fff; border-bottom: 1px solid #eee;
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100;
        }

        /* 채팅 구역 - 입력창 제외한 나머지 다 채우기 */
        #chat-view { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
            -webkit-overflow-scrolling: touch; 
        }

        /* 하단 입력바 - 안드로이드 키보드 대응 핵심 */
        footer { 
            background: #fff; padding: 8px 10px; 
            display: flex; align-items: center; gap: 8px;
            border-top: 1px solid #ddd;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        #m-in { 
            flex: 1; height: 42px; background: #f0f0f0; border: none; 
            border-radius: 21px; padding: 0 15px; font-size: 16px; outline: none;
        }
        .send-btn { 
            width: 50px; height: 42px; color: #333; font-weight: bold; 
            background: none; border: none; font-size: 15px; flex-shrink: 0;
        }

        /* 말풍선 */
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.4; word-break: break-all; }
        .me { align-self: flex-end; background: var(--main); }
        .o { align-self: flex-start; background: #fff; }

        /* 사이드 메뉴 */
        #side-menu {
            position: fixed; top: 0; left: calc(var(--menu-w) * -1); 
            width: var(--menu-w); height: 100%; background: #fff; z-index: 4000;
            transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }
        #side-menu.open { left: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3500; display: none; }
    </style>
</head>
<body>

    <div id="login-ui">
        <h2 style="margin-bottom:30px;">STAR TALK</h2>
        <input type="text" id="myId" class="login-input" placeholder="아이디">
        <input type="password" id="myPw" class="login-input" placeholder="비밀번호">
        <button class="btn-login" onclick="window.handleLogin()">로그인</button>
    </div>

    <div id="overlay" onclick="window.toggleMenu()"></div>

    <nav id="side-menu">
        <div style="padding:20px; border-bottom:1px solid #eee; font-weight:bold; display:flex; justify-content:space-between;">
            친구 목록 <button onclick="window.handleAddFriend()">+</button>
        </div>
        <div id="friend-list" style="padding:10px;"></div>
    </nav>

    <main id="main-app">
        <header>
            <button onclick="window.toggleMenu()" style="background:none; border:none; font-size:24px;">≡</button>
            <b id="target-title" style="font-size:16px;">상대를 선택하세요</b>
            <div style="width:24px;"></div>
        </header>

        <div id="chat-view"></div>

        <footer>
            <input type="text" id="m-in" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.handleSend()">
            <button class="send-btn" onclick="window.handleSend()">전송</button>
        </footer>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcBQ_Pyt4kdExDLGyNZJwWGbCdGDzVIjQ",
        authDomain: "starchet-e9630.firebaseapp.com",
        databaseURL: "https://starchet-e9630-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "starchet-e9630",
        appId: "1:532571302538:web:73ad808e560947ea02db73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let myId, targetId;

    window.toggleMenu = () => {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const isOpen = menu.classList.toggle('open');
        overlay.style.display = isOpen ? 'block' : 'none';
    };

    window.handleLogin = async () => {
        const id = document.getElementById('myId').value.trim().toLowerCase();
        const pw = document.getElementById('myPw').value.trim();
        if(!id || !pw) return;

        const snap = await get(ref(db, `auth/${id}`));
        if(!snap.exists() || snap.val().pw === pw) {
            if(!snap.exists()) await set(ref(db, `auth/${id}`), {pw});
            myId = id;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadFriends();
            window.toggleMenu(); // 로그인하자마자 친구 고르라고 메뉴 열어줌
        } else alert("비밀번호 틀림");
    };

    function loadFriends() {
        onValue(ref(db, `users/${myId}/f`), snap => {
            const list = document.getElementById('friend-list');
            list.innerHTML = "";
            if(snap.val()) {
                Object.keys(snap.val()).forEach(fid => {
                    const item = document.createElement('div');
                    item.style = "padding:15px; border-bottom:1px solid #eee; cursor:pointer;";
                    item.innerHTML = `👤 <b>${fid}</b>`;
                    item.onclick = () => { window.openChat(fid); window.toggleMenu(); };
                    list.appendChild(item);
                });
            }
        });
    }

    window.handleAddFriend = async () => {
        const fid = prompt("친구 ID:").toLowerCase().trim();
        if(fid && fid !== myId) {
            const check = await get(ref(db, `auth/${fid}`));
            if(check.exists()) await set(ref(db, `users/${myId}/f/${fid}`), {id: fid});
            else alert("없는 유저");
        }
    };

    window.openChat = (fid) => {
        targetId = fid;
        document.getElementById('target-title').innerText = fid;
        const rid = [myId, fid].sort().join("_");
        onValue(ref(db, `msgs/${rid}`), s => {
            const v = document.getElementById('chat-view');
            v.innerHTML = "";
            if(s.val()) {
                Object.values(s.val()).forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.s === myId ? 'me' : 'o'}`;
                    div.innerText = m.t;
                    v.appendChild(div);
                });
                v.scrollTop = v.scrollHeight;
            }
        });
    };

    window.handleSend = () => {
        const i = document.getElementById('m-in');
        if(!i.value.trim() || !targetId) return;
        const rid = [myId, targetId].sort().join("_");
        push(ref(db, `msgs/${rid}`), { t: i.value, s: myId, ts: serverTimestamp() });
        i.value = "";
        i.focus();
    };
</script>
</body>
</html>
